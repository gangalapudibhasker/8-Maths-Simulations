<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Proportional Reasoning – 2 • Ganita Prakash Grade 8</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;background:#0b0f19;color:#f1f5f9;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center;touch-action:manipulation}
.viewport-wrapper{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 25% 15%,#1e293b 0%,#0f172a 65%)}
.simulation-container{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;position:relative;box-shadow:0 25px 50px -12px rgba(0,0,0,.75);display:flex;flex-direction:column;overflow:hidden;background:#0f172a;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
.simulation-container:fullscreen,.simulation-container:-webkit-full-screen{width:100vw;height:100vh;max-width:none;max-height:none;border-radius:0;border:none}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(249,115,22,.6);border-radius:4px}
.flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-3{gap:.7rem}
.w-full{width:100%}.h-full{height:100%}.flex-1{flex:1 1 0%}.flex-shrink-0{flex-shrink:0}
.overflow-y-auto{overflow-y:auto}.overflow-hidden{overflow:hidden}.relative{position:relative}
h2{font-size:1.35rem;font-weight:800;color:#fb923c;margin-bottom:.12rem;letter-spacing:-.02em}
.sub{font-size:0.95rem;color:#94a3b8;margin-bottom:.45rem;line-height:1.4}
label{font-size:.92rem;font-weight:700;color:#e2e8f0;display:block;margin-bottom:.18rem}
.text-lg{font-size:1.15rem}.text-base{font-size:1.05rem}.text-sm{font-size:.95rem}.text-xs{font-size:.82rem}
.font-mono{font-family:ui-monospace,Menlo,Consolas,monospace}.font-bold{font-weight:700}.font-black{font-weight:900}
.orange{color:#fb923c}.amber{color:#fbbf24}.green{color:#4ade80}.red{color:#f87171}.blue{color:#60a5fa}.slate{color:#94a3b8}
.input{background:#0f172a;border:2px solid #475569;color:#fff;border-radius:.5rem;padding:.4rem .6rem;font-size:1.05rem;font-weight:700;outline:none;width:95px;text-align:center}
.input:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.3)}
.btn{cursor:pointer;border:none;border-radius:.5rem;font-weight:700;font-size:.92rem;padding:.45rem .85rem;transition:all .12s;touch-action:manipulation}
.btn-orange{background:#ea580c;color:#fff}.btn-orange:hover,.btn-orange:active{background:#f97316}
.btn-dark{background:#1e293b;color:#e2e8f0;border:1px solid #475569}.btn-dark:hover,.btn-dark:active{background:#334155}
.tab-bar{display:flex;overflow-x:auto;gap:.3rem;padding:.4rem .6rem;background:#0f172a;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.tab{display:flex;align-items:center;gap:.28rem;padding:.45rem .75rem;border-radius:.5rem;font-size:.85rem;font-weight:700;cursor:pointer;border:none;white-space:nowrap;transition:all .12s;background:transparent;color:#94a3b8;touch-action:manipulation}
.tab:hover{background:#1e293b;color:#e2e8f0}
.tab.on{background:#ea580c;color:#fff;box-shadow:0 3px 12px rgba(234,88,12,.45)}
.card{background:rgba(30,41,59,.95);border:1px solid rgba(255,255,255,.12);border-radius:.85rem;padding:.85rem 1rem;display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;gap:.55rem;align-items:flex-end;margin-bottom:.45rem}
.result-box{background:#0f172a;border:1px solid #475569;border-radius:.65rem;padding:.65rem .85rem;font-size:1rem;line-height:1.45}
.tip{margin-top:.35rem;padding:.55rem .8rem;background:rgba(251,191,36,.15);border-left:4px solid #fbbf24;border-radius:0 .5rem .5rem 0;font-size:.95rem;color:#f1f5f9;line-height:1.4}
.slider{width:100%;accent-color:#f97316}
</style>
</head>
<body>
<div id="root" class="viewport-wrapper"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

class SoundEngine {
  constructor(){ this.ctx=null; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }
  play(f=580,t=0.06){ this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,this.ctx.currentTime); g.gain.setValueAtTime(.1,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+t); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+t); }catch(e){} }
}
const sound = new SoundEngine();

// Tab 1: Map Scale & Distances
function MapScaleTab(){
  const [cmDist, setCmDist] = useState(4.5);
  const [scaleKm, setScaleKm] = useState(50); // 1 cm = 50 km

  const actualKm = cmDist * scaleKm;

  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Map Scales & Distance (పటాల్లో స్కేలు, నిష్పత్తులు)</h2>
      <p className="sub">Maps represent huge distances on paper using proportional scale factors.</p>

      <div className="row">
        <div>
          <label>Distance on Map (cm):</label>
          <input type="number" step="0.5" min="0.5" max="30" value={cmDist} onChange={e=>setCmDist(parseFloat(e.target.value)||1)} className="input" />
        </div>
        <div>
          <label>Scale (1 cm = ? km):</label>
          <input type="number" min="1" max="500" value={scaleKm} onChange={e=>setScaleKm(parseInt(e.target.value)||1)} className="input" />
        </div>
      </div>

      <div className="result-box space-y-1">
        <div>🗺️ <strong>Scale Ratio:</strong> 1 cm : {scaleKm * 100000} cm (<span className="orange">1 : {(scaleKm * 100000).toLocaleString()}</span>)</div>
        <div>📍 <strong>Actual Ground Distance:</strong> <span className="green text-lg font-bold">{actualKm.toLocaleString()} kilometers</span></div>
        <div className="text-xs text-slate-300 font-mono">Calculation: {cmDist} cm × {scaleKm} km/cm = {actualKm} km</div>
      </div>

      <div className="tip">
        📏 <strong>Proportional Rule:</strong> As distance on the map increases, real ground distance increases proportionally: \(\frac{\text{Map}_1}{\text{Real}_1} = \frac{\text{Map}_2}{\text{Real}_2}\).
      </div>
    </div>
  );
}

// Tab 2: 3-Part Ratio Sharing
function RatioShareTab(){
  const [total, setTotal] = useState(3600);
  const [r1, setR1] = useState(2);
  const [r2, setR2] = useState(3);
  const [r3, setR3] = useState(4);

  const sumR = r1 + r2 + r3;
  const s1 = (r1 / sumR) * total;
  const s2 = (r2 / sumR) * total;
  const s3 = (r3 / sumR) * total;

  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Dividing a Whole in Ratio a : b : c (నిష్పత్తిలో విభజించడం)</h2>
      <p className="sub">Split a total quantity into three parts according to a compound ratio.</p>

      <div className="row">
        <div>
          <label>Total Amount (₹):</label>
          <input type="number" value={total} onChange={e=>setTotal(Math.max(1, parseInt(e.target.value)||1))} className="input" style={{width:'110px'}} />
        </div>
        <div>
          <label>Part A:</label>
          <input type="number" min="1" value={r1} onChange={e=>setR1(Math.max(1, parseInt(e.target.value)||1))} className="input" style={{width:'60px'}} />
        </div>
        <div>
          <label>Part B:</label>
          <input type="number" min="1" value={r2} onChange={e=>setR2(Math.max(1, parseInt(e.target.value)||1))} className="input" style={{width:'60px'}} />
        </div>
        <div>
          <label>Part C:</label>
          <input type="number" min="1" value={r3} onChange={e=>setR3(Math.max(1, parseInt(e.target.value)||1))} className="input" style={{width:'60px'}} />
        </div>
      </div>

      {/* Visual Stacked Bar */}
      <div className="w-full h-7 rounded-lg overflow-hidden flex border border-slate-700 text-xs font-bold text-white">
        <div style={{width: `${(r1/sumR)*100}%`, background:'#3b82f6'}} className="flex items-center justify-center">A: ₹{Math.round(s1)}</div>
        <div style={{width: `${(r2/sumR)*100}%`, background:'#f97316'}} className="flex items-center justify-center">B: ₹{Math.round(s2)}</div>
        <div style={{width: `${(r3/sumR)*100}%`, background:'#10b981'}} className="flex items-center justify-center">C: ₹{Math.round(s3)}</div>
      </div>

      <div className="result-box space-y-1">
        <div>Sum of Ratio Terms: <strong className="amber">{r1} + {r2} + {r3} = {sumR} parts</strong></div>
        <div className="grid grid-cols-3 gap-2 mt-1">
          <div className="p-2 rounded bg-blue-950/40 border border-blue-800">
            <div className="text-blue font-bold">Share A ({r1}/{sumR})</div>
            <div className="text-lg font-black text-white">₹{Math.round(s1).toLocaleString()}</div>
          </div>
          <div className="p-2 rounded bg-orange-950/40 border border-orange-800">
            <div className="text-orange font-bold">Share B ({r2}/{sumR})</div>
            <div className="text-lg font-black text-white">₹{Math.round(s2).toLocaleString()}</div>
          </div>
          <div className="p-2 rounded bg-emerald-950/40 border border-emerald-800">
            <div className="text-emerald font-bold">Share C ({r3}/{sumR})</div>
            <div className="text-lg font-black text-white">₹{Math.round(s3).toLocaleString()}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// Tab 3: Inverse Proportion
function InversePropTab(){
  const [workers, setWorkers] = useState(4);
  const totalWork = 48; // worker-days
  const days = totalWork / workers;

  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Inverse Proportions Lab (విలోమానుపాతాలు: x · y = k)</h2>
      <p className="sub">In inverse proportion, when one quantity increases, the other decreases such that their PRODUCT remains constant.</p>

      <div>
        <label>Number of Workers: <strong className="orange">{workers} workers</strong></label>
        <input type="range" min="1" max="16" value={workers} onChange={e=>setWorkers(parseInt(e.target.value))} className="slider" />
      </div>

      <div className="result-box space-y-1">
        <div className="text-base font-bold text-white">
          Time required: <span className="green text-lg font-black">{days % 1 === 0 ? days : days.toFixed(1)} Days</span>
        </div>
        <div className="text-sm font-mono text-slate-300">
          Constant Work k = {workers} workers × {days.toFixed(1)} days = <strong>{totalWork} worker-days</strong>
        </div>
      </div>

      <div className="tip">
        ⚡ <strong>Compare with Direct Proportion:</strong>
        <br/>• Direct: \(\frac{y}{x} = k\) (e.g. More petrol \(\rightarrow\) More distance)
        <br/>• Inverse: \(x \times y = k\) (e.g. More workers \(\rightarrow\) Fewer days; Higher speed \(\rightarrow\) Less time)
      </div>
    </div>
  );
}

function App(){
  const [tab, setTab] = useState('map');
  return (
    <div className="simulation-container">
      <div className="tab-bar">
        <button className={`tab ${tab==='map'?'on':''}`} onClick={()=>{setTab('map');sound.play();}}>🗺️ Map Scales</button>
        <button className={`tab ${tab==='share'?'on':''}`} onClick={()=>{setTab('share');sound.play();}}>⚖️ Ratio Sharing</button>
        <button className={`tab ${tab==='inv'?'on':''}`} onClick={()=>{setTab('inv');sound.play();}}>🔄 Inverse Proportion</button>
      </div>
      <div className="flex-1 p-2 overflow-hidden">
        {tab === 'map' && <MapScaleTab />}
        {tab === 'share' && <RatioShareTab />}
        {tab === 'inv' && <InversePropTab />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
