<body>
<div id="root" class="viewport-wrapper"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}
const sound = new SoundEngine();

// 1. OVERVIEW & GOOGLE FLOW MIND MAP
function OverviewTab({ onJumpTab }){
  const nodes = [
    { id:'direct', title:'1. Direct Proportion', tel:'ప్రత్యక్ష అనుపాతం (x ∝ y)', color:'emerald', desc:'Two quantities increase or decrease together such that their ratio x/y remains a constant k.', formula:'x₁ / y₁ = x₂ / y₂', badge:'Direct Ratio' },
    { id:'inverse', title:'2. Inverse Proportion', tel:'విలోమ అనుపాతం (x ∝ 1/y)', color:'blue', desc:'When one quantity increases, the other decreases such that their product x × y remains constant k.', formula:'x₁ × y₁ = x₂ × y₂', badge:'Inverse Product' },
    { id:'compound', title:'3. Compound Interest (CI)', tel:'చక్రవడ్డీ గణన సూత్రం', color:'orange', desc:'Interest calculated on initial principal plus accumulated interest. Exponential growth.', formula:'A = P(1 + R/100)ⁿ', badge:'Financial Math' },
    { id:'timework', title:'4. Time, Work & Pumps', tel:'కాలము - పని - పైపులు & తొట్టెలు', color:'purple', desc:'Work rate per day is inversely proportional to time. Combined work: 1/T = 1/A + 1/B.', formula:'T = (A × B) / (A + B)', badge:'Unitary Method' },
    { id:'deprec', title:'5. Population & Depreciation', tel:'జనాభా పెరుగుదల & తరుగుదల', color:'amber', desc:'Compound increase for bacteria/population growth and compound decrease for vehicle depreciation.', formula:'V = P(1 - R/100)ⁿ', badge:'Growth / Decay' },
    { id:'figout', title:'6. Figure It Out Problems', tel:'పాఠ్యపుస్తక సాధన ప్రశ్నలు', color:'rose', desc:'Complete step-by-step solutions for all NCERT Ganita Prakash Chapter 10 exercises.', formula:'All Section 10.1 - 10.4 Problems', badge:'SCERT Textbook' }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-start flex-wrap gap-2">
        <div>
          <h2>Chapter 10: Proportional Reasoning - 2 (అనుపాత తర్కం - 2)</h2>
          <p className="sub">AP SCERT Class 8 Mathematics Semester 2 • Direct & Inverse Proportion, Compound Interest and Time & Work</p>
        </div>
        <span className="badge" style={{background:'rgba(245,158,11,0.2)',color:'#f59e0b',padding:'0.4rem 0.8rem',fontSize:'0.9rem'}}>
          🧠 Interactive Concept Flow Map
        </span>
      </div>

      <div className="flow-container">
        <div className="flow-nodes">
          {/* Central Root Node */}
          <div className="flow-root">
            <span style={{fontSize:'1.6rem',display:'block',marginBottom:'.2rem'}}>⚖️ 📈</span>
            <h3 style={{fontSize:'1.15rem',fontWeight:800,margin:0}}>Proportional Reasoning - 2</h3>
            <p style={{fontSize:'0.85rem',color:'#fef3c7',marginTop:'.2rem',marginBottom:'.4rem'}}>అనుపాత తర్కం - 2 (Direct, Inverse & Compound Interest)</p>
            <span style={{background:'rgba(0,0,0,0.3)',padding:'2px 8px',borderRadius:20,fontSize:'0.75rem',fontWeight:700}}>Grade 8 Ganita Prakash</span>
          </div>

          <div style={{textAlign:'center',color:'#94a3b8',fontSize:'0.85rem'}}>
            ⬇️ <em>Explore major concept branches below (click any card to open interactive simulation)</em> ⬇️
          </div>

          {/* Flow Branches */}
          <div className="flow-branches">
            {nodes.map(n => (
              <div key={n.id} className={`flow-card ${n.color}`} onClick={()=>{ sound.playClick(); onJumpTab(n.id); }}>
                <div className="flex justify-between items-center mb-1">
                  <span className="badge" style={{fontSize:'0.72rem',background:'rgba(255,255,255,0.1)',color:'#fff'}}>{n.badge}</span>
                  <span style={{fontSize:'0.8rem',color:'#38bdf8'}}>👉 Open Tab</span>
                </div>
                <h4 style={{fontSize:'1rem',fontWeight:800,color:'#fff',margin:'0.2rem 0'}}>{n.title}</h4>
                <div style={{fontSize:'0.82rem',color:'#cbd5e1',marginBottom:'.4rem'}}>{n.tel}</div>
                <p style={{fontSize:'0.82rem',color:'#94a3b8',lineHeight:1.35,marginBottom:'.5rem'}}>{n.desc}</p>
                <div className="result-box font-mono" style={{padding:'0.35rem 0.6rem',fontSize:'0.82rem',color:'#fef08a'}}>
                  {n.formula}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="tip-green">
        💡 <strong>Key Principle:</strong> Direct proportion means <code>x/y = k (constant ratio)</code> — e.g. more petrol = more distance travelled. Inverse proportion means <code>x × y = k (constant product)</code> — e.g. more workers = fewer days needed!
      </div>
    </div>
  );
}

// 2. DIRECT PROPORTION VISUALIZER
function DirectPropTab(){
  const [speed, setSpeed] = useState(50); // km/h
  const [time, setTime] = useState(3); // hours

  const distance = speed * time;

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Direct Proportion Visualizer (ప్రత్యక్ష అనుపాతం: x / y = k)</h2>
      <p className="sub">When speed is constant, Distance travelled is directly proportional to Time: Distance ∝ Time.</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        <div className="space-y-3">
          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Constant Speed (స్థిర వేగం k):</label>
              <span className="font-bold orange">{speed} km/h</span>
            </div>
            <input type="range" min="20" max="100" step="5" value={speed} className="slider" onChange={e=>{ sound.playClick(); setSpeed(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Time Taken (కాలం T):</label>
              <span className="font-bold blue">{time} hours</span>
            </div>
            <input type="range" min="1" max="10" value={time} className="slider" onChange={e=>{ sound.playClick(); setTime(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-1">
            <div className="text-xs font-bold green">Direct Proportion Formula:</div>
            <div className="font-mono text-sm">Distance (D) = Speed (k) × Time (T)</div>
            <div className="text-xl font-black green">
              D = {speed} × {time} = {distance} km
            </div>
            <div className="text-xs slate">Notice: D / T = {distance} / {time} = {speed} (constant!)</div>
          </div>
        </div>

        {/* Linear Graph SVG */}
        <div className="result-box flex justify-center items-center p-2" style={{minHeight:240,background:'#070b14'}}>
          <svg width="240" height="220" viewBox="0 0 240 220">
            {/* Axes */}
            <line x1="30" y1="190" x2="220" y2="190" stroke="#64748b" strokeWidth="2" />
            <line x1="30" y1="190" x2="30" y2="20" stroke="#64748b" strokeWidth="2" />
            <text x="210" y="210" fill="#94a3b8" fontSize="10">Time (h)</text>
            <text x="35" y="30" fill="#94a3b8" fontSize="10">Distance (km)</text>

            {/* Direct proportion straight line through origin */}
            <line x1="30" y1="190" x2="210" y2="30" stroke="#10b981" strokeWidth="3" />

            {/* Current Point */}
            <circle cx={30 + (time / 10)*180} cy={190 - (time / 10)*160} r="6" fill="#f97316" stroke="#fff" strokeWidth="2" />
            <text x={35 + (time / 10)*180} y={185 - (time / 10)*160} fill="#f97316" fontSize="11" fontWeight="bold">({time}h, {distance}km)</text>
          </svg>
        </div>
      </div>
    </div>
  );
}

// 3. INVERSE PROPORTION VISUALIZER
function InversePropTab(){
  const [workers, setWorkers] = useState(4);
  const totalWork = 48; // worker-days

  const days = (totalWork / workers).toFixed(1);

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Inverse Proportion Lab (విలోమ అనుపాతం: x × y = k)</h2>
      <p className="sub">Number of workers and time taken to complete a fixed piece of work are inversely proportional.</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        <div className="space-y-3">
          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Number of Workers (కూలీల సంఖ్య):</label>
              <span className="font-bold orange">{workers} workers</span>
            </div>
            <input type="range" min="1" max="24" value={workers} className="slider" onChange={e=>{ sound.playClick(); setWorkers(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-1">
            <div className="text-xs font-bold amber">Constant Total Work k = 48 worker-days:</div>
            <div className="font-mono text-sm">Workers (x) × Days (y) = 48</div>
            <div className="text-xl font-black text-blue-400">
              Days needed = 48 ÷ {workers} = {days} days
            </div>
            <div className="text-xs slate mt-1">If workers double (× 2), days halve (÷ 2)!</div>
          </div>

          <div className="row gap-2">
            {[1, 2, 4, 6, 8, 12, 24].map(w => (
              <button key={w} className="btn btn-dark btn-sm" onClick={()=>{ sound.playClick(); setWorkers(w); }}>
                {w} workers
              </button>
            ))}
          </div>
        </div>

        {/* Hyperbola curve SVG */}
        <div className="result-box flex justify-center items-center p-2" style={{minHeight:240,background:'#070b14'}}>
          <svg width="240" height="220" viewBox="0 0 240 220">
            {/* Axes */}
            <line x1="30" y1="190" x2="220" y2="190" stroke="#64748b" strokeWidth="2" />
            <line x1="30" y1="190" x2="30" y2="20" stroke="#64748b" strokeWidth="2" />
            <text x="200" y="210" fill="#94a3b8" fontSize="10">Workers (x)</text>
            <text x="35" y="30" fill="#94a3b8" fontSize="10">Days (y)</text>

            {/* Inverse curve points */}
            <path d="M 38 30 Q 60 140 210 182" fill="none" stroke="#38bdf8" strokeWidth="3" />

            {/* Current Point */}
            <circle cx={30 + (workers/24)*170} cy={190 - (Number(days)/48)*160} r="6" fill="#f43f5e" stroke="#fff" strokeWidth="2" />
            <text x={35 + (workers/24)*170} y={175 - (Number(days)/48)*160} fill="#f43f5e" fontSize="11" fontWeight="bold">({workers}w, {days}d)</text>
          </svg>
        </div>
      </div>
    </div>
  );
}

// 4. COMPOUND INTEREST VS SIMPLE INTEREST
function CompoundInterestTab(){
  const [p, setP] = useState(10000);
  const [r, setR] = useState(10);
  const [n, setN] = useState(3);

  const si = (p * r * n) / 100;
  const siTotal = p + si;

  const ciTotal = p * Math.pow(1 + r/100, n);
  const ci = ciTotal - p;

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Compound Interest vs Simple Interest (చక్రవడ్డీ vs బారువడ్డీ)</h2>
      <p className="sub">Observe how compounding produces "interest on interest", creating exponential returns over time.</p>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div className="result-box space-y-1">
          <label className="text-xs">Principal (అసలు P ₹):</label>
          <input type="number" className="input w-full" value={p} step="1000" onChange={e=>setP(Number(e.target.value))} />
        </div>
        <div className="result-box space-y-1">
          <label className="text-xs">Annual Rate (వడ్డీ రేటు R %):</label>
          <input type="number" className="input w-full" value={r} step="1" onChange={e=>setR(Number(e.target.value))} />
        </div>
        <div className="result-box space-y-1">
          <label className="text-xs">Time Period (కాలం n years):</label>
          <input type="number" className="input w-full" value={n} min="1" max="10" onChange={e=>setN(Number(e.target.value))} />
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div className="p-3 bg-blue-950 border border-blue-600 rounded-lg space-y-1">
          <div className="text-xs font-bold text-blue-300">Simple Interest (బారువడ్డీ):</div>
          <div className="font-mono text-xs">SI = (P × T × R) ÷ 100</div>
          <div className="text-lg font-black text-blue-400">Total Interest: ₹{si.toFixed(2)}</div>
          <div className="text-sm">Total Amount: <strong>₹{siTotal.toFixed(2)}</strong></div>
        </div>

        <div className="p-3 bg-orange-950 border border-orange-500 rounded-lg space-y-1">
          <div className="text-xs font-bold text-orange-300">Compound Interest (చక్రవడ్డీ):</div>
          <div className="font-mono text-xs">A = P(1 + R/100)ⁿ,  CI = A - P</div>
          <div className="text-lg font-black orange">Total Interest: ₹{ci.toFixed(2)}</div>
          <div className="text-sm">Total Amount: <strong>₹{ciTotal.toFixed(2)}</strong></div>
        </div>
      </div>

      <div className="result-box font-bold text-center green text-base">
        🌟 Compound Interest Extra Gain: ₹{(ci - si).toFixed(2)} more than Simple Interest!
      </div>
    </div>
  );
}

// 5. TIME AND WORK PROBLEMS
function TimeWorkTab(){
  const [daysA, setDaysA] = useState(6);
  const [daysB, setDaysB] = useState(12);

  const combinedDays = (daysA * daysB) / (daysA + daysB);

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Time, Work & Pipes (కాలము - పని - పైపులు)</h2>
      <p className="sub">If A does a work in X days and B does it in Y days, find how many days they take working together.</p>

      <div className="row gap-3">
        <div className="result-box">
          <label>Days for Person A alone:</label>
          <input type="number" min="1" className="input" value={daysA} onChange={e=>setDaysA(Math.max(1, Number(e.target.value)))} style={{width:90}} />
        </div>
        <div className="result-box">
          <label>Days for Person B alone:</label>
          <input type="number" min="1" className="input" value={daysB} onChange={e=>setDaysB(Math.max(1, Number(e.target.value)))} style={{width:90}} />
        </div>
      </div>

      <div className="result-box space-y-2">
        <div className="text-sm font-bold amber">Unitary Rate Breakdown:</div>
        <div className="text-sm">1. Work done by A in 1 day = 1 / {daysA} of the work</div>
        <div className="text-sm">2. Work done by B in 1 day = 1 / {daysB} of the work</div>
        <div className="text-sm">3. Combined 1-day work = 1/{daysA} + 1/{daysB} = ({daysA + daysB}) / ({daysA * daysB})</div>
        <div className="mt-2 p-3 bg-slate-900 border border-slate-700 rounded-lg text-lg font-black green">
          Total time together T = ({daysA} × {daysB}) ÷ ({daysA} + {daysB}) = {combinedDays.toFixed(2)} days!
        </div>
      </div>
    </div>
  );
}

// 6. FIGURE IT OUT STEP-BY-STEP PROBLEMS
function FigOutTab(){
  const [activeProb, setActiveProb] = useState(0);

  const problems = [
    {
      q: "Q1. If 15 workers can build a wall in 48 hours, how many workers will be required for the same work in 30 hours?",
      tel: "ప్రశ్న 1: 15 మంది కూలీలు ఒక గోడను 48 గంటల్లో నిర్మించగలరు. అదే పనిని 30 గంటల్లో పూర్తి చేయుటకు ఎంతమంది కూలీలు కావలెను?",
      steps: [
        "Time and number of workers are in INVERSE proportion (x₁ × y₁ = x₂ × y₂).",
        "Here: x₁ = 15 workers, y₁ = 48 hours. y₂ = 30 hours.",
        "15 × 48 = x₂ × 30",
        "720 = 30 × x₂  →  x₂ = 720 ÷ 30 = 24 workers"
      ],
      ans: "24 workers are needed."
    },
    {
      q: "Q2. A car travels 432 km on 30 litres of petrol. How far will it travel on 20 litres of petrol?",
      tel: "ప్రశ్న 2: ఒక కారు 30 లీటర్ల పెట్రోల్‌తో 432 కి.మీ ప్రయాణించెను. 20 లీటర్ల పెట్రోల్‌తో అది ఎంత దూరం ప్రయాణించును?",
      steps: [
        "Distance and petrol are in DIRECT proportion (x₁ / y₁ = x₂ / y₂).",
        "Distance in 1 litre = 432 ÷ 30 = 14.4 km",
        "Distance in 20 litres = 14.4 × 20 = 288 km"
      ],
      ans: "Distance = 288 km"
    },
    {
      q: "Q3. Calculate the compound interest on ₹12,600 for 2 years at 10% per annum compounded annually.",
      tel: "ప్రశ్న 3: ₹12,600 పై 2 సంవత్సరములకు సంవత్సరానికి 10% చక్రవడ్డీ రేటున మొత్తం మరియు చక్రవడ్డీ కనుగొనండి.",
      steps: [
        "P = ₹12,600, R = 10%, n = 2 years",
        "A = P(1 + R/100)ⁿ = 12600 × (1 + 10/100)² = 12600 × (11/10) × (11/10)",
        "A = 126 × 121 = ₹15,246",
        "Compound Interest (CI) = A - P = 15,246 - 12,600 = ₹2,646"
      ],
      ans: "Amount = ₹15,246, CI = ₹2,646"
    }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Figure It Out Textbook Solutions (సాధించిన సమస్యలు)</h2>
      <p className="sub">Step-by-step verified solutions for NCERT Ganita Prakash Chapter 10 problems.</p>

      <div className="flex gap-2 mb-2">
        {problems.map((p, idx) => (
          <button 
            key={idx} 
            className={`btn btn-sm ${activeProb===idx ? 'btn-orange' : 'btn-dark'}`}
            onClick={()=>{ sound.playClick(); setActiveProb(idx); }}
          >
            Problem {idx+1}
          </button>
        ))}
      </div>

      <div className="result-box space-y-2">
        <h3 className="text-base font-bold orange">{problems[activeProb].q}</h3>
        <p className="text-sm slate">{problems[activeProb].tel}</p>

        <div className="mt-3 p-3 bg-slate-900 rounded-lg space-y-2 border border-slate-700">
          <div className="text-xs font-bold text-yellow-400">Step-by-Step Solution:</div>
          {problems[activeProb].steps.map((st, i) => (
            <div key={i} className="text-sm text-slate-200 pl-3 border-l-2 border-orange-500">
              {st}
            </div>
          ))}
          <div className="mt-2 pt-2 border-t border-slate-700 font-bold green text-base">
            ✅ Solution: {problems[activeProb].ans}
          </div>
        </div>
      </div>
    </div>
  );
}

// 7. QUIZ TAB
function QuizTab(){
  const [selected, setSelected] = useState({});
  const [score, setScore] = useState(null);

  const questions = [
    {
      q: "If x and y are in inverse proportion, which of the following is constant?",
      opts: ["x + y", "x - y", "x / y", "x × y"],
      ans: 3,
      exp: "In inverse proportion, the product x × y remains constant."
    },
    {
      q: "If 10 pens cost ₹50, what is the cost of 15 pens?",
      opts: ["₹60", "₹75", "₹70", "₹80"],
      ans: 1,
      exp: "Direct proportion: Cost of 1 pen = 50/10 = ₹5. Cost of 15 pens = 15 × 5 = ₹75."
    },
    {
      q: "What is the formula for compound amount compounded annually?",
      opts: ["A = P(1 + R/100)ⁿ", "A = P(1 + nR/100)", "A = PRT/100", "A = P(1 - R/100)"],
      ans: 0,
      exp: "A = P(1 + R/100)ⁿ where n is time in years."
    },
    {
      q: "If A can do a job in 4 days and B in 4 days, together they will finish in:",
      opts: ["4 days", "8 days", "2 days", "1 day"],
      ans: 2,
      exp: "1/4 + 1/4 = 2/4 = 1/2. Time = 2 days."
    }
  ];

  const handleSelect = (qIdx, optIdx) => {
    sound.playClick();
    setSelected({ ...selected, [qIdx]: optIdx });
  };

  const calculateScore = () => {
    let s = 0;
    questions.forEach((q, i) => {
      if (selected[i] === q.ans) s++;
    });
    setScore(s);
    sound.playSuccess();
  };

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-center">
        <h2>Chapter 10 Mastery Quiz (స్వీయ మూల్యాంకనం)</h2>
        {score !== null && (
          <span className="badge" style={{background:'#10b981',color:'#fff',padding:'0.4rem 0.8rem',fontSize:'1rem'}}>
            Score: {score} / {questions.length}
          </span>
        )}
      </div>

      <div className="space-y-3">
        {questions.map((q, qIdx) => (
          <div key={qIdx} className="result-box space-y-2">
            <div className="text-sm font-bold text-white">{qIdx+1}. {q.q}</div>
            <div className="space-y-1">
              {q.opts.map((opt, oIdx) => {
                let cls = "quiz-opt";
                if (score !== null) {
                  if (oIdx === q.ans) cls += " correct";
                  else if (selected[qIdx] === oIdx) cls += " wrong";
                  cls += " disabled";
                } else if (selected[qIdx] === oIdx) {
                  cls += " border-orange-500 bg-orange-950";
                }
                return (
                  <div key={oIdx} className={cls} onClick={()=>handleSelect(qIdx, oIdx)}>
                    <span style={{fontWeight:800}}>{String.fromCharCode(65+oIdx)}.</span>
                    <span>{opt}</span>
                  </div>
                );
              })}
            </div>
            {score !== null && (
              <div className="text-xs text-yellow-300 mt-1">
                💡 <strong>Explanation:</strong> {q.exp}
              </div>
            )}
          </div>
        ))}
      </div>

      <div className="text-center pt-2">
        {score === null ? (
          <button className="btn btn-orange text-base" onClick={calculateScore}>
            Submit Quiz & Check Score
          </button>
        ) : (
          <button className="btn btn-dark text-base" onClick={()=>{ setSelected({}); setScore(null); }}>
            Retake Quiz
          </button>
        )}
      </div>
    </div>
  );
}

// 8. WHITEBOARD TAB
function WhiteboardTab(){
  const canvasRef = useRef(null);
  const [color, setColor] = useState('#f59e0b');
  const [size, setSize] = useState(5);
  const drawingRef = useRef(false);

  useEffect(()=>{
    const c = canvasRef.current;
    if(!c) return;
    const ctx = c.getContext('2d');
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  },[]);

  const startDraw = (e)=>{ drawingRef.current = true; draw(e); };
  const endDraw = ()=>{ drawingRef.current = false; };
  const draw = (e)=>{
    if(!drawingRef.current) return;
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    const rect = c.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const clear = ()=>{
    sound.playClick();
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  };

  return (
    <div className="card h-full flex flex-col space-y-2 overflow-hidden">
      <div className="flex justify-between items-center flex-wrap gap-2 flex-shrink-0">
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold slate">Color:</span>
          {['#f59e0b','#f97316','#10b981','#38bdf8','#ffffff','#f87171'].map(c=>(
            <button key={c} onClick={()=>{sound.playClick();setColor(c)}}
              style={{width:24,height:24,borderRadius:'50%',border:color===c?'2px solid #fff':'none',background:c,cursor:'pointer'}}/>
          ))}
          <span className="text-xs font-bold slate ml-2">Size:</span>
          {[3, 6, 12].map(s=>(
            <button key={s} className={`btn btn-sm ${size===s?'btn-orange':'btn-dark'}`} onClick={()=>{sound.playClick();setSize(s)}}>{s}px</button>
          ))}
        </div>
        <button className="btn btn-sm" style={{background:'#dc2626',color:'#fff'}} onClick={clear}>Clear Board</button>
      </div>

      <div className="flex-1 rounded-xl overflow-hidden border border-slate-600 relative" style={{minHeight:0,touchAction:'none'}}>
        <canvas 
          ref={canvasRef} 
          style={{width:'100%',height:'100%',display:'block',cursor:'crosshair'}}
          onMouseDown={startDraw} onMouseUp={endDraw} onMouseMove={draw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchEnd={endDraw} onTouchMove={draw}
        />
      </div>
      <p className="text-xs slate text-center flex-shrink-0">Interactive Proportion Scratchpad • Draw direct proportion lines, hyperbola curves, and CI compound growth.</p>
    </div>
  );
}
