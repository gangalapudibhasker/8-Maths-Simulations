<style>

<body>
<div id="root" class="viewport-wrapper"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}
const sound = new SoundEngine();

// 1. OVERVIEW & GOOGLE FLOW MIND MAP
function OverviewTab({ onJumpTab }){
  const nodes = [
    { id:'mind', title:'1. Number Tricks & Mind Reader', tel:'గణిత మ్యాజిక్ - మనసులోని సంఖ్య', color:'rose', desc:'Algebra reveals why mathematical magic tricks always work regardless of the starting number chosen.', formula:'2(x + 5) / 2 - x = 5', badge:'Algebra Magic' },
    { id:'geom', title:'2. Geometric (a + b)² Model', tel:'(a + b)² జ్యామితీయ నమూనా', color:'blue', desc:'A square of side (a + b) dissected into 4 area pieces: square a², square b², and two rectangles ab.', formula:'(a + b)² = a² + 2ab + b²', badge:'Visual Proof' },
    { id:'ident', title:'3. The 4 Standard Identities', tel:'4 ప్రామాణిక బీజగణిత సర్వసమీకరణాలు', color:'emerald', desc:'Core algebraic formulas for grade 8: (a+b)², (a-b)², (a+b)(a-b) = a²-b², and (x+a)(x+b).', formula:'(a - b)² = a² - 2ab + b²', badge:'Identities' },
    { id:'diffsq', title:'4. Difference of Two Squares', tel:'వర్గాల భేదం: a² - b²', color:'purple', desc:'The factorization identity (a + b)(a - b) = a² - b². Fast mental multiplication for numbers like 52 × 48.', formula:'52 × 48 = (50+2)(50-2) = 2496', badge:'Fast Math' },
    { id:'factor', title:'5. Factorization Lab', tel:'కారణాంకాలుగా విభజించుట', color:'amber', desc:'Factoring quadratic polynomials by grouping and middle-term splitting: x² + (a+b)x + ab = (x+a)(x+b).', formula:'x² + 5x + 6 = (x + 2)(x + 3)', badge:'Factorization' },
    { id:'figout', title:'6. Figure It Out Problems', tel:'పాఠ్యపుస్తక సాధన ప్రశ్నలు', color:'orange', desc:'Complete step-by-step solutions for all NCERT Ganita Prakash Chapter 13 exercises.', formula:'All 13.1 - 13.4 Problems Solved', badge:'SCERT Textbook' }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-start flex-wrap gap-2">
        <div>
          <h2>Chapter 13: Algebra Play (బీజగణితంతో ఆట)</h2>
          <p className="sub">AP SCERT Class 8 Mathematics Semester 2 • Identities, Geometric Dissections & Factorization</p>
        </div>
        <span className="badge" style={{background:'rgba(244,63,94,0.2)',color:'#fb7185',padding:'0.4rem 0.8rem',fontSize:'0.9rem'}}>
          🧠 Interactive Concept Flow Map
        </span>
      </div>

      <div className="flow-container">
        <div className="flow-nodes">
          {/* Central Root Node */}
          <div className="flow-root">
            <span style={{fontSize:'1.6rem',display:'block',marginBottom:'.2rem'}}>🎭 🔤</span>
            <h3 style={{fontSize:'1.15rem',fontWeight:800,margin:0}}>Algebra Play</h3>
            <p style={{fontSize:'0.85rem',color:'#ffe4e6',marginTop:'.2rem',marginBottom:'.4rem'}}>బీజగణితంతో ఆట (Expressions, Identities & Factorization)</p>
            <span style={{background:'rgba(0,0,0,0.3)',padding:'2px 8px',borderRadius:20,fontSize:'0.75rem',fontWeight:700}}>Grade 8 Ganita Prakash</span>
          </div>

          <div style={{textAlign:'center',color:'#94a3b8',fontSize:'0.85rem'}}>
            ⬇️ <em>Explore major concept branches below (click any card to open interactive simulation)</em> ⬇️
          </div>

          {/* Flow Branches */}
          <div className="flow-branches">
            {nodes.map(n => (
              <div key={n.id} className={`flow-card ${n.color}`} onClick={()=>{ sound.playClick(); onJumpTab(n.id); }}>
                <div className="flex justify-between items-center mb-1">
                  <span className="badge" style={{fontSize:'0.72rem',background:'rgba(255,255,255,0.1)',color:'#fff'}}>{n.badge}</span>
                  <span style={{fontSize:'0.8rem',color:'#38bdf8'}}>👉 Open Tab</span>
                </div>
                <h4 style={{fontSize:'1rem',fontWeight:800,color:'#fff',margin:'0.2rem 0'}}>{n.title}</h4>
                <div style={{fontSize:'0.82rem',color:'#cbd5e1',marginBottom:'.4rem'}}>{n.tel}</div>
                <p style={{fontSize:'0.82rem',color:'#94a3b8',lineHeight:1.35,marginBottom:'.5rem'}}>{n.desc}</p>
                <div className="result-box font-mono" style={{padding:'0.35rem 0.6rem',fontSize:'0.82rem',color:'#fef08a'}}>
                  {n.formula}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="tip">
        💡 <strong>What is an Algebraic Identity?</strong> An identity is an equality that holds true for <em>ALL possible values</em> of its variables. For example, <code>(a + b)² = a² + 2ab + b²</code> is true whether a = 3, b = 4 or a = 100, b = 250!
      </div>
    </div>
  );
}

// 2. "THINK OF A NUMBER" MIND READER
function MindReaderTab(){
  const [secret, setSecret] = useState(7);
  const [showProof, setShowProof] = useState(false);

  // Magic Steps
  const step1 = secret;
  const step2 = secret * 2;
  const step3 = step2 + 10;
  const step4 = step3 / 2;
  const step5 = step4 - secret; // always 5!

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>"Think of a Number" Mind Reader (మనసులోని సంఖ్య మ్యాజిక్)</h2>
      <p className="sub">Pick ANY secret number x. Follow the steps. Notice how the final answer is ALWAYS 5 regardless of x!</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        <div className="space-y-3">
          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Pick your Secret Number (x):</label>
              <span className="text-xl font-black orange font-mono">x = {secret}</span>
            </div>
            <input type="range" min="1" max="100" value={secret} className="slider" onChange={e=>{ sound.playClick(); setSecret(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-2 text-sm">
            <div>1. Your Secret Number: <strong className="orange">{secret}</strong></div>
            <div>2. Multiply by 2: {secret} × 2 = <strong className="blue">{step2}</strong></div>
            <div>3. Add 10: {step2} + 10 = <strong className="amber">{step3}</strong></div>
            <div>4. Divide by 2: {step3} ÷ 2 = <strong className="purple">{step4}</strong></div>
            <div>5. Subtract your original secret number: {step4} - {secret} = <strong className="green text-xl font-black">{step5}</strong></div>
          </div>

          <div className="p-3 bg-emerald-950 border border-emerald-600 rounded-lg text-center font-bold green text-lg">
            🎩 The Final Result is ALWAYS: {step5}!
          </div>
        </div>

        {/* Algebraic proof box */}
        <div className="result-box space-y-2">
          <div className="flex justify-between items-center">
            <span className="text-xs font-bold text-yellow-400">The Secret Algebraic Proof:</span>
            <button className="btn btn-sm btn-dark" onClick={()=>{ sound.playClick(); setShowProof(!showProof); }}>
              {showProof ? 'Hide Proof' : 'Reveal Secret Algebra'}
            </button>
          </div>

          <div className="p-3 bg-slate-900 border border-slate-700 rounded-lg space-y-1 font-mono text-xs">
            <div>Step 1: Let the chosen number be = <strong>x</strong></div>
            <div>Step 2: Multiply by 2 → <strong>2x</strong></div>
            <div>Step 3: Add 10 → <strong>2x + 10</strong></div>
            <div>Step 4: Divide by 2 → (2x + 10) / 2 = <strong>x + 5</strong></div>
            <div>Step 5: Subtract original x → (x + 5) - x = <strong>5</strong></div>
            <div className="text-yellow-300 font-bold mt-2">
              The variable x completely eliminates itself: x - x = 0! Only the constant 5 remains!
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// 3. GEOMETRIC IDENTITY VISUALIZER: (a + b)²
function GeometricIdentTab(){
  const [a, setA] = useState(6);
  const [b, setB] = useState(3);

  const aSq = a * a;
  const bSq = b * b;
  const ab = a * b;
  const totalSide = a + b;
  const totalArea = totalSide * totalSide;

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Geometric Proof of (a + b)² = a² + 2ab + b²</h2>
      <p className="sub">A square of side (a + b) is partitioned into four regions. Move the sliders to see the visual dissection.</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        {/* SVG Dissection */}
        <div className="result-box flex justify-center items-center p-2" style={{minHeight:260,background:'#070b14'}}>
          <svg width="240" height="240" viewBox="0 0 240 240">
            {/* Scale: totalSide = 200px */}
            {/* aWidth = (a / totalSide) * 200 */}
            {/* bWidth = (b / totalSide) * 200 */}
            <g transform="translate(20, 20)">
              {/* Region 1: a x a square (Blue) */}
              <rect x="0" y="0" width={(a/totalSide)*200} height={(a/totalSide)*200} fill="rgba(59,130,246,0.4)" stroke="#3b82f6" strokeWidth="2" />
              <text x={(a/totalSide)*100} y={(a/totalSide)*100 + 4} fill="#93c5fd" fontSize="12" fontWeight="bold" textAnchor="middle">a² = {aSq}</text>

              {/* Region 2: a x b rectangle (Orange) */}
              <rect x={(a/totalSide)*200} y="0" width={(b/totalSide)*200} height={(a/totalSide)*200} fill="rgba(249,115,22,0.4)" stroke="#f97316" strokeWidth="2" />
              <text x={(a/totalSide)*200 + (b/totalSide)*100} y={(a/totalSide)*100 + 4} fill="#fdba74" fontSize="11" fontWeight="bold" textAnchor="middle">ab = {ab}</text>

              {/* Region 3: b x a rectangle (Orange) */}
              <rect x="0" y={(a/totalSide)*200} width={(a/totalSide)*200} height={(b/totalSide)*200} fill="rgba(249,115,22,0.4)" stroke="#f97316" strokeWidth="2" />
              <text x={(a/totalSide)*100} y={(a/totalSide)*200 + (b/totalSide)*100 + 4} fill="#fdba74" fontSize="11" fontWeight="bold" textAnchor="middle">ab = {ab}</text>

              {/* Region 4: b x b square (Green) */}
              <rect x={(a/totalSide)*200} y={(a/totalSide)*200} width={(b/totalSide)*200} height={(b/totalSide)*200} fill="rgba(16,185,129,0.4)" stroke="#10b981" strokeWidth="2" />
              <text x={(a/totalSide)*200 + (b/totalSide)*100} y={(a/totalSide)*200 + (b/totalSide)*100 + 4} fill="#6ee7b7" fontSize="11" fontWeight="bold" textAnchor="middle">b² = {bSq}</text>
            </g>
          </svg>
        </div>

        {/* Sliders & Math */}
        <div className="space-y-3">
          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Dimension a:</label>
              <span className="font-bold blue font-mono text-lg">a = {a}</span>
            </div>
            <input type="range" min="2" max="10" value={a} className="slider" onChange={e=>{ sound.playClick(); setA(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Dimension b:</label>
              <span className="font-bold orange font-mono text-lg">b = {b}</span>
            </div>
            <input type="range" min="1" max="8" value={b} className="slider" onChange={e=>{ sound.playClick(); setB(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-1 font-mono text-sm">
            <div>Total Side = {a} + {b} = <strong>{totalSide}</strong></div>
            <div>Total Area (a + b)² = {totalSide}² = <strong className="green text-base">{totalArea}</strong></div>
            <div className="pt-2 border-t border-slate-700">
              Sum of 4 pieces = a² + 2ab + b²<br />
              = {aSq} + 2({ab}) + {bSq} = {aSq} + {2*ab} + {bSq} = <strong className="green text-base">{totalArea}</strong> ✔
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// 4. FACTORIZATION LAB
function FactorizeTab(){
  const [valA, setValA] = useState(2);
  const [valB, setValB] = useState(3);

  const sum = valA + valB;
  const prod = valA * valB;

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Polynomial Factorization Lab (కారణాంకాలుగా విభజించుట)</h2>
      <p className="sub">Master the standard identity: (x + a)(x + b) = x² + (a + b)x + ab. Factorize quadratic expressions easily!</p>

      <div className="row gap-3">
        <div className="result-box">
          <label>Constant a:</label>
          <input type="number" className="input" value={valA} onChange={e=>setValA(Number(e.target.value))} style={{width:80}} />
        </div>
        <div className="result-box">
          <label>Constant b:</label>
          <input type="number" className="input" value={valB} onChange={e=>setValB(Number(e.target.value))} style={{width:80}} />
        </div>

        <div className="flex gap-2">
          {[[2,3], [1,5], [4,4], [3,7], [2,-3]].map(([x,y]) => (
            <button key={`${x},${y}`} className="btn btn-dark btn-sm" onClick={()=>{ sound.playClick(); setValA(x); setValB(y); }}>
              a={x}, b={y}
            </button>
          ))}
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div className="p-4 bg-slate-900 border border-slate-700 rounded-xl space-y-2 font-mono">
          <div className="text-xs text-yellow-400 font-bold">EXPANDED QUADRATIC POLYNOMIAL:</div>
          <div className="text-2xl font-black orange">
            x² {sum >= 0 ? `+ ${sum}x` : `- ${Math.abs(sum)}x`} {prod >= 0 ? `+ ${prod}` : `- ${Math.abs(prod)}`}
          </div>
          <div className="text-xs slate">
            Middle coefficient = a + b = {valA} + {valB} = {sum}<br />
            Constant term = a × b = {valA} × {valB} = {prod}
          </div>
        </div>

        <div className="p-4 bg-emerald-950 border border-emerald-600 rounded-xl space-y-2 font-mono">
          <div className="text-xs text-emerald-300 font-bold">FACTORIZED FORM:</div>
          <div className="text-2xl font-black green">
            (x {valA >= 0 ? `+ ${valA}` : `- ${Math.abs(valA)}`})(x {valB >= 0 ? `+ ${valB}` : `- ${Math.abs(valB)}`})
          </div>
          <div className="text-xs slate">
            Split into two linear factors (రెండు రేఖీయ కారణాంకాలు)!
          </div>
        </div>
      </div>
    </div>
  );
}

// 5. FIGURE IT OUT STEP-BY-STEP PROBLEMS
function FigOutTab(){
  const [activeProb, setActiveProb] = useState(0);

  const problems = [
    {
      q: "Q1. Using suitable identity, evaluate: (103)².",
      tel: "ప్రశ్న 1: తగిన సర్వసమీకరణం ఉపయోగించి (103)² విలువ కనుగొనండి.",
      steps: [
        "Express 103 as (100 + 3)",
        "Apply Identity I: (a + b)² = a² + 2ab + b² with a = 100, b = 3",
        "(100 + 3)² = (100)² + 2(100)(3) + (3)²",
        "= 10,000 + 600 + 9 = 10,609"
      ],
      ans: "(103)² = 10,609"
    },
    {
      q: "Q2. Evaluate 53 × 47 using the difference of two squares identity.",
      tel: "ప్రశ్న 2: 53 × 47 విలువను వర్గాల భేదం సర్వసమీకరణం ద్వారా కనుగొనండి.",
      steps: [
        "Notice that 53 = 50 + 3 and 47 = 50 - 3",
        "Apply Identity III: (a + b)(a - b) = a² - b² with a = 50, b = 3",
        "53 × 47 = (50 + 3)(50 - 3) = 50² - 3²",
        "= 2,500 - 9 = 2,491"
      ],
      ans: "53 × 47 = 2,491"
    },
    {
      q: "Q3. Factorize: x² + 8x + 15.",
      tel: "ప్రశ్న 3: x² + 8x + 15 ను కారణాంకాలుగా విభజించండి.",
      steps: [
        "Find two numbers a and b such that their sum a + b = 8 and product a × b = 15.",
        "The factor pairs of 15 are (1, 15) and (3, 5).",
        "Since 3 + 5 = 8 and 3 × 5 = 15, we choose a = 3, b = 5.",
        "Using Identity IV: x² + (a+b)x + ab = (x + a)(x + b)",
        "x² + 8x + 15 = (x + 3)(x + 5)"
      ],
      ans: "(x + 3)(x + 5)"
    }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Figure It Out Textbook Solutions (సాధించిన సమస్యలు)</h2>
      <p className="sub">Step-by-step verified solutions for NCERT Ganita Prakash Chapter 13 problems.</p>

      <div className="flex gap-2 mb-2">
        {problems.map((p, idx) => (
          <button 
            key={idx} 
            className={`btn btn-sm ${activeProb===idx ? 'btn-orange' : 'btn-dark'}`}
            onClick={()=>{ sound.playClick(); setActiveProb(idx); }}
          >
            Problem {idx+1}
          </button>
        ))}
      </div>

      <div className="result-box space-y-2">
        <h3 className="text-base font-bold orange">{problems[activeProb].q}</h3>
        <p className="text-sm slate">{problems[activeProb].tel}</p>

        <div className="mt-3 p-3 bg-slate-900 rounded-lg space-y-2 border border-slate-700">
          <div className="text-xs font-bold text-yellow-400">Step-by-Step Solution:</div>
          {problems[activeProb].steps.map((st, i) => (
            <div key={i} className="text-sm text-slate-200 pl-3 border-l-2 border-orange-500">
              {st}
            </div>
          ))}
          <div className="mt-2 pt-2 border-t border-slate-700 font-bold green text-base">
            ✅ Solution: {problems[activeProb].ans}
          </div>
        </div>
      </div>
    </div>
  );
}

// 6. QUIZ TAB
function QuizTab(){
  const [selected, setSelected] = useState({});
  const [score, setScore] = useState(null);

  const questions = [
    {
      q: "What is the expansion of (a - b)²?",
      opts: ["a² - b²", "a² - 2ab + b²", "a² + 2ab - b²", "a² - 2ab - b²"],
      ans: 1,
      exp: "(a - b)² = a² - 2ab + b²."
    },
    {
      q: "Evaluate 98² using algebraic identity:",
      opts: ["9,604", "9,800", "9,600", "9,404"],
      ans: 0,
      exp: "(100 - 2)² = 100² - 2(100)(2) + 2² = 10,000 - 400 + 4 = 9,604."
    },
    {
      q: "What are the factors of x² - 49?",
      opts: ["(x - 7)(x - 7)", "(x + 7)(x - 7)", "(x + 49)(x - 1)", "(x - 49)(x + 1)"],
      ans: 1,
      exp: "a² - b² = (a + b)(a - b), so x² - 7² = (x + 7)(x - 7)."
    },
    {
      q: "If (x + a)(x + b) = x² + 9x + 20, then the values of a and b are:",
      opts: ["2 and 10", "4 and 5", "1 and 20", "3 and 6"],
      ans: 1,
      exp: "4 + 5 = 9 and 4 × 5 = 20."
    }
  ];

  const handleSelect = (qIdx, optIdx) => {
    sound.playClick();
    setSelected({ ...selected, [qIdx]: optIdx });
  };

  const calculateScore = () => {
    let s = 0;
    questions.forEach((q, i) => {
      if (selected[i] === q.ans) s++;
    });
    setScore(s);
    sound.playSuccess();
  };

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-center">
        <h2>Chapter 13 Mastery Quiz (స్వీయ మూల్యాంకనం)</h2>
        {score !== null && (
          <span className="badge" style={{background:'#10b981',color:'#fff',padding:'0.4rem 0.8rem',fontSize:'1rem'}}>
            Score: {score} / {questions.length}
          </span>
        )}
      </div>

      <div className="space-y-3">
        {questions.map((q, qIdx) => (
          <div key={qIdx} className="result-box space-y-2">
            <div className="text-sm font-bold text-white">{qIdx+1}. {q.q}</div>
            <div className="space-y-1">
              {q.opts.map((opt, oIdx) => {
                let cls = "quiz-opt";
                if (score !== null) {
                  if (oIdx === q.ans) cls += " correct";
                  else if (selected[qIdx] === oIdx) cls += " wrong";
                  cls += " disabled";
                } else if (selected[qIdx] === oIdx) {
                  cls += " border-orange-500 bg-orange-950";
                }
                return (
                  <div key={oIdx} className={cls} onClick={()=>handleSelect(qIdx, oIdx)}>
                    <span style={{fontWeight:800}}>{String.fromCharCode(65+oIdx)}.</span>
                    <span>{opt}</span>
                  </div>
                );
              })}
            </div>
            {score !== null && (
              <div className="text-xs text-yellow-300 mt-1">
                💡 <strong>Explanation:</strong> {q.exp}
              </div>
            )}
          </div>
        ))}
      </div>

      <div className="text-center pt-2">
        {score === null ? (
          <button className="btn btn-orange text-base" onClick={calculateScore}>
            Submit Quiz & Check Score
          </button>
        ) : (
          <button className="btn btn-dark text-base" onClick={()=>{ setSelected({}); setScore(null); }}>
            Retake Quiz
          </button>
        )}
      </div>
    </div>
  );
}

// 7. WHITEBOARD TAB
function WhiteboardTab(){
  const canvasRef = useRef(null);
  const [color, setColor] = useState('#fb7185');
  const [size, setSize] = useState(5);
  const drawingRef = useRef(false);

  useEffect(()=>{
    const c = canvasRef.current;
    if(!c) return;
    const ctx = c.getContext('2d');
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  },[]);

  const startDraw = (e)=>{ drawingRef.current = true; draw(e); };
  const endDraw = ()=>{ drawingRef.current = false; };
  const draw = (e)=>{
    if(!drawingRef.current) return;
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    const rect = c.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const clear = ()=>{
    sound.playClick();
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  };

  return (
    <div className="card h-full flex flex-col space-y-2 overflow-hidden">
      <div className="flex justify-between items-center flex-wrap gap-2 flex-shrink-0">
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold slate">Color:</span>
          {['#fb7185','#f97316','#38bdf8','#10b981','#ffffff','#f59e0b'].map(c=>(
            <button key={c} onClick={()=>{sound.playClick();setColor(c)}}
              style={{width:24,height:24,borderRadius:'50%',border:color===c?'2px solid #fff':'none',background:c,cursor:'pointer'}}/>
          ))}
          <span className="text-xs font-bold slate ml-2">Size:</span>
          {[3, 6, 12].map(s=>(
            <button key={s} className={`btn btn-sm ${size===s?'btn-orange':'btn-dark'}`} onClick={()=>{sound.playClick();setSize(s)}}>{s}px</button>
          ))}
        </div>
        <button className="btn btn-sm" style={{background:'#dc2626',color:'#fff'}} onClick={clear}>Clear Board</button>
      </div>

      <div className="flex-1 rounded-xl overflow-hidden border border-slate-600 relative" style={{minHeight:0,touchAction:'none'}}>
        <canvas 
          ref={canvasRef} 
          style={{width:'100%',height:'100%',display:'block',cursor:'crosshair'}}
          onMouseDown={startDraw} onMouseUp={endDraw} onMouseMove={draw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchEnd={endDraw} onTouchMove={draw}
        />
      </div>
      <p className="text-xs slate text-center flex-shrink-0">Algebraic Scratchpad • Write steps, factor trees, and polynomial expansions.</p>
    </div>
  );
}
