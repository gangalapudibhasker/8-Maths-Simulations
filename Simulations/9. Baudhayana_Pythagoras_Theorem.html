<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}
const sound = new SoundEngine();

// 1. OVERVIEW & GOOGLE FLOW MIND MAP
function OverviewTab({ onJumpTab }){
  const nodes = [
    { id:'geom', title:'1. Geometric Theorem', tel:'జ్యామితీయ సిద్ధాంత నమూనా', color:'blue', desc:'In right-angled triangle, area of square on hypotenuse equals sum of areas on other two sides.', formula:'a² + b² = c²', badge:'Core Theorem' },
    { id:'history', title:'2. Baudhayana Sulba Sutras', tel:'బౌధాయన శుల్బ సూత్రాలు (800 BCE)', color:'amber', desc:'Ancient Indian mathematician Baudhayana formulated this rule centuries before Pythagoras.', formula:'దీర్ఘచతురస్ర కర్ణంపై నిర్మించిన చతురస్రం...', badge:'Indian Heritage' },
    { id:'bhaskara', title:'3. Bhaskara Behold! Dissection', tel:'భాస్కరాచార్యుని "చూడుము!" నిరూపణ', color:'emerald', desc:'Visual dissection proof by Indian mathematician Bhaskara II (1114 CE) using 4 triangles and 1 inner square.', formula:'c² = 4(½ab) + (b - a)²', badge:'Visual Proof' },
    { id:'triples', title:'4. Pythagorean Triples Generator', tel:'పైథాగరియన్ త్రికాల జనరేటర్', color:'purple', desc:'Any natural number m > 1 produces integer triples (2m, m² - 1, m² + 1). E.g. 3-4-5, 5-12-13, 8-15-17.', formula:'(2m)² + (m² - 1)² = (m² + 1)²', badge:'Number Theory' },
    { id:'ladder', title:'5. Real-World Applications', tel:'నిత్యజీవిత అనువర్తనాలు (నిచ్చెన లెక్క)', color:'orange', desc:'Solve heights of walls, ladder slips, shortest flight paths, and diagonals of rectangular plots.', formula:'Ladder: H = √(L² - D²)', badge:'Practical Math' },
    { id:'figout', title:'6. Figure It Out Exercises', tel:'పాఠ్యపుస్తక సాధన ప్రశ్నలు', color:'rose', desc:'Complete step-by-step solutions for all NCERT Ganita Prakash Chapter 9 textbook problems.', formula:'Exercises 9.1 & 9.2 Complete', badge:'SCERT Textbook' }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-start flex-wrap gap-2">
        <div>
          <h2>Chapter 9: Baudhayana-Pythagoras Theorem (బౌధాయన పైథాగరస్ సిద్ధాంతం)</h2>
          <p className="sub">AP SCERT Class 8 Mathematics Semester 2 • Right Triangles, Sulba Sutras & Geometric Proofs</p>
        </div>
        <span className="badge" style={{background:'rgba(56,189,248,0.2)',color:'#38bdf8',padding:'0.4rem 0.8rem',fontSize:'0.9rem'}}>
          🧠 Interactive Concept Flow Map
        </span>
      </div>

      <div className="flow-container">
        <div className="flow-nodes">
          {/* Central Root Node */}
          <div className="flow-root">
            <span style={{fontSize:'1.6rem',display:'block',marginBottom:'.2rem'}}>📐 🔺</span>
            <h3 style={{fontSize:'1.15rem',fontWeight:800,margin:0}}>Baudhayana-Pythagoras Theorem</h3>
            <p style={{fontSize:'0.85rem',color:'#e0f2fe',marginTop:'.2rem',marginBottom:'.4rem'}}>బౌధాయన - పైథాగరస్ సిద్ధాంతం (Right Triangles & Squares)</p>
            <span style={{background:'rgba(0,0,0,0.3)',padding:'2px 8px',borderRadius:20,fontSize:'0.75rem',fontWeight:700}}>Grade 8 Ganita Prakash</span>
          </div>

          <div style={{textAlign:'center',color:'#94a3b8',fontSize:'0.85rem'}}>
            ⬇️ <em>Explore major concept branches below (click any card to open interactive simulation)</em> ⬇️
          </div>

          {/* Flow Branches */}
          <div className="flow-branches">
            {nodes.map(n => (
              <div key={n.id} className={`flow-card ${n.color}`} onClick={()=>{ sound.playClick(); onJumpTab(n.id); }}>
                <div className="flex justify-between items-center mb-1">
                  <span className="badge" style={{fontSize:'0.72rem',background:'rgba(255,255,255,0.1)',color:'#fff'}}>{n.badge}</span>
                  <span style={{fontSize:'0.8rem',color:'#38bdf8'}}>👉 Open Tab</span>
                </div>
                <h4 style={{fontSize:'1rem',fontWeight:800,color:'#fff',margin:'0.2rem 0'}}>{n.title}</h4>
                <div style={{fontSize:'0.82rem',color:'#cbd5e1',marginBottom:'.4rem'}}>{n.tel}</div>
                <p style={{fontSize:'0.82rem',color:'#94a3b8',lineHeight:1.35,marginBottom:'.5rem'}}>{n.desc}</p>
                <div className="result-box font-mono" style={{padding:'0.35rem 0.6rem',fontSize:'0.82rem',color:'#fef08a'}}>
                  {n.formula}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="tip">
        📜 <strong>Baudhayana Sulba Sutra (circa 800 BCE):</strong><br />
        <em>"దీర్ఘచతురస్రం యొక్క కర్ణంపై గీసిన చతురస్ర వైశాల్యం, దాని పొడవు మరియు వెడల్పులపై గీసిన చతురస్రాల వైశాల్యాల మొత్తానికి సమానం."</em><br />
        (The diagonal of a rectangle produces by itself both the areas which are produced separately by its length and breadth.)
      </div>
    </div>
  );
}

// 2. INTERACTIVE GEOMETRIC THEOREM VISUALIZER
function GeometricVisualizerTab(){
  const [a, setA] = useState(6);
  const [b, setB] = useState(8);

  const aSq = a * a;
  const bSq = b * b;
  const cSq = aSq + bSq;
  const c = Math.sqrt(cSq);

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Geometric Theorem Visualizer (జ్యామితీయ నమూనా)</h2>
      <p className="sub">Adjust the legs of the right triangle to see the squares built on each side and verify a² + b² = c².</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        {/* SVG Drawing of Right Triangle & Squares */}
        <div className="result-box flex justify-center items-center p-2" style={{minHeight:280,background:'#070b14'}}>
          <svg width="280" height="260" viewBox="0 0 280 260">
            {/* Base leg a = horizontal */}
            {/* Vertical leg b */}
            {/* Scaling for SVG */}
            <g transform="translate(90, 160)">
              {/* Leg b vertical upward */}
              <line x1="0" y1="0" x2="0" y2={-b*10} stroke="#f97316" strokeWidth="4" />
              {/* Leg a horizontal right */}
              <line x1="0" y1="0" x2={a*10} y2="0" stroke="#3b82f6" strokeWidth="4" />
              {/* Hypotenuse c */}
              <line x1="0" y1={-b*10} x2={a*10} y2="0" stroke="#10b981" strokeWidth="4" />

              {/* Square on a (downwards) */}
              <rect x="0" y="0" width={a*10} height={a*10} fill="rgba(59,130,246,0.3)" stroke="#3b82f6" strokeWidth="1.5" />
              <text x={a*5} y={a*5 + 4} fill="#93c5fd" fontSize="11" fontWeight="bold" textAnchor="middle">a² = {aSq}</text>

              {/* Square on b (leftwards) */}
              <rect x={-b*10} y={-b*10} width={b*10} height={b*10} fill="rgba(249,115,22,0.3)" stroke="#f97316" strokeWidth="1.5" />
              <text x={-b*5} y={-b*5 + 4} fill="#fdba74" fontSize="11" fontWeight="bold" textAnchor="middle">b² = {bSq}</text>

              {/* Right angle symbol */}
              <rect x="0" y="-12" width="12" height="12" fill="none" stroke="#fff" strokeWidth="1.5" />
            </g>
          </svg>
        </div>

        {/* Sliders & Calculation Breakdown */}
        <div className="space-y-3">
          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Leg a (భుజం a):</label>
              <span className="font-bold blue">{a} units</span>
            </div>
            <input type="range" min="3" max="12" value={a} className="slider" onChange={e=>{ sound.playClick(); setA(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Leg b (భుజం b):</label>
              <span className="font-bold orange">{b} units</span>
            </div>
            <input type="range" min="3" max="12" value={b} className="slider" onChange={e=>{ sound.playClick(); setB(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-1">
            <div className="text-sm font-bold green">Theorem Equation Verification:</div>
            <div className="text-sm">
              Area of Square on Leg a: <span className="blue font-bold">a² = {a}² = {aSq}</span>
            </div>
            <div className="text-sm">
              Area of Square on Leg b: <span className="orange font-bold">b² = {b}² = {bSq}</span>
            </div>
            <div className="text-sm">
              Area of Square on Hypotenuse: <span className="green font-bold">c² = {aSq} + {bSq} = {cSq}</span>
            </div>
            <div className="text-base font-black green mt-1">
              Hypotenuse c = √{cSq} = {c.toFixed(2)} units
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// 3. BHASKARA'S "BEHOLD!" PROOF DISSECTION
function BhaskaraTab(){
  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Bhaskara II: The "Behold!" Dissection Proof (భాస్కరాచార్యుని "చూడుము!" నిరూపణ)</h2>
      <p className="sub">In his 1150 CE masterpiece Bijaganita, Bhaskara II drew this simple diagram and wrote just one word: <em>"Behold!" (పశ్య!)</em></p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        <div className="result-box flex justify-center items-center p-3" style={{minHeight:260,background:'#070b14'}}>
          {/* Dissection SVG: Outer square of side c containing 4 congruent right triangles and 1 inner square */}
          <svg width="240" height="240" viewBox="0 0 240 240">
            {/* Outer square side c */}
            <rect x="20" y="20" width="200" height="200" fill="none" stroke="#10b981" strokeWidth="3" />

            {/* 4 Triangles */}
            {/* T1 */}
            <polygon points="20,20 220,20 220,70" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" strokeWidth="1.5" />
            {/* T2 */}
            <polygon points="220,20 220,220 170,220" fill="rgba(249,115,22,0.35)" stroke="#fb923c" strokeWidth="1.5" />
            {/* T3 */}
            <polygon points="220,220 20,220 20,170" fill="rgba(16,185,129,0.35)" stroke="#34d399" strokeWidth="1.5" />
            {/* T4 */}
            <polygon points="20,220 20,20 70,20" fill="rgba(168,85,247,0.35)" stroke="#c084fc" strokeWidth="1.5" />

            {/* Inner square of side (b - a) */}
            <rect x="70" y="70" width="100" height="100" fill="rgba(234,179,8,0.3)" stroke="#eab308" strokeWidth="2" strokeDasharray="4 2" />
            <text x="120" y="125" fill="#fef08a" fontSize="12" fontWeight="bold" textAnchor="middle">(b - a)²</text>
          </svg>
        </div>

        <div className="result-box space-y-2 text-sm">
          <div className="text-sm font-bold amber">Mathematical Algebraic Proof:</div>
          <div>1. The large outer square has side <strong>c</strong>, so its Area = <span className="green font-bold">c²</span>.</div>
          <div>2. It is divided into <strong>4 identical right-angled triangles</strong> with legs <em>a</em> and <em>b</em>, plus one small central square of side <em>(b - a)</em>.</div>
          <div>3. Area of 4 triangles = 4 × (½ × a × b) = <span className="blue font-bold">2ab</span>.</div>
          <div>4. Area of inner square = (b - a)² = <span className="orange font-bold">b² - 2ab + a²</span>.</div>
          <div className="p-2 bg-slate-900 border border-slate-700 rounded-lg font-mono text-yellow-300">
            Total Area = 2ab + (b² - 2ab + a²)<br />
            c² = a² + b² ! (Q.E.D.)
          </div>
        </div>
      </div>
    </div>
  );
}

// 4. PYTHAGOREAN TRIPLES GENERATOR
function TriplesTab(){
  const [m, setM] = useState(3);

  const sideA = 2 * m;
  const sideB = m * m - 1;
  const sideC = m * m + 1;

  const standardTriples = [
    [3, 4, 5],
    [5, 12, 13],
    [8, 15, 17],
    [7, 24, 25],
    [9, 40, 41],
    [20, 21, 29]
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Pythagorean Triples Generator (పైథాగరియన్ త్రికాలు)</h2>
      <p className="sub">For any integer m > 1, the three numbers (2m, m² - 1, m² + 1) form a perfect Pythagorean triple.</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div className="result-box space-y-3">
          <div className="flex justify-between items-center">
            <label>Generator Parameter (m):</label>
            <span className="text-lg font-black orange">m = {m}</span>
          </div>
          <input type="range" min="2" max="10" value={m} className="slider" onChange={e=>{ sound.playClick(); setM(Number(e.target.value)); }} />

          <div className="p-3 bg-slate-900 border border-slate-700 rounded-lg space-y-1 text-sm font-mono">
            <div>1st side (2m) = 2 × {m} = <span className="orange font-bold">{sideA}</span></div>
            <div>2nd side (m² - 1) = {m}² - 1 = <span className="blue font-bold">{sideB}</span></div>
            <div>Hypotenuse (m² + 1) = {m}² + 1 = <span className="green font-bold">{sideC}</span></div>
          </div>

          <div className="p-2 bg-emerald-950 border border-emerald-600 rounded-lg text-center font-bold green text-base">
            Generated Triple: ({sideA}, {sideB}, {sideC})
            <div className="text-xs slate mt-1">{sideA}² + {sideB}² = {sideA*sideA} + {sideB*sideB} = {sideC*sideC} = {sideC}² ✔</div>
          </div>
        </div>

        <div className="result-box space-y-2">
          <div className="text-sm font-bold text-yellow-400">Famous Primitive Triples to Memorize:</div>
          <div className="grid grid-cols-2 gap-2">
            {standardTriples.map(([x,y,z], idx) => (

                <div className="text-xs slate">{x}² + {y}² = {z}²</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// 5. REAL-LIFE LADDER & APPLICATION TAB
function LadderTab(){
  const [ladderLen, setLadderLen] = useState(10);
  const [distWall, setDistWall] = useState(6);

  const safeDist = Math.min(distWall, ladderLen - 0.5);
  const wallHeight = Math.sqrt(ladderLen * ladderLen - safeDist * safeDist);

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Real-Life Ladder Application (నిచ్చెన సమస్య)</h2>
      <p className="sub">A classic application: Find how high a ladder reaches up a vertical wall when placed at distance D from the base.</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        <div className="result-box flex justify-center items-center p-2" style={{minHeight:260,background:'#070b14'}}>
          <svg width="240" height="240" viewBox="0 0 240 240">
            {/* Wall */}
            <line x1="60" y1="20" x2="60" y2="200" stroke="#94a3b8" strokeWidth="8" />
            <text x="35" y="110" fill="#94a3b8" fontSize="12" fontWeight="bold">Wall</text>

            {/* Ground */}
            <line x1="20" y1="200" x2="220" y2="200" stroke="#64748b" strokeWidth="6" />
            <text x="120" y="225" fill="#64748b" fontSize="12" fontWeight="bold">Ground</text>

            {/* Ladder */}
            <line x1="60" y1={200 - wallHeight*16} x2={60 + safeDist*16} y2="200" stroke="#f97316" strokeWidth="5" />
            
            {/* Height label */}
            <text x="75" y={200 - (wallHeight*8)} fill="#10b981" fontSize="12" fontWeight="bold">H = {wallHeight.toFixed(1)} m</text>
            {/* Dist label */}
            <text x={60 + (safeDist*8)} y="190" fill="#38bdf8" fontSize="12" fontWeight="bold">D = {safeDist} m</text>
          </svg>
        </div>

        <div className="space-y-3">
          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Ladder Length L (నిచ్చెన పొడవు):</label>
              <span className="font-bold orange">{ladderLen} m</span>
            </div>
            <input type="range" min="5" max="15" value={ladderLen} className="slider" onChange={e=>{ sound.playClick(); setLadderLen(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Distance from Wall D (గోడ నుంచి దూరం):</label>
              <span className="font-bold blue">{distWall} m</span>
            </div>
            <input type="range" min="2" max={ladderLen - 1} value={distWall} className="slider" onChange={e=>{ sound.playClick(); setDistWall(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-1">
            <div className="text-xs font-bold amber">Pythagorean Calculation:</div>
            <div className="font-mono text-sm">H² + D² = L²  →  H = √(L² - D²)</div>
            <div className="text-base font-bold green">
              Height reached H = √({ladderLen}² - {safeDist}²) = <span className="text-lg font-black">{wallHeight.toFixed(2)} meters</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// 6. FIGURE IT OUT STEP-BY-STEP PROBLEMS
function FigOutTab(){
  const [activeProb, setActiveProb] = useState(0);

  const problems = [
    {
      q: "Q1. The legs of a right-angled triangle are 9 cm and 12 cm. Find the length of its hypotenuse.",
      tel: "ప్రశ్న 1: లంబకోణ త్రిభుజం యొక్క భుజాలు 9 సెం.మీ, 12 సెం.మీ అయిన కర్ణం పొడవు కనుగొనండి.",
      steps: [
        "Given legs: a = 9 cm, b = 12 cm",
        "By Baudhayana-Pythagoras theorem: c² = a² + b²",
        "c² = 9² + 12² = 81 + 144 = 225",
        "Hypotenuse c = √225 = 15 cm"
      ],
      ans: "Hypotenuse = 15 cm"
    },
    {
      q: "Q2. A 13 m long ladder reaches a window 12 m above the ground on a wall. Find the distance of the foot of the ladder from the wall.",
      tel: "ప్రశ్న 2: 13 మీ పొడవు గల నిచ్చెన గోడపై 12 మీ ఎత్తులో ఉన్న కిటికీని తాకుచున్నది. గోడ నుండి నిచ్చెన అడుగు భాగం దూరం ఎంత?",
      steps: [
        "Ladder length (hypotenuse c) = 13 m",
        "Height of window (leg a) = 12 m",
        "Let distance from wall be b.",
        "a² + b² = c²  →  12² + b² = 13²  →  144 + b² = 169",
        "b² = 169 - 144 = 25  →  b = √25 = 5 m"
      ],
      ans: "Distance = 5 meters"
    },
    {
      q: "Q3. Check whether the numbers (8, 15, 17) form a Pythagorean triple.",
      tel: "ప్రశ్న 3: (8, 15, 17) సంఖ్యలు పైథాగరియన్ త్రికం అగునో కాదో సరిచూడండి.",
      steps: [
        "Smallest two sides: a = 8, b = 15. Largest side: c = 17.",
        "Calculate a² + b² = 8² + 15² = 64 + 225 = 289",
        "Calculate c² = 17² = 289",
        "Since a² + b² = c² (289 = 289), (8, 15, 17) is indeed a Pythagorean triple!"
      ],
      ans: "Yes, it is a valid Pythagorean Triple."
    }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Figure It Out Textbook Solutions (సాధించిన సమస్యలు)</h2>

      <div className="flex gap-2 mb-2">
        {problems.map((p, idx) => (
          <button 
            key={idx} 
            className={`btn btn-sm ${activeProb===idx ? 'btn-orange' : 'btn-dark'}`}
            onClick={()=>{ sound.playClick(); setActiveProb(idx); }}
          >
            Problem {idx+1}
          </button>
        ))}
      </div>

      <div className="result-box space-y-2">
        <h3 className="text-base font-bold orange">{problems[activeProb].q}</h3>
        <p className="text-sm slate">{problems[activeProb].tel}</p>

        <div className="mt-3 p-3 bg-slate-900 rounded-lg space-y-2 border border-slate-700">
          <div className="text-xs font-bold text-yellow-400">Step-by-Step Solution:</div>
          {problems[activeProb].steps.map((st, i) => (
            <div key={i} className="text-sm text-slate-200 pl-3 border-l-2 border-orange-500">

}

// 7. QUIZ TAB
function QuizTab(){
  const [selected, setSelected] = useState({});
  const [score, setScore] = useState(null);

  const questions = [
    {
      q: "In a right triangle with legs 5 cm and 12 cm, what is the hypotenuse?",
      opts: ["13 cm", "15 cm", "17 cm", "14 cm"],
      ans: 0,
      exp: "5² + 12² = 25 + 144 = 169. √169 = 13 cm."
    },
    {
      q: "Which ancient Indian treatise contains the earliest statement of this theorem in 800 BCE?",
      opts: ["Aryabhatiya", "Baudhayana Sulba Sutras", "Lilavati", "Brahmasphutasiddhanta"],
      ans: 1,
      exp: "The Sulba Sutras of Baudhayana date back to ~800 BCE."
    },
    {
      q: "If m = 4, what is the Pythagorean triple generated by (2m, m²-1, m²+1)?",
      opts: ["(8, 15, 17)", "(6, 8, 10)", "(8, 16, 18)", "(8, 12, 15)"],
      ans: 0,
      exp: "2(4)=8, 4²-1=15, 4²+1=17. The triple is (8, 15, 17)."
    },
    {
      q: "Which side is always the longest in any right-angled triangle?",
      opts: ["Adjacent side", "Opposite side", "Hypotenuse (కర్ణం)", "Altitude"],
      ans: 2,
      exp: "The hypotenuse lies opposite to the 90° right angle and is always the longest side."
    }
  ];

  const handleSelect = (qIdx, optIdx) => {
    sound.playClick();
    setSelected({ ...selected, [qIdx]: optIdx });
  };

  const calculateScore = () => {
    let s = 0;
    questions.forEach((q, i) => {
      if (selected[i] === q.ans) s++;
    });
    setScore(s);
    sound.playSuccess();
  };

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-center">
        <h2>Chapter 9 Mastery Quiz (స్వీయ మూల్యాంకనం)</h2>
        {score !== null && (
          <span className="badge" style={{background:'#10b981',color:'#fff',padding:'0.4rem 0.8rem',fontSize:'1rem'}}>
            Score: {score} / {questions.length}
          </span>
        )}
      </div>

      <div className="space-y-3">
        {questions.map((q, qIdx) => (
          <div key={qIdx} className="result-box space-y-2">
            <div className="text-sm font-bold text-white">{qIdx+1}. {q.q}</div>
            <div className="space-y-1">
              {q.opts.map((opt, oIdx) => {
                let cls = "quiz-opt";
                if (score !== null) {
                  if (oIdx === q.ans) cls += " correct";
                  else if (selected[qIdx] === oIdx) cls += " wrong";
                  cls += " disabled";
                } else if (selected[qIdx] === oIdx) {
                  cls += " border-orange-500 bg-orange-950";
                }
                return (
                  <div key={oIdx} className={cls} onClick={()=>handleSelect(qIdx, oIdx)}>
                    <span style={{fontWeight:800}}>{String.fromCharCode(65+oIdx)}.</span>
                    <span>{opt}</span>
                  </div>
                );
              })}
            </div>
            {score !== null && (
              <div className="text-xs text-yellow-300 mt-1">
                💡 <strong>Explanation:</strong> {q.exp}
              </div>
            )}
          </div>
        ))}
      </div>

      <div className="text-center pt-2">
        {score === null ? (
          <button className="btn btn-orange text-base" onClick={calculateScore}>
            Submit Quiz & Check Score
          </button>
        ) : (
          <button className="btn btn-dark text-base" onClick={()=>{ setSelected({}); setScore(null); }}>
            Retake Quiz
          </button>
        )}
      </div>
    </div>
  );
}

// 8. WHITEBOARD TAB
function WhiteboardTab(){
  const canvasRef = useRef(null);
  const [color, setColor] = useState('#38bdf8');
  const [size, setSize] = useState(5);
  const drawingRef = useRef(false);

  useEffect(()=>{
    const c = canvasRef.current;
    if(!c) return;
    const ctx = c.getContext('2d');
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  },[]);

  const startDraw = (e)=>{ drawingRef.current = true; draw(e); };
  const endDraw = ()=>{ drawingRef.current = false; };
  const draw = (e)=>{
    if(!drawingRef.current) return;
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    const rect = c.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const clear = ()=>{
    sound.playClick();
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  };

  return (
    <div className="card h-full flex flex-col space-y-2 overflow-hidden">
      <div className="flex justify-between items-center flex-wrap gap-2 flex-shrink-0">
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold slate">Color:</span>
          {['#38bdf8','#f97316','#10b981','#eab308','#ffffff','#f87171'].map(c=>(
            <button key={c} onClick={()=>{sound.playClick();setColor(c)}}
              style={{width:24,height:24,borderRadius:'50%',border:color===c?'2px solid #fff':'none',background:c,cursor:'pointer'}}/>
          ))}
          <span className="text-xs font-bold slate ml-2">Size:</span>
          {[3, 6, 12].map(s=>(
            <button key={s} className={`btn btn-sm ${size===s?'btn-blue':'btn-dark'}`} onClick={()=>{sound.playClick();setSize(s)}}>{s}px</button>
          ))}
        </div>
        <button className="btn btn-sm" style={{background:'#dc2626',color:'#fff'}} onClick={clear}>Clear Board</button>
      </div>

      <div className="flex-1 rounded-xl overflow-hidden border border-slate-600 relative" style={{minHeight:0,touchAction:'none'}}>
        <canvas 
          ref={canvasRef} 
          style={{width:'100%',height:'100%',display:'block',cursor:'crosshair'}}
          onMouseDown={startDraw} onMouseUp={endDraw} onMouseMove={draw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchEnd={endDraw} onTouchMove={draw}
        />
      </div>
      <p className="text-xs slate text-center flex-shrink-0">Interactive Geometry Scratchpad • Sketch right triangles, ladders, and square dissections.</p>
    </div>
  );
}
