<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}
const sound = new SoundEngine();

function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a||1; }
function simplify(a,b){ const g=gcd(a,b); return [a/g,b/g]; }

// 1. OVERVIEW & GOOGLE FLOW MIND MAP TAB
function OverviewTab({ onJumpTab }){
  const nodes = [
    { id:'grid', title:'1. The 100-Grid & %', tel:'100 గళ్ల బోర్డు & శాతం', color:'orange', desc:'Percentage means "per hundred". Shading x squares out of 100 represents x%.', formula:'x% = x / 100 = 0.0x', badge:'Visual Model' },
    { id:'convert', title:'2. Fractions to % & Decimals', tel:'భిన్నాలు - దశాంశాలు - శాతాలు', color:'blue', desc:'Convert easily: Multiply fraction by 100% to get percentage. Divide % by 100 for fraction.', formula:'3/4 = (3/4 × 100)% = 75%', badge:'Equivalence' },
    { id:'calc', title:'3. Finding Part & Total', tel:'మొత్తం & భాగాన్ని కనుగొనుట', color:'emerald', desc:'Calculate x% of a given quantity, or find the whole total when a percentage value is given.', formula:'Value = (P / 100) × Total', badge:'Calculations' },
    { id:'profit', title:'4. Profit, Loss & Discount', tel:'లాభం, నష్టం, తగ్గింపు (డిస్కౌంట్)', color:'purple', desc:'Real-world applications in commerce: Profit %, Loss %, Discount %, and Sales Tax / GST.', formula:'Profit% = (Profit / CP) × 100', badge:'Commercial' },
    { id:'ratios', title:'5. Ratio as Disguised %', tel:'నిష్పత్తి - మారువేషంలో శాతం', color:'amber', desc:'Part-to-part ratio converted to part-to-whole fractions, and then into percentage shares.', formula:'2:3 → 2/5 (40%) & 3/5 (60%)', badge:'Ratio Reasoning' },
    { id:'figout', title:'6. Figure It Out Problems', tel:'పాఠ్యపుస్తక సాధన ప్రశ్నలు', color:'rose', desc:'Complete step-by-step solutions for all SCERT textbook Figure It Out exercises.', formula:'All 8.1, 8.2 Exercises Solved', badge:'NCERT / SCERT' }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-start flex-wrap gap-2">
        <div>
          <h2>Chapter 8: Fractions in Disguise (మారువేషంలో భిన్నాలు)</h2>
          <p className="sub">AP SCERT Class 8 Mathematics Semester 2 • Percentages, Decimals & Ratios Visualized</p>
        </div>
        <span className="badge" style={{background:'rgba(249,115,22,0.2)',color:'#fb923c',padding:'0.4rem 0.8rem',fontSize:'0.9rem'}}>
          🧠 Interactive Concept Flow Map
        </span>
      </div>

      <div className="flow-container">
        <div className="flow-nodes">
          {/* Central Root Node */}
          <div className="flow-root">
            <span style={{fontSize:'1.5rem',display:'block',marginBottom:'.2rem'}}>🎭 ％</span>
            <h3 style={{fontSize:'1.15rem',fontWeight:800,margin:0}}>Fractions in Disguise</h3>
            <p style={{fontSize:'0.85rem',color:'#fed7aa',marginTop:'.2rem',marginBottom:'.4rem'}}>మారువేషంలో భిన్నాలు (Decimals, Percentages & Ratios)</p>
            <span style={{background:'rgba(0,0,0,0.3)',padding:'2px 8px',borderRadius:20,fontSize:'0.75rem',fontWeight:700}}>Grade 8 Ganita Prakash</span>
          </div>

          <div style={{textAlign:'center',color:'#94a3b8',fontSize:'0.85rem'}}>
            ⬇️ <em>Explore major concept branches below (click any card to open interactive simulation)</em> ⬇️
          </div>

          {/* Flow Branches */}
          <div className="flow-branches">
            {nodes.map(n => (
              <div key={n.id} className={`flow-card ${n.color}`} onClick={()=>{ sound.playClick(); onJumpTab(n.id); }}>
                <div className="flex justify-between items-center mb-1">
                  <span className="badge" style={{fontSize:'0.72rem',background:'rgba(255,255,255,0.1)',color:'#fff'}}>{n.badge}</span>
                  <span style={{fontSize:'0.8rem',color:'#38bdf8'}}>👉 Open Tab</span>
                </div>
                <h4 style={{fontSize:'1rem',fontWeight:800,color:'#fff',margin:'0.2rem 0'}}>{n.title}</h4>
                <div style={{fontSize:'0.82rem',color:'#cbd5e1',marginBottom:'.4rem'}}>{n.tel}</div>
                <p style={{fontSize:'0.82rem',color:'#94a3b8',lineHeight:1.35,marginBottom:'.5rem'}}>{n.desc}</p>
                <div className="result-box font-mono" style={{padding:'0.35rem 0.6rem',fontSize:'0.82rem',color:'#fef08a'}}>

                </div>

            ))}
          </div>
        </div>
      </div>

      <div className="tip-blue">
        💡 <strong>Key Textbook Insight:</strong> A percentage is simply a <em>fraction whose denominator is always 100</em>. For example, 25% is just 25/100 = 1/4 = 0.25. They are all the same number wearing different disguises!
      </div>
    </div>
  );
}

// 2. 100-GRID PERCENTAGE VISUALIZER
function Grid100Tab(){
  const [shaded, setShaded] = useState(35);
  const frac = simplify(shaded, 100);
  const decimal = (shaded / 100).toFixed(2);

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>100-Grid Visualizer (100 గళ్ల బోర్డు నమూనా)</h2>
      <p className="sub">Every square in this 10×10 grid represents 1 out of 100, which is 1% or 1/100 or 0.01.</p>

      <div className="row" style={{gap:'2rem',alignItems:'flex-start'}}>
        <div>
          <div className="grid-100">
            {Array.from({length:100}).map((_, i) => (
              <div 
                key={i} 
                className={`grid-100-cell ${i < shaded ? 'shaded' : ''}`}
                onClick={() => { sound.playClick(); setShaded(i + 1); }}
                title={`Square #${i+1}`}
              />
            ))}
          </div>
          <p className="text-xs slate mt-1 text-center">Click any square to set value directly</p>
        </div>

        <div className="flex-1 space-y-3" style={{minWidth:260}}>
          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Shaded Squares (శాతం విలువ):</label>
              <span className="text-lg font-black orange">{shaded} / 100 ({shaded}%)</span>
            </div>
            <input 
              type="range" min="0" max="100" value={shaded} 
              className="slider" 
              onChange={e => { sound.playClick(); setShaded(Number(e.target.value)); }} 
            />
          </div>

          <div className="result-box space-y-2">
            <div className="text-sm font-bold amber">Three Disguises of the Same Quantity:</div>
            <div className="flex items-center justify-around text-center py-2">
              <div>
                <div className="text-xs slate">Percentage (శాతం)</div>
                <div className="text-lg font-black orange">{shaded}%</div>
              </div>
              <div style={{fontSize:'1.5rem',color:'#64748b'}}>=</div>
              <div>
                <div className="text-xs slate">Fraction (భిన్నం)</div>
                <div className="text-lg font-black green">{frac[0]} / {frac[1]}</div>
                <div className="text-xs slate">({shaded}/100)</div>
              </div>
              <div style={{fontSize:'1.5rem',color:'#64748b'}}>=</div>
              <div>
                <div className="text-xs slate">Decimal (దశాంశం)</div>
                <div className="text-lg font-black blue">{decimal}</div>
              </div>
            </div>
          </div>

          <div className="row gap-2">
            {[10, 25, 50, 75, 100].map(v => (
              <button key={v} className="btn btn-dark btn-sm" onClick={() => { sound.playClick(); setShaded(v); }}>

      <div className="tip">
        📌 <strong>Textbook Observation:</strong> Notice how half of the grid is 50 squares = 50% = 50/100 = 1/2 = 0.5. One quarter is 25 squares = 25% = 1/4 = 0.25.
      </div>

// 3. FRACTIONS TO PERCENTAGES & DECIMALS CONVERTER
function ConverterTab(){
  const [num, setNum] = useState(3);
  const [den, setDen] = useState(8);

  const safeDen = den === 0 ? 1 : den;
  const percentVal = ((num / safeDen) * 100).toFixed(2);
  const decVal = (num / safeDen).toFixed(4);
  const sim = simplify(num, safeDen);

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Interactive Conversion Lab (రూపాంతర పరిశోధన)</h2>
      <p className="sub">Enter any fraction Numerator (లవం) and Denominator (హారం) to reveal its decimal and percentage disguises.</p>

      <div className="row gap-3">
        <div className="result-box flex items-center gap-2">
          <div>
            <label className="text-xs slate">Numerator (లవం):</label>
            <input type="number" className="input" value={num} onChange={e=>setNum(Number(e.target.value))} style={{width:80}} />
          </div>
          <div style={{fontSize:'2rem',color:'#fb923c'}}>/</div>
          <div>
            <label className="text-xs slate">Denominator (హారం):</label>
            <input type="number" className="input" value={den} onChange={e=>setDen(Number(e.target.value))} style={{width:80}} />
          </div>
        </div>

        <div className="flex gap-2">
          {[ [1,2], [1,4], [3,4], [1,5], [2,5], [3,8], [5,8], [1,3] ].map(([n,d]) => (
            <button key={`${n}/${d}`} className="btn btn-dark btn-sm" onClick={()=>{ sound.playClick(); setNum(n); setDen(d); }}>
              {n}/{d}
            </button>
          ))}
        </div>
      </div>

      <div className="result-box space-y-3">
        <div className="text-sm font-bold orange">Step-by-Step Conversion Method:</div>
        <div className="space-y-1 text-sm">
          <div>1. <strong>Original Fraction:</strong> {num} / {safeDen} {sim[0] !== num ? `(Simplified: ${sim[0]} / ${sim[1]})` : ''}</div>
          <div>2. <strong>Decimal Disguise:</strong> Divide {num} by {safeDen} = <span className="blue font-bold">{decVal}</span></div>
          <div>3. <strong>Percentage Disguise:</strong> Multiply by 100% → ({num} ÷ {safeDen}) × 100% = <span className="green font-bold font-mono text-base">{percentVal}%</span></div>
        </div>

        <div className="w-full bg-slate-800 rounded-full h-5 overflow-hidden border border-slate-600 relative">
          <div 
            className="h-full bg-orange-500 transition-all duration-300"
            style={{ width: `${Math.min(Math.max(Number(percentVal), 0), 100)}%` }}
          />
        </div>
      </div>

      <div className="tip-green">
        💡 <strong>Remember:</strong> Any percentage can be written as a fraction by dividing by 100: e.g. <code>{percentVal}% = {percentVal}/100</code>.
      </div>
    </div>
  );
}

// 4. PERCENTAGE OF QUANTITY CALCULATOR
function PartTotalTab(){
  const [percent, setPercent] = useState(25);
  const [total, setTotal] = useState(240);

  const part = (percent / 100) * total;

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Percentage of Quantities (రాశుల శాతం గణన)</h2>
      <p className="sub">Calculate what part of a whole quantity corresponds to a given percentage.</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div className="result-box space-y-3">
          <div>
            <div className="flex justify-between items-center mb-1">
              <label>Percentage (శాతం %):</label>
              <span className="font-bold orange">{percent}%</span>
            </div>

// 5. COMMERCIAL MATH: PROFIT, LOSS & DISCOUNT
function ProfitLossTab(){
  const [cp, setCp] = useState(500);
  const [sp, setSp] = useState(625);

  const diff = sp - cp;
  const isProfit = diff >= 0;
  const pPercent = cp > 0 ? (Math.abs(diff) / cp) * 100 : 0;

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Commercial Applications (లాభం, నష్టం & డిస్కౌంట్)</h2>
      <p className="sub">Understand Cost Price (CP కొన్నవెల), Selling Price (SP అమ్మినవెల), and percentage profit or loss.</p>

      <div className="row gap-3">
        <div className="result-box">
          <label>Cost Price (CP - కొన్నవెల ₹):</label>
          <input type="number" className="input" value={cp} onChange={e=>setCp(Number(e.target.value))} style={{width:120}} />
        </div>
        <div className="result-box">
          <label>Selling Price (SP - అమ్మినవెల ₹):</label>
          <input type="number" className="input" value={sp} onChange={e=>setSp(Number(e.target.value))} style={{width:120}} />
        </div>
        <div className="flex gap-2">
          <button className="btn btn-emerald btn-sm" onClick={()=>{ setCp(400); setSp(500); }}>Example: Profit</button>
          <button className="btn btn-dark btn-sm" onClick={()=>{ setCp(600); setSp(480); }}>Example: Loss</button>
        </div>
      </div>

      <div className={`result-box border-2 ${isProfit ? 'border-emerald-500' : 'border-rose-500'}`}>
        <div className="flex justify-between items-center">
          <div>
            <div className="text-xs slate font-bold">Transaction Result:</div>
            <div className={`text-xl font-black ${isProfit ? 'green' : 'red'}`}>
              {isProfit ? 'PROFIT (లాభం)' : 'LOSS (నష్టం)'} of ₹{Math.abs(diff)}
            </div>
          </div>
          <div className="text-right">
            <div className="text-xs slate font-bold">{isProfit ? 'Profit %' : 'Loss %'}:</div>
            <div className={`text-2xl font-black ${isProfit ? 'green' : 'red'}`}>
              {pPercent.toFixed(2)}%
            </div>
          </div>
        </div>

        <div className="text-xs slate mt-2 pt-2 border-t border-slate-700">
          <strong>Formula:</strong> {isProfit ? 'Profit % = (Profit ÷ CP) × 100' : 'Loss % = (Loss ÷ CP) × 100'}
          <br />= (₹{Math.abs(diff)} ÷ ₹{cp}) × 100 = {pPercent.toFixed(2)}%
        </div>
      </div>

      <div className="tip">
        🧾 <strong>Notice:</strong> Profit percentage and Loss percentage are <em>always calculated with respect to the Cost Price (CP)</em> unless explicitly stated otherwise!
      </div>
    </div>
  );
}

// 6. RATIOS AS DISGUISED PERCENTAGES

        <div className="flex gap-2">
          {[[1,1], [2,3], [3,5], [1,3], [4,1]].map(([a,b]) => (
            <button key={`${a}:${b}`} className="btn btn-dark btn-sm" onClick={()=>{ sound.playClick(); setPartA(a); setPartB(b); }}>
              {a}:{b}
            </button>

      </div>

      <div className="result-box space-y-3">
        <div className="text-sm font-bold orange">Ratio to Percentage Breakdown:</div>
        <div className="text-sm">
          Total Parts = {partA} + {partB} = <strong>{total} parts</strong>
        </div>

        <div className="grid grid-cols-2 gap-3 text-center">
          <div className="p-3 bg-blue-950 border border-blue-600 rounded-lg">
            <div className="text-xs slate">Part A Fraction</div>
            <div className="text-base font-bold text-blue-300">{partA} / {total}</div>
            <div className="text-lg font-black text-blue-400 mt-1">{pctA}%</div>

          <div className="p-3 bg-purple-950 border border-purple-600 rounded-lg">

// 7. TEXTBOOK FIGURE IT OUT STEP-BY-STEP PROBLEMS
function FigOutTab(){
  const [activeProb, setActiveProb] = useState(0);

  const problems = [
    {
      q: "Q1. A shopkeeper offers a 15% discount on a school bag marked at ₹600. What is the selling price?",
      tel: "ప్రశ్న 1: ఒక పాఠశాల బ్యాగ్ ప్రకటన వెల ₹600 పై దుకాణదారుడు 15% తగ్గింపు ఇచ్చెను. అమ్మినవెల ఎంత?",
      steps: [
        "Marked Price (MP) = ₹600",
        "Discount Rate = 15%",
        "Discount Amount = 15% of ₹600 = (15 / 100) × 600 = ₹90",
        "Selling Price (SP) = MP - Discount = 600 - 90 = ₹510"
      ],
      ans: "Selling Price = ₹510"
    },
    {
      q: "Q2. In a class of 40 students, 60% are girls. How many boys are there in the class?",
      tel: "ప్రశ్న 2: 40 మంది విద్యార్థులు గల తరగతిలో 60% బాలికలు కలరు. తరగతిలోని బాలుర సంఖ్య ఎంత?",
      steps: [
        "Total students = 40",
        "Percentage of boys = 100% - 60% = 40%",
        "Number of boys = 40% of 40 = (40 / 100) × 40 = 16 boys",
        "Alternatively: Girls = 60% of 40 = 24. Boys = 40 - 24 = 16 boys."
      ],
      ans: "Number of Boys = 16"
    },
    {
      q: "Q3. A cycle bought for ₹3,000 was sold for ₹3,600. Find the profit percentage.",
      tel: "ప్రశ్న 3: ₹3,000 కు కొన్న సైకిల్‌ను ₹3,600 కు అమ్మినచో లాభ శాతం కనుగొనండి.",
      steps: [
        "Cost Price (CP) = ₹3,000",
        "Selling Price (SP) = ₹3,600",
        "Profit = SP - CP = 3,600 - 3,000 = ₹600",
        "Profit % = (Profit / CP) × 100 = (600 / 3000) × 100 = 20%"
      ],
      ans: "Profit % = 20%"
    }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Figure It Out Textbook Solutions (సాధించిన సమస్యలు)</h2>
      <p className="sub">Step-by-step verified solutions for NCERT Ganita Prakash & AP SCERT Class 8 problems.</p>

      <div className="flex gap-2 mb-2">
        {problems.map((p, idx) => (
          <button 
            key={idx} 
            className={`btn btn-sm ${activeProb===idx ? 'btn-orange' : 'btn-dark'}`}
            onClick={()=>{ sound.playClick(); setActiveProb(idx); }}
          >
            Problem {idx+1}
          </button>
        ))}
      </div>

      <div className="result-box space-y-2">
        <h3 className="text-base font-bold orange">{problems[activeProb].q}</h3>
        <p className="text-sm slate">{problems[activeProb].tel}</p>

        <div className="mt-3 p-3 bg-slate-900 rounded-lg space-y-2 border border-slate-700">
          <div className="text-xs font-bold text-yellow-400">Step-by-Step Working:</div>
          {problems[activeProb].steps.map((st, i) => (
            <div key={i} className="text-sm text-slate-200 pl-3 border-l-2 border-orange-500">
              {st}
            </div>
          ))}
          <div className="mt-2 pt-2 border-t border-slate-700 font-bold green text-base">
            ✅ Final Answer: {problems[activeProb].ans}
          </div>
        </div>
      </div>
    </div>
  );
}

// 8. ASSESSMENT QUIZ
function QuizTab(){
  const [selected, setSelected] = useState({});
  const [score, setScore] = useState(null);

  const questions = [
    {
      q: "What is 3/5 expressed as a percentage?",
      opts: ["35%", "50%", "60%", "75%"],
      ans: 2,
      exp: "3/5 × 100% = 300 / 5 = 60%."
    },
    {
      q: "If an item costing ₹800 is sold at 10% loss, what is the selling price?",
      opts: ["₹700", "₹720", "₹760", "₹790"],
      ans: 1,
      exp: "Loss = 10% of 800 = ₹80. SP = 800 - 80 = ₹720."
    },
    {
      q: "In a ratio of 1:4, what percentage does the first part represent?",
      opts: ["20%", "25%", "14%", "40%"],
      ans: 0,
      exp: "Total parts = 1 + 4 = 5. First part = (1/5) × 100% = 20%."
    },
    {
      q: "A fraction in disguise as 0.08 is equal to what percentage?",
      opts: ["80%", "0.8%", "8%", "0.08%"],
      ans: 2,
      exp: "0.08 × 100% = 8%."
    }
  ];

  const handleSelect = (qIdx, optIdx) => {
    sound.playClick();
    setSelected({ ...selected, [qIdx]: optIdx });
  };

  const calculateScore = () => {
    let s = 0;
    questions.forEach((q, i) => {
      if (selected[i] === q.ans) s++;
    });
    setScore(s);
    sound.playSuccess();
  };

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-center">
        <h2>Chapter 8 Mastery Quiz (స్వీయ మూల్యాంకనం)</h2>
        {score !== null && (
          <span className="badge" style={{background:'#10b981',color:'#fff',padding:'0.4rem 0.8rem',fontSize:'1rem'}}>
            Score: {score} / {questions.length}
          </span>
        )}
      </div>

      <div className="space-y-3">
        {questions.map((q, qIdx) => (
          <div key={qIdx} className="result-box space-y-2">
            <div className="text-sm font-bold text-white">{qIdx+1}. {q.q}</div>
            <div className="space-y-1">
              {q.opts.map((opt, oIdx) => {
                let cls = "quiz-opt";
                if (score !== null) {
                  if (oIdx === q.ans) cls += " correct";
                  else if (selected[qIdx] === oIdx) cls += " wrong";
                  cls += " disabled";
                } else if (selected[qIdx] === oIdx) {
                  cls += " border-orange-500 bg-orange-950";
                }
                return (
                  <div key={oIdx} className={cls} onClick={()=>handleSelect(qIdx, oIdx)}>
                    <span style={{fontWeight:800}}>{String.fromCharCode(65+oIdx)}.</span>
                    <span>{opt}</span>
                  </div>
                );
              })}
            </div>
            {score !== null && (
              <div className="text-xs text-yellow-300 mt-1">
                💡 <strong>Explanation:</strong> {q.exp}
              </div>
            )}
          </div>
        ))}
      </div>

      <div className="text-center pt-2">
        {score === null ? (
          <button className="btn btn-orange text-base" onClick={calculateScore}>
            Submit Quiz & Check Score
          </button>
        ) : (
          <button className="btn btn-dark text-base" onClick={()=>{ setSelected({}); setScore(null); }}>
            Retake Quiz
          </button>
        )}
      </div>
    </div>
  );
}

// 9. SCRATCHPAD / WHITEBOARD
function WhiteboardTab(){
  const canvasRef = useRef(null);
  const [color, setColor] = useState('#f97316');
  const [size, setSize] = useState(5);
  const drawingRef = useRef(false);

  useEffect(()=>{
    const c = canvasRef.current;
    if(!c) return;
    const ctx = c.getContext('2d');
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  },[]);

  const startDraw = (e)=>{
    drawingRef.current = true;
    draw(e);
  };
  const endDraw = ()=>{ drawingRef.current = false; };
  const draw = (e)=>{
    if(!drawingRef.current) return;
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    const rect = c.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const clear = ()=>{
    sound.playClick();
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  };

  return (
    <div className="card h-full flex flex-col space-y-2 overflow-hidden">
      <div className="flex justify-between items-center flex-wrap gap-2 flex-shrink-0">
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold slate">Color:</span>
          {['#f97316','#3b82f6','#10b981','#eab308','#ffffff','#f87171'].map(c=>(
            <button key={c} onClick={()=>{sound.playClick();setColor(c)}}
              style={{width:24,height:24,borderRadius:'50%',border:color===c?'2px solid #fff':'none',background:c,cursor:'pointer'}}/>
          ))}
          <span className="text-xs font-bold slate ml-2">Size:</span>
          {[3, 6, 12].map(s=>(
            <button key={s} className={`btn btn-sm ${size===s?'btn-orange':'btn-dark'}`} onClick={()=>{sound.playClick();setSize(s)}}>{s}px</button>
          ))}
        </div>
        <button className="btn btn-sm" style={{background:'#dc2626',color:'#fff'}} onClick={clear}>Clear Board</button>
      </div>

      <div className="flex-1 rounded-xl overflow-hidden border border-slate-600 relative" style={{minHeight:0,touchAction:'none'}}>
        <canvas 
          ref={canvasRef} 
          style={{width:'100%',height:'100%',display:'block',cursor:'crosshair'}}
          onMouseDown={startDraw} onMouseUp={endDraw} onMouseMove={draw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchEnd={endDraw} onTouchMove={draw}
        />
      </div>
      <p className="text-xs slate text-center flex-shrink-0">Interactive Math Scratchpad • Draw fraction models, 100-grids, or rough calculations.</p>
    </div>
  );
}
