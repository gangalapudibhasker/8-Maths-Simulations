<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fractions in Disguise • Ganita Prakash Grade 8</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;background:#0b0f19;color:#f1f5f9;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center;touch-action:manipulation}
.viewport-wrapper{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 25% 15%,#1e293b 0%,#0f172a 65%)}
.simulation-container{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;position:relative;box-shadow:0 25px 50px -12px rgba(0,0,0,.75);display:flex;flex-direction:column;overflow:hidden;background:#0f172a;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
.simulation-container:fullscreen,.simulation-container:-webkit-full-screen{width:100vw;height:100vh;max-width:none;max-height:none;border-radius:0;border:none}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(249,115,22,.6);border-radius:4px}
.flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-3{gap:.7rem}
.w-full{width:100%}.h-full{height:100%}.flex-1{flex:1 1 0%}.flex-shrink-0{flex-shrink:0}
.overflow-y-auto{overflow-y:auto}.overflow-hidden{overflow:hidden}.relative{position:relative}
h2{font-size:1.35rem;font-weight:800;color:#fb923c;margin-bottom:.12rem;letter-spacing:-.02em}
.sub{font-size:0.95rem;color:#94a3b8;margin-bottom:.45rem;line-height:1.4}
label{font-size:.92rem;font-weight:700;color:#e2e8f0;display:block;margin-bottom:.18rem}
.text-lg{font-size:1.15rem}.text-base{font-size:1.05rem}.text-sm{font-size:.95rem}.text-xs{font-size:.82rem}
.font-mono{font-family:ui-monospace,Menlo,Consolas,monospace}.font-bold{font-weight:700}.font-black{font-weight:900}
.orange{color:#fb923c}.amber{color:#fbbf24}.green{color:#4ade80}.red{color:#f87171}.blue{color:#60a5fa}.slate{color:#94a3b8}.purple{color:#c084fc}
.input{background:#0f172a;border:2px solid #475569;color:#fff;border-radius:.5rem;padding:.4rem .6rem;font-size:1.05rem;font-weight:700;outline:none;width:110px;text-align:center}
.input:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.3)}
.btn{cursor:pointer;border:none;border-radius:.5rem;font-weight:700;font-size:.92rem;padding:.45rem .85rem;transition:all .12s;touch-action:manipulation}
.btn-orange{background:#ea580c;color:#fff}.btn-orange:hover,.btn-orange:active{background:#f97316}
.btn-dark{background:#1e293b;color:#e2e8f0;border:1px solid #475569}.btn-dark:hover,.btn-dark:active{background:#334155}
.btn-emerald{background:#059669;color:#fff}.btn-emerald:hover{background:#10b981}
.btn-sm{padding:.35rem .65rem;font-size:.85rem}
.tab-bar{display:flex;overflow-x:auto;gap:.3rem;padding:.4rem .6rem;background:#0f172a;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.tab{display:flex;align-items:center;gap:.28rem;padding:.45rem .75rem;border-radius:.5rem;font-size:.85rem;font-weight:700;cursor:pointer;border:none;white-space:nowrap;transition:all .12s;background:transparent;color:#94a3b8;touch-action:manipulation}
.tab:hover{background:#1e293b;color:#e2e8f0}
.tab.on{background:#ea580c;color:#fff;box-shadow:0 3px 12px rgba(234,88,12,.45)}
.card{background:rgba(30,41,59,.95);border:1px solid rgba(255,255,255,.12);border-radius:.85rem;padding:.85rem 1rem;display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;gap:.55rem;align-items:flex-end;margin-bottom:.45rem}
.result-box{background:#0f172a;border:1px solid #475569;border-radius:.65rem;padding:.65rem .85rem;font-size:1rem;line-height:1.45}
.tip{margin-top:.35rem;padding:.55rem .8rem;background:rgba(251,191,36,.15);border-left:4px solid #fbbf24;border-radius:0 .5rem .5rem 0;font-size:.95rem;color:#f1f5f9;line-height:1.4}
.grid-100{display:grid;grid-template-columns:repeat(10, 1fr);gap:2px;width:240px;height:240px;background:#1e293b;padding:4px;border-radius:8px;border:1px solid #475569}
.cell-100{border-radius:2px;cursor:pointer;transition:background 0.1s}
.quiz-opt{width:100%;text-align:left;padding:.55rem .85rem;border-radius:.5rem;border:2px solid #334155;background:#1e293b;color:#f1f5f9;font-size:.98rem;font-weight:600;cursor:pointer;margin-bottom:.35rem;transition:all .12s}
.quiz-opt:hover{border-color:#f97316;background:rgba(249,115,22,.15)}
.quiz-opt.correct{background:rgba(16,185,129,.25);border-color:#34d399;color:#d1fae5}
.quiz-opt.wrong{background:rgba(239,68,68,.25);border-color:#f87171;color:#fecaca}
.slider{width:100%;accent-color:#f97316}
</style>
</head>
<body>
<div id="root" class="viewport-wrapper"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  play(f=580,t=0.06){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,this.ctx.currentTime); g.gain.setValueAtTime(.1,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+t); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+t); }catch(e){} }
  playWin(){ if(this.muted)return; this.init(); [523,659,783].forEach((f,i)=>{ setTimeout(()=>this.play(f,0.15), i*100); }); }
}
const sound = new SoundEngine();

// Tab 1: Grid 100 Visualizer
function HundredGridTab(){
  const [val, setVal] = useState(35);
  const handleSlide = (e) => {
    setVal(parseInt(e.target.value));
    sound.play(400 + parseInt(e.target.value)*4, 0.04);
  };
  
  // GCD for simplest fraction
  const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
  const d = gcd(val, 100);
  const num = val / d;
  const den = 100 / d;

  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>10×10 Hundredths Grid (శాతాల గ్రిడ్)</h2>
      <p className="sub">Every percentage is simply a fraction with denominator 100: \( P\% = \frac{P}{100} \). Use the slider or click cells to visualize.</p>
      
      <div className="flex flex-wrap gap-3 items-center justify-center">
        <div className="grid-100">
          {Array.from({length: 100}).map((_, i) => (
            <div 
              key={i} 
              className="cell-100" 
              style={{background: i < val ? '#f97316' : '#334155'}}
              onClick={() => { setVal(i + 1); sound.play(450, 0.05); }}
            />
          ))}
        </div>

        <div className="flex flex-col gap-2 flex-1 min-w-[220px]">
          <div>
            <div className="flex justify-between text-sm">
              <span>Shaded Count: <strong className="orange">{val} / 100</strong></span>
              <span>Percent: <strong className="amber">{val}%</strong></span>
            </div>
            <input type="range" min="0" max="100" value={val} onChange={handleSlide} className="slider mt-1" />
          </div>

          <div className="result-box space-y-1">
            <div>📊 <strong>Percentage:</strong> <span className="amber text-lg font-bold">{val}%</span></div>
            <div>🔢 <strong>Fraction (Hundredths):</strong> <span className="blue font-bold">{val} / 100</span></div>
            <div>✨ <strong>Simplest Form:</strong> <span className="green font-bold">{num} / {den}</span></div>
            <div>🎯 <strong>Decimal Form:</strong> <span className="purple font-bold">{(val / 100).toFixed(2)}</span></div>
          </div>
        </div>
      </div>

      <div className="tip">
        💡 <strong>Key Principle:</strong> <em>Percent</em> means "per 100" (శాతం అంటే నూటికి). When a fraction has any other denominator, multiply both numerator and denominator to get 100, e.g., \(\frac{2}{5} = \frac{2 \times 20}{5 \times 20} = \frac{40}{100} = 40\%\).
      </div>
    </div>
  );
}

// Tab 2: Percentage of Quantity
function QuantityTab(){
  const [percent, setPercent] = useState(20);
  const [total, setTotal] = useState(500);

  const amount = (percent * total) / 100;

  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Percentage of a Quantity (ఒక రాశిలో శాతం)</h2>
      <p className="sub">Calculate what part of a whole quantity corresponds to any percentage.</p>

      <div className="row">
        <div>
          <label>Percentage (%):</label>
          <input type="number" min="1" max="200" value={percent} onChange={e=>setPercent(Math.max(0, parseInt(e.target.value)||0))} className="input" />
        </div>
        <div>
          <label>Total Quantity (₹ / kg / items):</label>
          <input type="number" min="1" value={total} onChange={e=>setTotal(Math.max(1, parseInt(e.target.value)||1))} className="input" style={{width:'130px'}} />
        </div>
      </div>

      <div className="w-full bg-slate-800 h-6 rounded-full overflow-hidden flex border border-slate-700">
        <div style={{width: `${Math.min(100, percent)}%`, background: '#f97316', transition: 'width 0.2s'}} className="h-full flex items-center justify-center text-xs font-bold text-white">
          {percent}%
        </div>
        <div className="flex-1 bg-slate-700 h-full flex items-center justify-center text-xs text-slate-300">
          {Math.max(0, 100 - percent)}%
        </div>
      </div>

      <div className="result-box space-y-1">
        <div className="text-base font-bold text-white">
          {percent}% of {total} = <span className="green text-lg font-black">{amount.toLocaleString()}</span>
        </div>
        <div className="text-sm text-slate-300 font-mono">
          Formula: \(\frac{{ {percent} }}{{ 100 }} \times {total} = \frac{{ {percent * total} }}{{ 100 }} = {amount}\)
        </div>
      </div>

      <div className="tip">
        🛒 <strong>Real-Life Context:</strong> If a dress marked at ₹{total} has a {percent}% festival discount, you save <strong>₹{amount}</strong> and pay only <strong>₹{total - amount}</strong>!
      </div>
    </div>
  );
}

// Tab 3: Profit, Loss & Discount
function ProfitLossTab(){
  const [cp, setCp] = useState(800);
  const [sp, setSp] = useState(1000);

  const diff = sp - cp;
  const isProfit = diff >= 0;
  const pct = cp > 0 ? (Math.abs(diff) / cp) * 100 : 0;

  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Profit & Loss Simulator (లాభ - నష్టాలు)</h2>
      <p className="sub">Profit or Loss percentage is ALWAYS calculated on the Cost Price (CP).</p>

      <div className="row">
        <div>
          <label>Cost Price (CP ₹):</label>
          <input type="number" min="1" value={cp} onChange={e=>setCp(Math.max(1, parseInt(e.target.value)||1))} className="input" />
        </div>
        <div>
          <label>Selling Price (SP ₹):</label>
          <input type="number" min="0" value={sp} onChange={e=>setSp(Math.max(0, parseInt(e.target.value)||0))} className="input" />
        </div>
      </div>

      <div className="result-box space-y-1">
        <div className="text-base font-bold">
          Transaction Result: {isProfit ? <span className="green">🎉 PROFIT of ₹{diff}</span> : <span className="red">⚠️ LOSS of ₹{Math.abs(diff)}</span>}
        </div>
        <div>
          <strong>{isProfit ? 'Profit' : 'Loss'} Percentage:</strong> <span className="amber text-lg font-black">{pct.toFixed(2)}%</span>
        </div>
        <div className="text-sm text-slate-300 font-mono">
          Formula: \(\frac{{ |SP - CP| }}{{ CP }} \times 100\% = \frac{{ {Math.abs(diff)} }}{{ {cp} }} \times 100 = {pct.toFixed(2)}\%\)
        </div>
      </div>

      <div className="tip">
        🏷️ <strong>Discount Rule:</strong> Remember that Discount is calculated on the <strong>Marked Price (MP)</strong>: Discount % = \(\frac{\text{Discount}}{\text{Marked Price}} \times 100\).
      </div>
    </div>
  );
}

// Tab 4: Simple vs Compound Interest
function InterestTab(){
  const [p, setP] = useState(10000);
  const [r, setR] = useState(10);
  const [t, setT] = useState(3);

  const si = (p * r * t) / 100;
  const ciAmount = p * Math.pow(1 + r/100, t);
  const ci = ciAmount - p;

  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Simple vs Compound Interest (బారువడ్డీ vs చక్రవడ్డీ)</h2>
      <p className="sub">Watch how Compound Interest (interest-on-interest) grows faster than Simple Interest over time.</p>

      <div className="row">
        <div>
          <label>Principal (P ₹):</label>
          <input type="number" value={p} onChange={e=>setP(Math.max(100, parseInt(e.target.value)||0))} className="input" style={{width:'110px'}} />
        </div>
        <div>
          <label>Rate (R % p.a.):</label>
          <input type="number" value={r} onChange={e=>setR(Math.max(1, parseInt(e.target.value)||0))} className="input" style={{width:'80px'}} />
        </div>
        <div>
          <label>Time (T Years):</label>
          <input type="number" min="1" max="20" value={t} onChange={e=>setT(Math.max(1, parseInt(e.target.value)||1))} className="input" style={{width:'80px'}} />
        </div>
      </div>

      <div className="grid grid-cols-2 gap-2 text-sm">
        <div className="result-box" style={{borderColor: '#3b82f6'}}>
          <div className="text-blue font-bold mb-1">🏦 Simple Interest (SI)</div>
          <div>Interest: <strong className="text-white">₹{si.toLocaleString()}</strong></div>
          <div>Total Amount: <strong className="green">₹{(p + si).toLocaleString()}</strong></div>
          <div className="text-xs text-slate-400 mt-1">SI = \(\frac{P \times T \times R}{100}\)</div>
        </div>

        <div className="result-box" style={{borderColor: '#10b981'}}>
          <div className="text-emerald font-bold mb-1">🌱 Compound Interest (CI)</div>
          <div>Interest: <strong className="text-white">₹{Math.round(ci).toLocaleString()}</strong></div>
          <div>Total Amount: <strong className="green">₹{Math.round(ciAmount).toLocaleString()}</strong></div>
          <div className="text-xs text-slate-400 mt-1">CI = \(P(1 + \frac{R}{100})^T - P\)</div>
        </div>
      </div>

      <div className="tip">
        💰 <strong>The Difference:</strong> After {t} years, Compound Interest gives you <strong>₹{Math.round(ci - si).toLocaleString()}</strong> MORE than Simple Interest because each year's interest is added back to earn more interest!
      </div>
    </div>
  );
}

// Tab 5: Practice Quiz
function QuizTab(){
  const [selected, setSelected] = useState({});
  const [score, setScore] = useState(null);

  const questions = [
    {
      q: "1. Convert 3/5 into a percentage:",
      opts: ["35%", "50%", "60%", "75%"],
      ans: 2,
      exp: "3/5 = (3 × 20) / (5 × 20) = 60/100 = 60%."
    },
    {
      q: "2. If a shirt costing ₹400 is sold for ₹480, what is the profit percentage?",
      opts: ["15%", "20%", "25%", "80%"],
      ans: 1,
      exp: "Profit = 480 - 400 = 80. Profit % = (80 / 400) × 100 = 20%."
    },
    {
      q: "3. 15% of 60 kg equals:",
      opts: ["6 kg", "9 kg", "12 kg", "15 kg"],
      ans: 1,
      exp: "15/100 × 60 = 900 / 100 = 9 kg."
    },
    {
      q: "4. A bicycle marked ₹2,000 has a 10% discount. What is the selling price?",
      opts: ["₹1,800", "₹1,900", "₹1,980", "₹2,200"],
      ans: 0,
      exp: "Discount = 10% of 2000 = ₹200. SP = 2000 - 200 = ₹1,800."
    }
  ];

  const handleSelect = (qIdx, optIdx) => {
    setSelected(prev => ({...prev, [qIdx]: optIdx}));
    sound.play(500, 0.05);
  };

  const handleCheck = () => {
    let s = 0;
    questions.forEach((q, i) => {
      if (selected[i] === q.ans) s++;
    });
    setScore(s);
    if(s === questions.length) sound.playWin();
  };

  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Figure It Out Quiz (స్వయం మూల్యాంకనం)</h2>
      <p className="sub">Test your understanding of percentages, profit/loss, and interest.</p>

      {questions.map((q, qIdx) => (
        <div key={qIdx} className="result-box space-y-1">
          <div className="font-bold text-white text-sm">{q.q}</div>
          <div className="grid grid-cols-2 gap-1">
            {q.opts.map((opt, oIdx) => {
              let cls = "quiz-opt";
              if (score !== null) {
                if (oIdx === q.ans) cls += " correct";
                else if (selected[qIdx] === oIdx) cls += " wrong";
              } else if (selected[qIdx] === oIdx) {
                cls += " border-orange-500 bg-orange-950/40";
              }
              return (
                <button key={oIdx} className={cls} onClick={() => handleSelect(qIdx, oIdx)}>
                  {opt}
                </button>
              );
            })}
          </div>
          {score !== null && (
            <div className="text-xs text-slate-300 mt-1">💡 {q.exp}</div>
          )}
        </div>
      ))}

      <div className="flex justify-between items-center mt-2">
        <button className="btn btn-orange" onClick={handleCheck}>
          Submit Answers
        </button>
        {score !== null && (
          <div className="text-base font-bold text-white">
            Score: <span className="green">{score} / {questions.length}</span>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [tab, setTab] = useState('grid');
  const [isFs, setIsFs] = useState(false);

  const toggleFs = () => {
    if (!document.fullscreenElement) {
      document.querySelector('.simulation-container').requestFullscreen?.();
      setIsFs(true);
    } else {
      document.exitFullscreen?.();
      setIsFs(false);
    }
  };

  return (
    <div className="simulation-container">
      <div className="tab-bar">
        <button className={`tab ${tab==='grid'?'on':''}`} onClick={()=>{setTab('grid');sound.play();}}>
          📊 100 Grid
        </button>
        <button className={`tab ${tab==='qty'?'on':''}`} onClick={()=>{setTab('qty');sound.play();}}>
          🔢 Quantity %
        </button>
        <button className={`tab ${tab==='pl'?'on':''}`} onClick={()=>{setTab('pl');sound.play();}}>
          🏷️ Profit & Loss
        </button>
        <button className={`tab ${tab==='interest'?'on':''}`} onClick={()=>{setTab('interest');sound.play();}}>
          💰 CI vs SI
        </button>
        <button className={`tab ${tab==='quiz'?'on':''}`} onClick={()=>{setTab('quiz');sound.play();}}>
          🎯 Practice Quiz
        </button>
        <div className="flex-1"></div>
        <button className="tab" onClick={toggleFs} title="Toggle Fullscreen">
          {isFs ? '✕' : '⛶'}
        </button>
      </div>

      <div className="flex-1 p-2 overflow-hidden">
        {tab === 'grid' && <HundredGridTab />}
        {tab === 'qty' && <QuantityTab />}
        {tab === 'pl' && <ProfitLossTab />}
        {tab === 'interest' && <InterestTab />}
        {tab === 'quiz' && <QuizTab />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
