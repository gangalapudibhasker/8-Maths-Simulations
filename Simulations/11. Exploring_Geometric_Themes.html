<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}
const sound = new SoundEngine();

// 1. OVERVIEW & GOOGLE FLOW MIND MAP
function OverviewTab({ onJumpTab }){
  const nodes = [
    { id:'fractals', title:'1. Fractals & Sierpinski', tel:'ఫ్రాక్టల్స్ - స్వయం సారూప్యత', color:'purple', desc:'Intricate shapes exhibiting infinite self-similarity at every scale. Sierpinski triangle recursive construction.', formula:'3ⁿ sub-triangles, (¾)ⁿ area', badge:'Fractal Geometry' },
    { id:'tessell', title:'2. Tessellations & Tilings', tel:'టైలింగ్ (నేలపరుపు నమూనాలు)', color:'blue', desc:'Covering a flat surface without gaps or overlaps. Why only triangles, squares, and hexagons form regular tilings.', formula:'Sum of angles at vertex = 360°', badge:'2D Tilings' },
    { id:'euler', title:'3. Euler Polyhedral Formula', tel:'ఆయిలర్ సూత్రం: V - E + F = 2', color:'emerald', desc:'The universal relationship for any convex polyhedron: Vertices (V) - Edges (E) + Faces (F) = 2 always.', formula:'V - E + F = 2', badge:'3D Polyhedra' },
    { id:'platonic', title:'4. The 5 Platonic Solids', tel:'5 ప్లాటోనిక్ ఘనాకారాలు', color:'amber', desc:'Regular polyhedra: Tetrahedron, Cube, Octahedron, Dodecahedron, and Icosahedron.', formula:'Tetrahedron: 4 - 6 + 4 = 2', badge:'Regular Solids' },
    { id:'nets', title:'5. Polyhedral Nets', tel:'ఘనాకారాల తలాల నెట్స్ (విస్తరణ)', color:'orange', desc:'2D flat folding patterns that fold up to form 3D solids like cubes, pyramids, and prisms.', formula:'Fold 2D Flat → 3D Shape', badge:'Spatial Reasoning' },
    { id:'figout', title:'6. Figure It Out Problems', tel:'పాఠ్యపుస్తక సాధన ప్రశ్నలు', color:'rose', desc:'Complete step-by-step solutions for all NCERT Ganita Prakash Chapter 11 exercises.', formula:'All 11.1 - 11.3 Problems Solved', badge:'SCERT Textbook' }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-start flex-wrap gap-2">
        <div>
          <h2>Chapter 11: Exploring Geometric Themes (కొన్ని జ్యామితీయ అంశాల అన్వేషణ)</h2>
          <p className="sub">AP SCERT Class 8 Mathematics Semester 2 • Fractals, Tilings, Polyhedra & Euler Formula</p>
        </div>
        <span className="badge" style={{background:'rgba(168,85,247,0.2)',color:'#c084fc',padding:'0.4rem 0.8rem',fontSize:'0.9rem'}}>
          🧠 Interactive Concept Flow Map
        </span>
      </div>

      <div className="flow-container">
        <div className="flow-nodes">
          {/* Central Root Node */}
          <div className="flow-root">
            <span style={{fontSize:'1.6rem',display:'block',marginBottom:'.2rem'}}>🧊 ❄️</span>
            <h3 style={{fontSize:'1.15rem',fontWeight:800,margin:0}}>Exploring Geometric Themes</h3>
            <p style={{fontSize:'0.85rem',color:'#f3e8ff',marginTop:'.2rem',marginBottom:'.4rem'}}>కొన్ని జ్యామితీయ అంశాల అన్వేషణ (Fractals & Polyhedra)</p>
            <span style={{background:'rgba(0,0,0,0.3)',padding:'2px 8px',borderRadius:20,fontSize:'0.75rem',fontWeight:700}}>Grade 8 Ganita Prakash</span>
          </div>

          <div style={{textAlign:'center',color:'#94a3b8',fontSize:'0.85rem'}}>
            ⬇️ <em>Explore major concept branches below (click any card to open interactive simulation)</em> ⬇️
          </div>

          {/* Flow Branches */}
          <div className="flow-branches">
            {nodes.map(n => (
              <div key={n.id} className={`flow-card ${n.color}`} onClick={()=>{ sound.playClick(); onJumpTab(n.id); }}>
                <div className="flex justify-between items-center mb-1">
                  <span className="badge" style={{fontSize:'0.72rem',background:'rgba(255,255,255,0.1)',color:'#fff'}}>{n.badge}</span>

          </div>
        </div>
      </div>

      <div className="tip-purple">
        ✨ <strong>Euler Formula for Polyhedra:</strong> For any convex polyhedron with V vertices, E edges, and F faces, the formula <code>V - E + F = 2</code> always holds true! Discovered by Swiss genius Leonhard Euler in 1752.

// 2. FRACTALS: SIERPINSKI TRIANGLE SIMULATOR
function FractalsTab(){
  const [level, setLevel] = useState(3);

  // Recursive Sierpinski Triangle generator
  const drawSierpinski = (p1, p2, p3, depth) => {
    if (depth === 0) {
      return (
        <polygon 
          points={`${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`} 
          fill="#a855f7" 
          stroke="#c084fc" 
          strokeWidth="0.5" 
        />
      );
    }
    const m12 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    const m23 = { x: (p2.x + p3.x) / 2, y: (p2.y + p3.y) / 2 };
    const m31 = { x: (p3.x + p1.x) / 2, y: (p3.y + p1.y) / 2 };

    return (
      <g>
        {drawSierpinski(p1, m12, m31, depth - 1)}
        {drawSierpinski(m12, p2, m23, depth - 1)}
        {drawSierpinski(m31, m23, p3, depth - 1)}
      </g>
    );
  };

  const numTriangles = Math.pow(3, level);
  const remainingArea = Math.pow(3/4, level) * 100;

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Sierpinski Triangle Fractal (సియర్‌పిన్స్కీ త్రిభుజం)</h2>
      <p className="sub">At each step, remove the central upside-down triangle. Watch self-similarity evolve into infinite complexity!</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        {/* SVG Drawing */}
        <div className="result-box flex justify-center items-center p-2" style={{minHeight:260,background:'#070b14'}}>
          <svg width="260" height="230" viewBox="0 0 260 230">
            {drawSierpinski({x: 130, y: 15}, {x: 15, y: 215}, {x: 245, y: 215}, level)}
          </svg>
        </div>

        {/* Sliders & Math Properties */}
        <div className="space-y-3">
          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Recursion Step (పునరావృత దశ N):</label>
              <span className="text-lg font-black purple">Step {level}</span>
            </div>
            <input type="range" min="0" max="5" value={level} className="slider" onChange={e=>{ sound.playClick(); setLevel(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-2 text-sm font-mono">
            <div>Number of shaded triangles: 3^{level} = <span className="purple font-bold">{numTriangles}</span></div>
            <div>Remaining Area fraction: (3/4)^{level} = <span className="amber font-bold">{remainingArea.toFixed(2)}%</span></div>
            <div className="text-xs slate mt-1">As N → ∞, Area → 0, but total perimeter → ∞!</div>
          </div>

          <div className="row gap-2">
            {[0, 1, 2, 3, 4, 5].map(l => (
              <button key={l} className="btn btn-dark btn-sm" onClick={()=>{ sound.playClick(); setLevel(l); }}>
                Step {l}
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// 3. TESSELLATIONS AND TILINGS LAB
function TessellationTab(){
  const [shape, setShape] = useState('hex');

  const shapes = {
    tri: { name: 'Equilateral Triangle', angle: 60, count: 6, tiles: true, desc: '6 × 60° = 360°. Tiles the plane seamlessly!' },
    sq: { name: 'Square', angle: 90, count: 4, tiles: true, desc: '4 × 90° = 360°. Standard checkerboard floor tiling.' },
    pent: { name: 'Regular Pentagon', angle: 108, count: 3, tiles: false, desc: '3 × 108° = 324° (gap of 36°). Cannot tile alone!' },
    hex: { name: 'Regular Hexagon', angle: 120, count: 3, tiles: true, desc: '3 × 120° = 360°. Nature\'s honeycomb pattern!' }
  };

  const curr = shapes[shape];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Tessellations & Tilings (తలాల నేలపరుపు నమూనాలు)</h2>
      <p className="sub">Discover which regular polygons can tile a plane without gaps or overlaps (vertex angle sum must equal 360°).</p>

      <div className="row gap-2">
        <button className={`btn btn-sm ${shape==='tri'?'btn-orange':'btn-dark'}`} onClick={()=>{ sound.playClick(); setShape('tri'); }}>Equilateral Triangle (60°)</button>
        <button className={`btn btn-sm ${shape==='sq'?'btn-orange':'btn-dark'}`} onClick={()=>{ sound.playClick(); setShape('sq'); }}>Square (90°)</button>
        <button className={`btn btn-sm ${shape==='pent'?'btn-orange':'btn-dark'}`} onClick={()=>{ sound.playClick(); setShape('pent'); }}>Pentagon (108° - No!)</button>
        <button className={`btn btn-sm ${shape==='hex'?'btn-orange':'btn-dark'}`} onClick={()=>{ sound.playClick(); setShape('hex'); }}>Hexagon (120° - Honeycomb)</button>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        <div className={`p-4 rounded-xl border-2 ${curr.tiles ? 'border-emerald-500 bg-emerald-950/40' : 'border-rose-500 bg-rose-950/40'} space-y-2`}>
          <div className="flex justify-between items-center">
            <h3 className="text-base font-bold text-white">{curr.name}</h3>
            <span className={`badge ${curr.tiles ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'}`}>
              {curr.tiles ? '✅ Can Tile Plane' : '❌ Cannot Tile Plane'}
            </span>
          </div>

          <div className="text-sm font-mono">
            <div>Interior Angle: <strong>{curr.angle}°</strong></div>
            <div>At each vertex: {curr.count} shapes meet</div>
            <div>Vertex sum = {curr.count} × {curr.angle}° = <strong className={curr.tiles ? 'green text-base' : 'red text-base'}>{curr.count * curr.angle}°</strong></div>
          </div>

          <p className="text-sm text-slate-200 mt-2">{curr.desc}</p>
        </div>

        {/* Visual representation of vertex meeting */}
        <div className="result-box flex justify-center items-center p-3" style={{minHeight:220,background:'#070b14'}}>
          <svg width="200" height="200" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="80" fill="none" stroke="#334155" strokeWidth="1" strokeDasharray="3 3" />
            {shape === 'hex' && (
              <g stroke="#38bdf8" strokeWidth="2" fill="rgba(56,189,248,0.25)">
                <polygon points="100,100 160,100 130,152 70,152 40,100 70,48 100,100" />
                <polygon points="100,100 100,30 160,0 200,50 160,100" />
                <polygon points="100,100 40,100 0,50 40,0 100,30" />
              </g>
            )}
            {shape === 'sq' && (
              <g stroke="#f97316" strokeWidth="2" fill="rgba(249,115,22,0.25)">
                <rect x="100" y="20" width="80" height="80" />
                <rect x="20" y="20" width="80" height="80" />
                <rect x="20" y="100" width="80" height="80" />
                <rect x="100" y="100" width="80" height="80" />
              </g>
            )}
            {shape === 'tri' && (
              <g stroke="#10b981" strokeWidth="2" fill="rgba(16,185,129,0.25)">
                <polygon points="100,100 180,100 140,31" />
                <polygon points="100,100 140,31 60,31" />
                <polygon points="100,100 60,31 20,100" />
                <polygon points="100,100 20,100 60,169" />
                <polygon points="100,100 60,169 140,169" />
                <polygon points="100,100 140,169 180,100" />
              </g>
            )}

// 5. FIGURE IT OUT STEP-BY-STEP PROBLEMS
function FigOutTab(){
  const [activeProb, setActiveProb] = useState(0);

  const problems = [
    {
      q: "Q1. A polyhedron has 12 vertices and 30 edges. How many faces does it have?",
      tel: "ప్రశ్న 1: ఒక బహుముఖికి 12 శీర్షాలు మరియు 30 అంచులు కలవు. దానికి గల తలాల సంఖ్య ఎంత?",
      steps: [
        "Given: Vertices V = 12, Edges E = 30",
        "By Euler's Polyhedral Formula: V - E + F = 2",
        "12 - 30 + F = 2",
        "-18 + F = 2  →  F = 2 + 18 = 20 faces (This is an Icosahedron!)"
      ],
      ans: "Number of Faces F = 20"
    },
    {
      q: "Q2. Can a polyhedron have 10 faces, 20 edges, and 15 vertices?",
      tel: "ప్రశ్న 2: 10 తలాలు, 20 అంచులు, 15 శీర్షాలు గల బహుముఖి సాధ్యమేనా?",
      steps: [
        "Given: F = 10, E = 20, V = 15",
        "Test Euler's formula: V - E + F",
        "15 - 20 + 10 = 5",
        "Since 5 ≠ 2, Euler's formula is violated. Therefore, such a polyhedron cannot exist!"
      ],
      ans: "No, such a polyhedron does NOT exist."
    },
    {
      q: "Q3. Why is it impossible to tile a floor using only regular octagons?",
      tel: "ప్రశ్న 3: కేవలం క్రమ అష్టభుజులను మాత్రమే ఉపయోగించి నేలను ఖాళీలు లేకుండా పరచడం ఎందుకు సాధ్యం కాదు?",
      steps: [
        "Each interior angle of a regular octagon = (8 - 2) × 180° ÷ 8 = 135°",
        "For seamless tiling, the angles meeting at a vertex must sum to exactly 360°.",
        "Two octagons: 135° + 135° = 270° (leaves a 90° gap).",
        "Three octagons: 135° × 3 = 405° > 360° (they overlap).",
        "Since 360° is not divisible by 135°, regular octagons cannot tile the plane alone (they need squares to fill the 90° gaps!)."
      ],
      ans: "Vertex sum cannot equal 360° (leaves a 90° square gap)."
    }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Figure It Out Textbook Solutions (సాధించిన సమస్యలు)</h2>

      <div className="flex gap-2 mb-2">
        {problems.map((p, idx) => (
          <button 
            key={idx} 
            className={`btn btn-sm ${activeProb===idx ? 'btn-orange' : 'btn-dark'}`}
            onClick={()=>{ sound.playClick(); setActiveProb(idx); }}
          >
            Problem {idx+1}
          </button>
        ))}
      </div>

      <div className="result-box space-y-2">
        <h3 className="text-base font-bold orange">{problems[activeProb].q}</h3>
        <p className="text-sm slate">{problems[activeProb].tel}</p>

        <div className="mt-3 p-3 bg-slate-900 rounded-lg space-y-2 border border-slate-700">
          <div className="text-xs font-bold text-yellow-400">Step-by-Step Solution:</div>
          {problems[activeProb].steps.map((st, i) => (
            <div key={i} className="text-sm text-slate-200 pl-3 border-l-2 border-orange-500">

}

// 6. QUIZ TAB
function QuizTab(){
  const [selected, setSelected] = useState({});
  const [score, setScore] = useState(null);

  const questions = [
    {
      q: "What is Euler's formula for convex polyhedra?",
      opts: ["V + E + F = 2", "V - E + F = 2", "V + E - F = 2", "F - V + E = 2"],
      ans: 1,
      exp: "Euler's formula states V - E + F = 2."
    },
    {
      q: "How many faces and vertices does a cube have?",
      opts: ["6 faces, 8 vertices", "8 faces, 6 vertices", "6 faces, 12 vertices", "12 faces, 8 vertices"],
      ans: 0,
      exp: "A cube has 6 square faces, 8 vertices, and 12 edges."
    },
    {
      q: "Which of the following regular polygons CANNOT tile the plane alone?",
      opts: ["Equilateral Triangle", "Square", "Regular Pentagon", "Regular Hexagon"],
      ans: 2,
      exp: "A regular pentagon has an interior angle of 108°, which does not divide 360°."
    },
    {
      q: "In a Sierpinski triangle, what fraction of area remains after N iterations?",
      opts: ["(1/2)ⁿ", "(3/4)ⁿ", "(2/3)ⁿ", "(1/4)ⁿ"],
      ans: 1,
      exp: "Each step removes 1/4 of the remaining area, leaving 3/4."
    }
  ];

  const handleSelect = (qIdx, optIdx) => {
    sound.playClick();
    setSelected({ ...selected, [qIdx]: optIdx });
  };

  const calculateScore = () => {
    let s = 0;
    questions.forEach((q, i) => {
      if (selected[i] === q.ans) s++;
    });
    setScore(s);
    sound.playSuccess();
  };

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-center">
        <h2>Chapter 11 Mastery Quiz (స్వీయ మూల్యాంకనం)</h2>
        {score !== null && (
          <span className="badge" style={{background:'#10b981',color:'#fff',padding:'0.4rem 0.8rem',fontSize:'1rem'}}>
            Score: {score} / {questions.length}
          </span>
        )}
      </div>

      <div className="space-y-3">
        {questions.map((q, qIdx) => (
          <div key={qIdx} className="result-box space-y-2">
            <div className="text-sm font-bold text-white">{qIdx+1}. {q.q}</div>
            <div className="space-y-1">
              {q.opts.map((opt, oIdx) => {
                let cls = "quiz-opt";
                if (score !== null) {
                  if (oIdx === q.ans) cls += " correct";
                  else if (selected[qIdx] === oIdx) cls += " wrong";
                  cls += " disabled";
                } else if (selected[qIdx] === oIdx) {
                  cls += " border-orange-500 bg-orange-950";
                }
                return (
                  <div key={oIdx} className={cls} onClick={()=>handleSelect(qIdx, oIdx)}>
                    <span style={{fontWeight:800}}>{String.fromCharCode(65+oIdx)}.</span>
                    <span>{opt}</span>
                  </div>
                );
              })}
            </div>
            {score !== null && (
              <div className="text-xs text-yellow-300 mt-1">
                💡 <strong>Explanation:</strong> {q.exp}
              </div>
            )}
          </div>
        ))}
      </div>

      <div className="text-center pt-2">
        {score === null ? (
          <button className="btn btn-orange text-base" onClick={calculateScore}>
            Submit Quiz & Check Score
          </button>
        ) : (
          <button className="btn btn-dark text-base" onClick={()=>{ setSelected({}); setScore(null); }}>
            Retake Quiz
          </button>
        )}
      </div>
    </div>
  );
}

// 7. WHITEBOARD TAB
function WhiteboardTab(){
  const canvasRef = useRef(null);
  const [color, setColor] = useState('#a855f7');
  const [size, setSize] = useState(5);
  const drawingRef = useRef(false);

  useEffect(()=>{
    const c = canvasRef.current;
    if(!c) return;
    const ctx = c.getContext('2d');
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  },[]);

  const startDraw = (e)=>{ drawingRef.current = true; draw(e); };
  const endDraw = ()=>{ drawingRef.current = false; };
  const draw = (e)=>{
    if(!drawingRef.current) return;
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    const rect = c.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const clear = ()=>{
    sound.playClick();
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  };

  return (
    <div className="card h-full flex flex-col space-y-2 overflow-hidden">
      <div className="flex justify-between items-center flex-wrap gap-2 flex-shrink-0">
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold slate">Color:</span>
          {['#a855f7','#38bdf8','#f97316','#10b981','#ffffff','#f87171'].map(c=>(
            <button key={c} onClick={()=>{sound.playClick();setColor(c)}}
              style={{width:24,height:24,borderRadius:'50%',border:color===c?'2px solid #fff':'none',background:c,cursor:'pointer'}}/>
          ))}
          <span className="text-xs font-bold slate ml-2">Size:</span>
          {[3, 6, 12].map(s=>(
            <button key={s} className={`btn btn-sm ${size===s?'btn-purple':'btn-dark'}`} onClick={()=>{sound.playClick();setSize(s)}}>{s}px</button>
          ))}
        </div>
        <button className="btn btn-sm" style={{background:'#dc2626',color:'#fff'}} onClick={clear}>Clear Board</button>
      </div>

      <div className="flex-1 rounded-xl overflow-hidden border border-slate-600 relative" style={{minHeight:0,touchAction:'none'}}>
        <canvas 
          ref={canvasRef} 
          style={{width:'100%',height:'100%',display:'block',cursor:'crosshair'}}
          onMouseDown={startDraw} onMouseUp={endDraw} onMouseMove={draw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchEnd={endDraw} onTouchMove={draw}
        />
      </div>
      <p className="text-xs slate text-center flex-shrink-0">Geometric Scratchpad • Sketch polyhedral nets, tessellation tilings, and fractal trees.</p>
    </div>
  );
}
