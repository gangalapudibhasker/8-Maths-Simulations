<style>

.flow-card.amber{border-color:#f59e0b;box-shadow:0 0 15px rgba(245,158,11,.2)}
.flow-card.rose{border-color:#f43f5e;box-shadow:0 0 15px rgba(244,63,94,.2)}

<body>
<div id="root" class="viewport-wrapper"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}
const sound = new SoundEngine();

// 1. OVERVIEW & GOOGLE FLOW MIND MAP
function OverviewTab({ onJumpTab }){
  const nodes = [
    { id:'plane', title:'1. Cartesian Coordinate Plane', tel:'కార్టీసియన్ నిరూపక తలం', color:'blue', desc:'Two perpendicular number lines (x-axis and y-axis) intersecting at Origin (0,0) dividing into 4 quadrants.', formula:'Point P = (x, y)', badge:'Coordinate Grid' },
    { id:'target', title:'2. Hit the Point Game', tel:'చుక్కల గురి ఆట (Target Game)', color:'emerald', desc:'Interactive target practice: locate coordinates in quadrants I, II, III, and IV with positive/negative signs.', formula:'Q1(+,+), Q2(-,+), Q3(-,-), Q4(+,-)', badge:'Interactive Game' },
    { id:'linear', title:'3. Linear Graphs & Relations', tel:'సరళరేఖా గ్రాఫ్‌లు & సమీకరణాలు', color:'orange', desc:'Plotting relationships like Distance vs Time, Perimeter vs Side, and Temperature variations.', formula:'y = mx + c (Straight Line)', badge:'Linear Graphs' },
    { id:'cartog', title:'4. Maps & Cartography', tel:'పటములు - రేఖాంశాలు - అక్షాంశాలు', color:'purple', desc:'How mapmakers and GPS systems use coordinate grids, latitude, longitude, and map scales to navigate Earth.', formula:'Grid Reference (Easting, Northing)', badge:'Real-world Navigation' },
    { id:'slopes', title:'5. Rate of Change / Slope', tel:'వాలు (Slope) & మార్పు రేటు', color:'amber', desc:'Slope m = (y₂ - y₁) / (x₂ - x₁) represents physical rates like speed (km/h) or cost per unit.', formula:'Slope m = Δy / Δx', badge:'Rate of Change' },
    { id:'figout', title:'6. Figure It Out Problems', tel:'పాఠ్యపుస్తక సాధన ప్రశ్నలు', color:'rose', desc:'Complete step-by-step solutions for all NCERT Ganita Prakash Chapter 12 exercises.', formula:'All 12.1 - 12.3 Problems Solved', badge:'SCERT Textbook' }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-start flex-wrap gap-2">
        <div>
          <h2>Chapter 12: Tales by Dots and Lines (చుక్కలు, రేఖలు చెప్పే కథలు)</h2>
          <p className="sub">AP SCERT Class 8 Mathematics Semester 2 • Coordinate Geometry, Plotting & Linear Graphs</p>
        </div>
        <span className="badge" style={{background:'rgba(59,130,246,0.2)',color:'#60a5fa',padding:'0.4rem 0.8rem',fontSize:'0.9rem'}}>
          🧠 Interactive Concept Flow Map
        </span>
      </div>

      <div className="flow-container">
        <div className="flow-nodes">
          {/* Central Root Node */}
          <div className="flow-root">
            <span style={{fontSize:'1.6rem',display:'block',marginBottom:'.2rem'}}>📍 📈</span>
            <h3 style={{fontSize:'1.15rem',fontWeight:800,margin:0}}>Tales by Dots and Lines</h3>
            <p style={{fontSize:'0.85rem',color:'#dbeafe',marginTop:'.2rem',marginBottom:'.4rem'}}>చుక్కలు, రేఖలు చెప్పే కథలు (Coordinate Geometry & Graphs)</p>
            <span style={{background:'rgba(0,0,0,0.3)',padding:'2px 8px',borderRadius:20,fontSize:'0.75rem',fontWeight:700}}>Grade 8 Ganita Prakash</span>
          </div>

          <div style={{textAlign:'center',color:'#94a3b8',fontSize:'0.85rem'}}>
            ⬇️ <em>Explore major concept branches below (click any card to open interactive simulation)</em> ⬇️
          </div>

          {/* Flow Branches */}
          <div className="flow-branches">
            {nodes.map(n => (
              <div key={n.id} className={`flow-card ${n.color}`} onClick={()=>{ sound.playClick(); onJumpTab(n.id); }}>
                <div className="flex justify-between items-center mb-1">
                  <span className="badge" style={{fontSize:'0.72rem',background:'rgba(255,255,255,0.1)',color:'#fff'}}>{n.badge}</span>
                  <span style={{fontSize:'0.8rem',color:'#38bdf8'}}>👉 Open Tab</span>
                </div>
                <h4 style={{fontSize:'1rem',fontWeight:800,color:'#fff',margin:'0.2rem 0'}}>{n.title}</h4>
                <div style={{fontSize:'0.82rem',color:'#cbd5e1',marginBottom:'.4rem'}}>{n.tel}</div>
                <p style={{fontSize:'0.82rem',color:'#94a3b8',lineHeight:1.35,marginBottom:'.5rem'}}>{n.desc}</p>
                <div className="result-box font-mono" style={{padding:'0.35rem 0.6rem',fontSize:'0.82rem',color:'#fef08a'}}>
                  {n.formula}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="tip-blue">
        📌 <strong>René Descartes (1596-1650):</strong> Legend says Descartes discovered coordinate geometry while lying in bed watching a fly crawl across the ceiling. He realized its exact position could be described by its distances from two adjacent walls!
      </div>
    </div>
  );
}

// 2. INTERACTIVE CARTESIAN PLANE TAB
function PlaneTab(){
  const [ptX, setPtX] = useState(3);
  const [ptY, setPtY] = useState(4);

  // Quadrant determination
  let quad = "Origin (0,0)";
  if (ptX > 0 && ptY > 0) quad = "Quadrant I (Q1: +, +)";
  else if (ptX < 0 && ptY > 0) quad = "Quadrant II (Q2: -, +)";
  else if (ptX < 0 && ptY < 0) quad = "Quadrant III (Q3: -, -)";
  else if (ptX > 0 && ptY < 0) quad = "Quadrant IV (Q4: +, -)";
  else if (ptX === 0 && ptY !== 0) quad = "On Y-Axis";
  else if (ptY === 0 && ptX !== 0) quad = "On X-Axis";

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Interactive Cartesian Coordinate Plane (నిరూపక తలం)</h2>
      <p className="sub">Adjust the sliders or observe the point (x, y) moving dynamically across the four quadrants.</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        {/* SVG Coordinate Grid */}
        <div className="result-box flex justify-center items-center p-2" style={{minHeight:260,background:'#070b14'}}>
          <svg width="250" height="250" viewBox="-125 -125 250 250">
            {/* Grid lines */}
            {[-100, -75, -50, -25, 25, 50, 75, 100].map(pos => (
              <g key={pos}>
                <line x1={pos} y1="-120" x2={pos} y2="120" stroke="#1e293b" strokeWidth="1" />
                <line x1="-120" y1={pos} x2="120" y2={pos} stroke="#1e293b" strokeWidth="1" />
              </g>
            ))}

            {/* Axes */}
            <line x1="-120" y1="0" x2="120" y2="0" stroke="#64748b" strokeWidth="2" />
            <line x1="0" y1="-120" x2="0" y2="120" stroke="#64748b" strokeWidth="2" />
            <text x="110" y="-5" fill="#94a3b8" fontSize="10">X</text>
            <text x="5" y="-110" fill="#94a3b8" fontSize="10">Y</text>

            {/* Projected dashed lines from axes to point */}
            <line x1={ptX * 12} y1="0" x2={ptX * 12} y2={-ptY * 12} stroke="#f97316" strokeDasharray="3 3" strokeWidth="1.5" />
            <line x1="0" y1={-ptY * 12} x2={ptX * 12} y2={-ptY * 12} stroke="#3b82f6" strokeDasharray="3 3" strokeWidth="1.5" />

            {/* The Point P */}
            <circle cx={ptX * 12} cy={-ptY * 12} r="6" fill="#10b981" stroke="#fff" strokeWidth="2" />
            <text x={ptX * 12 + 8} y={-ptY * 12 - 6} fill="#fff" fontSize="12" fontWeight="bold">
              P({ptX}, {ptY})
            </text>
          </svg>
        </div>

        {/* Sliders & Coordinates */}
        <div className="space-y-3">
          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>X-Coordinate (Abscissa / క్షితిజ సమాంతర దూరం):</label>
              <span className="font-bold blue font-mono text-lg">x = {ptX}</span>
            </div>
            <input type="range" min="-8" max="8" value={ptX} className="slider" onChange={e=>{ sound.playClick(); setPtX(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Y-Coordinate (Ordinate / నిలువు దూరం):</label>
              <span className="font-bold orange font-mono text-lg">y = {ptY}</span>
            </div>
            <input type="range" min="-8" max="8" value={ptY} className="slider" onChange={e=>{ sound.playClick(); setPtY(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-1">
            <div className="text-xs font-bold green">Location Details:</div>
            <div className="text-base font-bold text-white">Current Point: <span className="green">({ptX}, {ptY})</span></div>
            <div className="text-sm font-bold text-yellow-300">Position: {quad}</div>
            <div className="text-xs slate mt-1">Perpendicular distance from Y-axis = |{ptX}|, from X-axis = |{ptY}|.</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// 3. HIT THE POINT TARGET GAME
function TargetGameTab(){
  const [target, setTarget] = useState({ x: 3, y: 2 });
  const [score, setScore] = useState(0);
  const [msg, setMsg] = useState('Click on the grid to hit the target coordinates!');

  const spawnNewTarget = () => {
    const rx = Math.floor(Math.random() * 9) - 4; // -4 to 4
    const ry = Math.floor(Math.random() * 9) - 4;
    setTarget({ x: rx, y: ry });
  };

  const handleSvgClick = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const clickX = e.clientX - rect.left - 110;
    const clickY = -(e.clientY - rect.top - 110);
    const gridX = Math.round(clickX / 20);
    const gridY = Math.round(clickY / 20);

    if (gridX === target.x && gridY === target.y) {
      sound.playSuccess();
      setScore(score + 1);
      setMsg(`🎯 DIRECT HIT! Point (${gridX}, ${gridY}) is correct! +1 Point`);
      spawnNewTarget();
    } else {
      sound.playClick();
      setMsg(`❌ Missed! You clicked (${gridX}, ${gridY}). Target was (${target.x}, ${target.y}). Try again!`);
    }
  };

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-center">
        <h2>Hit the Point Game (చుక్కల గురి ఆట)</h2>
        <span className="badge" style={{background:'#10b981',color:'#fff',padding:'0.3rem 0.8rem',fontSize:'1rem'}}>
          Score: {score} 🎯
        </span>
      </div>
      <p className="sub">Locate and click the exact point on the grid given the target coordinates!</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        <div className="result-box flex justify-center items-center p-2" style={{minHeight:240,background:'#070b14'}}>
          <svg width="220" height="220" viewBox="-110 -110 220 220" style={{cursor:'crosshair'}} onClick={handleSvgClick}>
            {/* Grid lines */}
            {[-80, -60, -40, -20, 20, 40, 60, 80].map(pos => (
              <g key={pos}>
                <line x1={pos} y1="-100" x2={pos} y2="100" stroke="#1e293b" strokeWidth="1" />
                <line x1="-100" y1={pos} x2="100" y2={pos} stroke="#1e293b" strokeWidth="1" />
              </g>
            ))}
            {/* Axes */}
            <line x1="-100" y1="0" x2="100" y2="0" stroke="#64748b" strokeWidth="2" />
            <line x1="0" y1="-100" x2="0" y2="100" stroke="#64748b" strokeWidth="2" />

            {/* Target indicator ring */}
            <circle cx={target.x * 20} cy={-target.y * 20} r="10" fill="none" stroke="#f43f5e" strokeWidth="2" strokeDasharray="3 2" />
          </svg>
        </div>

        <div className="space-y-3">
          <div className="p-4 bg-orange-950 border border-orange-500 rounded-xl text-center space-y-1">
            <div className="text-xs text-orange-300 font-bold">CURRENT TARGET:</div>
            <div className="text-3xl font-black orange font-mono">
              ({target.x}, {target.y})
            </div>
            <div className="text-xs text-slate-300">Click on the grid crosshair to hit this point!</div>
          </div>

          <div className="result-box text-sm font-bold text-center green">
            {msg}
          </div>

          <button className="btn btn-dark w-full" onClick={()=>{ sound.playClick(); spawnNewTarget(); }}>
            Skip to Next Target
          </button>
        </div>
      </div>
    </div>
  );

// 6. QUIZ TAB
function QuizTab(){
  const [selected, setSelected] = useState({});
  const [score, setScore] = useState(null);

  const questions = [
    {
      q: "In which quadrant does the point (-5, 6) lie?",
      opts: ["Quadrant I", "Quadrant II", "Quadrant III", "Quadrant IV"],
      ans: 1,
      exp: "x is negative and y is positive, which is Quadrant II."
    },
    {
      q: "What is the equation of the X-axis?",
      opts: ["x = 0", "y = 0", "x = y", "x + y = 0"],
      ans: 1,
      exp: "Along the entire X-axis, the vertical y-coordinate is always 0."
    },
    {
      q: "If a line passes through the origin with slope m = 3, its equation is:",
      opts: ["y = 3x", "y = x + 3", "x = 3y", "y = 3"],
      ans: 0,
      exp: "y = mx + c with c = 0 gives y = 3x."
    },
    {
      q: "The distance of the point (4, -7) from the Y-axis is:",
      opts: ["4 units", "7 units", "-7 units", "√65 units"],
      ans: 0,
      exp: "Distance from the Y-axis is given by |x| = |4| = 4 units."
    }
  ];

  const handleSelect = (qIdx, optIdx) => {
    sound.playClick();
    setSelected({ ...selected, [qIdx]: optIdx });
  };

  const calculateScore = () => {
    let s = 0;
    questions.forEach((q, i) => {
      if (selected[i] === q.ans) s++;
    });
    setScore(s);
    sound.playSuccess();
  };

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-center">
        <h2>Chapter 12 Mastery Quiz (స్వీయ మూల్యాంకనం)</h2>
        {score !== null && (
          <span className="badge" style={{background:'#10b981',color:'#fff',padding:'0.4rem 0.8rem',fontSize:'1rem'}}>
            Score: {score} / {questions.length}
          </span>
        )}
      </div>

      <div className="space-y-3">
        {questions.map((q, qIdx) => (
          <div key={qIdx} className="result-box space-y-2">
            <div className="text-sm font-bold text-white">{qIdx+1}. {q.q}</div>
            <div className="space-y-1">
              {q.opts.map((opt, oIdx) => {
                let cls = "quiz-opt";
                if (score !== null) {
                  if (oIdx === q.ans) cls += " correct";
                  else if (selected[qIdx] === oIdx) cls += " wrong";
                  cls += " disabled";
                } else if (selected[qIdx] === oIdx) {
                  cls += " border-orange-500 bg-orange-950";
                }
                return (
                  <div key={oIdx} className={cls} onClick={()=>handleSelect(qIdx, oIdx)}>
                    <span style={{fontWeight:800}}>{String.fromCharCode(65+oIdx)}.</span>
                    <span>{opt}</span>
                  </div>
                );
              })}
            </div>
            {score !== null && (
              <div className="text-xs text-yellow-300 mt-1">
                💡 <strong>Explanation:</strong> {q.exp}
              </div>
            )}
          </div>
        ))}
      </div>

      <div className="text-center pt-2">
        {score === null ? (
          <button className="btn btn-orange text-base" onClick={calculateScore}>
            Submit Quiz & Check Score
          </button>
        ) : (
          <button className="btn btn-dark text-base" onClick={()=>{ setSelected({}); setScore(null); }}>
            Retake Quiz
          </button>
        )}
      </div>
    </div>
  );
}

// 7. WHITEBOARD TAB
function WhiteboardTab(){
  const canvasRef = useRef(null);
  const [color, setColor] = useState('#3b82f6');
  const [size, setSize] = useState(5);
  const drawingRef = useRef(false);

  useEffect(()=>{
    const c = canvasRef.current;
    if(!c) return;
    const ctx = c.getContext('2d');
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  },[]);

  const startDraw = (e)=>{ drawingRef.current = true; draw(e); };
  const endDraw = ()=>{ drawingRef.current = false; };
  const draw = (e)=>{
    if(!drawingRef.current) return;
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    const rect = c.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const clear = ()=>{
    sound.playClick();
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  };

  return (
    <div className="card h-full flex flex-col space-y-2 overflow-hidden">
      <div className="flex justify-between items-center flex-wrap gap-2 flex-shrink-0">
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold slate">Color:</span>
          {['#3b82f6','#f97316','#10b981','#eab308','#ffffff','#f87171'].map(c=>(
            <button key={c} onClick={()=>{sound.playClick();setColor(c)}}
              style={{width:24,height:24,borderRadius:'50%',border:color===c?'2px solid #fff':'none',background:c,cursor:'pointer'}}/>
          ))}
          <span className="text-xs font-bold slate ml-2">Size:</span>
          {[3, 6, 12].map(s=>(
            <button key={s} className={`btn btn-sm ${size===s?'btn-blue':'btn-dark'}`} onClick={()=>{sound.playClick();setSize(s)}}>{s}px</button>
          ))}
        </div>
        <button className="btn btn-sm" style={{background:'#dc2626',color:'#fff'}} onClick={clear}>Clear Board</button>
      </div>

      <div className="flex-1 rounded-xl overflow-hidden border border-slate-600 relative" style={{minHeight:0,touchAction:'none'}}>
        <canvas 
          ref={canvasRef} 
          style={{width:'100%',height:'100%',display:'block',cursor:'crosshair'}}
          onMouseDown={startDraw} onMouseUp={endDraw} onMouseMove={draw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchEnd={endDraw} onTouchMove={draw}
        />
      </div>
      <p className="text-xs slate text-center flex-shrink-0">Coordinate Graph Scratchpad • Draw X-Y axes, plot points, and connect linear graphs.</p>
    </div>
  );
}
