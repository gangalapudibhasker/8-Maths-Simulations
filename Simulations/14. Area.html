<style>

<body>
<div id="root" class="viewport-wrapper"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}
const sound = new SoundEngine();

// 1. OVERVIEW & GOOGLE FLOW MIND MAP
function OverviewTab({ onJumpTab }){
  const nodes = [
    { id:'trap', title:'1. Area of a Trapezium', tel:'ట్రెపీజియం (సమలంబ చతుర్భుజం) వైశాల్యం', color:'orange', desc:'Area of a trapezium with parallel sides a and b, and perpendicular height h.', formula:'Area = ½(a + b)h', badge:'2D Mensuration' },
    { id:'rhomb', title:'2. Rhombus & Quadrilaterals', tel:'రాంబస్ & సాధారణ చతుర్భుజ వైశాల్యం', color:'blue', desc:'Area of general quadrilateral: ½d(h₁ + h₂). Area of Rhombus: ½(d₁ × d₂).', formula:'Area = ½ d₁ d₂', badge:'Quadrilaterals' },
    { id:'poly', title:'3. Irregular Polygon Surveying', tel:'క్రమరహిత బహుభుజి క్షేత్ర గణన', color:'emerald', desc:'Dividing irregular plots/fields into triangles and trapeziums along a survey baseline.', formula:'Total = Sum of Triangles + Trapeziums', badge:'Surveying Math' },
    { id:'surface', title:'4. 3D Surface Area (TSA & CSA)', tel:'ఘనపరిమాణాలు & సంపూర్ణతల వైశాల్యం', color:'purple', desc:'Total and lateral/curved surface area for Cuboids: 2(lb+bh+hl), Cubes: 6a², Cylinders: 2πr(r+h).', formula:'TSA = 2(lb + bh + hl)', badge:'3D Surface Area' },
    { id:'volume', title:'5. Volume & Capacity of Solids', tel:'ఘనపరిమాణం & సామర్థ్యం (లీటర్లు)', color:'amber', desc:'Volume of Cuboid: l×b×h, Cube: a³, Cylinder: πr²h. Relation: 1 m³ = 1000 litres, 1000 cm³ = 1 litre.', formula:'Volume = Base Area × Height', badge:'Volume & Capacity' },
    { id:'figout', title:'6. Figure It Out Problems', tel:'పాఠ్యపుస్తక సాధన ప్రశ్నలు', color:'rose', desc:'Complete step-by-step solutions for all NCERT Ganita Prakash Chapter 14 exercises.', formula:'All 14.1 - 14.4 Problems Solved', badge:'SCERT Textbook' }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-start flex-wrap gap-2">
        <div>
          <h2>Chapter 14: Area (వైశాల్యం)</h2>
          <p className="sub">AP SCERT Class 8 Mathematics Semester 2 • Mensuration of 2D Polygons, Trapezium, 3D Surface Area & Volume</p>
        </div>
        <span className="badge" style={{background:'rgba(249,115,22,0.2)',color:'#fb923c',padding:'0.4rem 0.8rem',fontSize:'0.9rem'}}>
          🧠 Interactive Concept Flow Map
        </span>
      </div>

      <div className="flow-container">
        <div className="flow-nodes">
          {/* Central Root Node */}
          <div className="flow-root">
            <span style={{fontSize:'1.6rem',display:'block',marginBottom:'.2rem'}}>📐 📦</span>
            <h3 style={{fontSize:'1.15rem',fontWeight:800,margin:0}}>Area & Mensuration</h3>
            <p style={{fontSize:'0.85rem',color:'#fed7aa',marginTop:'.2rem',marginBottom:'.4rem'}}>వైశాల్యం (Trapezium, Polygons, Surface Area & Volume)</p>
            <span style={{background:'rgba(0,0,0,0.3)',padding:'2px 8px',borderRadius:20,fontSize:'0.75rem',fontWeight:700}}>Grade 8 Ganita Prakash</span>
          </div>

          <div style={{textAlign:'center',color:'#94a3b8',fontSize:'0.85rem'}}>
            ⬇️ <em>Explore major concept branches below (click any card to open interactive simulation)</em> ⬇️
          </div>

          {/* Flow Branches */}
          <div className="flow-branches">
            {nodes.map(n => (
              <div key={n.id} className={`flow-card ${n.color}`} onClick={()=>{ sound.playClick(); onJumpTab(n.id); }}>
                <div className="flex justify-between items-center mb-1">
                  <span className="badge" style={{fontSize:'0.72rem',background:'rgba(255,255,255,0.1)',color:'#fff'}}>{n.badge}</span>
                  <span style={{fontSize:'0.8rem',color:'#38bdf8'}}>👉 Open Tab</span>
                </div>
                <h4 style={{fontSize:'1rem',fontWeight:800,color:'#fff',margin:'0.2rem 0'}}>{n.title}</h4>
                <div style={{fontSize:'0.82rem',color:'#cbd5e1',marginBottom:'.4rem'}}>{n.tel}</div>
                <p style={{fontSize:'0.82rem',color:'#94a3b8',lineHeight:1.35,marginBottom:'.5rem'}}>{n.desc}</p>
                <div className="result-box font-mono" style={{padding:'0.35rem 0.6rem',fontSize:'0.82rem',color:'#fef08a'}}>
                  {n.formula}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="tip-green">
        💡 <strong>Core Mensuration Insight:</strong> Area of any prism or cylinder = <code>Base Area × Height</code>. Volume measures the 3D space occupied, while Surface Area measures the total 2D boundary wrapper!
      </div>
    </div>
  );
}

// 2. AREA OF TRAPEZIUM INTERACTIVE TAB
function TrapeziumTab(){
  const [sideA, setSideA] = useState(8); // top side
  const [sideB, setSideB] = useState(14); // bottom side
  const [heightH, setHeightH] = useState(6); // height

  const area = 0.5 * (sideA + sideB) * heightH;

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Area of a Trapezium (ట్రెపీజియం వైశాల్యం: ½(a + b)h)</h2>
      <p className="sub">Adjust the top parallel side a, bottom parallel side b, and perpendicular height h to see the live area calculation.</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        {/* SVG Drawing of Trapezium */}
        <div className="result-box flex justify-center items-center p-2" style={{minHeight:260,background:'#070b14'}}>
          <svg width="260" height="220" viewBox="0 0 260 220">
            {/* Trapezium Coordinates */}
            {/* Bottom side: from (30, 180) to (30 + sideB*12, 180) */}
            {/* Top side: from (60, 180 - heightH*20) to (60 + sideA*12, 180 - heightH*20) */}
            <polygon 
              points={`30,180 ${30 + sideB*13},180 ${50 + sideA*13},${180 - heightH*18} 50,${180 - heightH*18}`} 
              fill="rgba(249,115,22,0.3)" 
              stroke="#f97316" 
              strokeWidth="2.5" 
            />

            {/* Height dashed line */}
            <line x1="50" y1="180" x2="50" y2={180 - heightH*18} stroke="#38bdf8" strokeWidth="2" strokeDasharray="3 3" />
            <rect x="50" y={180 - 12} width="12" height="12" fill="none" stroke="#fff" strokeWidth="1" />
            <text x="35" y={180 - (heightH*9)} fill="#38bdf8" fontSize="11" fontWeight="bold">h = {heightH}</text>

            {/* Top side label */}
            <text x={50 + (sideA*6.5)} y={180 - heightH*18 - 8} fill="#fdba74" fontSize="12" fontWeight="bold" textAnchor="middle">a = {sideA} cm</text>

            {/* Bottom side label */}
            <text x={30 + (sideB*6.5)} y="200" fill="#fdba74" fontSize="12" fontWeight="bold" textAnchor="middle">b = {sideB} cm</text>
          </svg>
        </div>

        {/* Sliders & Math */}
        <div className="space-y-3">
          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Top Parallel Side (a):</label>
              <span className="font-bold orange font-mono">{sideA} cm</span>
            </div>
            <input type="range" min="4" max="12" value={sideA} className="slider" onChange={e=>{ sound.playClick(); setSideA(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Bottom Parallel Side (b):</label>
              <span className="font-bold orange font-mono">{sideB} cm</span>
            </div>
            <input type="range" min="8" max="18" value={sideB} className="slider" onChange={e=>{ sound.playClick(); setSideB(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Perpendicular Height (h):</label>
              <span className="font-bold blue font-mono">{heightH} cm</span>
            </div>
            <input type="range" min="3" max="9" value={heightH} className="slider" onChange={e=>{ sound.playClick(); setHeightH(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-1 font-mono text-sm">
            <div>Formula: Area = ½ × (a + b) × h</div>
            <div>Area = ½ × ({sideA} + {sideB}) × {heightH} = ½ × ({sideA + sideB}) × {heightH}</div>
            <div className="text-xl font-black green mt-1">
              Area = {area.toFixed(1)} cm² (sq. cm)
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// 3. RHOMBUS & GENERAL QUADRILATERAL TAB
function RhombusTab(){
  const [d1, setD1] = useState(12);
  const [d2, setD2] = useState(8);

  const rhombusArea = 0.5 * d1 * d2;

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Area of a Rhombus (రాంబస్ వైశాల్యం: ½ d₁ d₂)</h2>
      <p className="sub">The diagonals of a rhombus bisect each other at right angles (90°), creating 4 right triangles.</p>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
        <div className="result-box flex justify-center items-center p-2" style={{minHeight:240,background:'#070b14'}}>
          <svg width="240" height="220" viewBox="0 0 240 220">
            {/* Rhombus with center (120, 110) */}
            <polygon 
              points={`120,${110 - d2*9} ${120 + d1*8},110 120,${110 + d2*9} ${120 - d1*8},110`} 
              fill="rgba(59,130,246,0.3)" 
              stroke="#3b82f6" 
              strokeWidth="2.5" 
            />

            {/* Horizontal Diagonal d1 */}
            <line x1={120 - d1*8} y1="110" x2={120 + d1*8} y2="110" stroke="#f97316" strokeWidth="2" strokeDasharray="3 3" />
            <text x="120" y="100" fill="#fdba74" fontSize="11" fontWeight="bold" textAnchor="middle">d₁ = {d1} cm</text>

            {/* Vertical Diagonal d2 */}
            <line x1="120" y1={110 - d2*9} x2="120" y2={110 + d2*9} stroke="#10b981" strokeWidth="2" strokeDasharray="3 3" />
            <text x="135" y={110 + d2*5} fill="#6ee7b7" fontSize="11" fontWeight="bold">d₂ = {d2} cm</text>
          </svg>
        </div>

        <div className="space-y-3">
          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Diagonal 1 (కర్ణం d₁):</label>
              <span className="font-bold orange font-mono">{d1} cm</span>
            </div>
            <input type="range" min="6" max="18" value={d1} className="slider" onChange={e=>{ sound.playClick(); setD1(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-2">
            <div className="flex justify-between items-center">
              <label>Diagonal 2 (కర్ణం d₂):</label>
              <span className="font-bold green font-mono">{d2} cm</span>
            </div>
            <input type="range" min="4" max="14" value={d2} className="slider" onChange={e=>{ sound.playClick(); setD2(Number(e.target.value)); }} />
          </div>

          <div className="result-box space-y-1 font-mono text-sm">
            <div>Rhombus Area Formula = ½ × d₁ × d₂</div>
            <div>Area = ½ × {d1} × {d2}</div>
            <div className="text-xl font-black green mt-1">
              Area = {rhombusArea.toFixed(1)} cm²
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// 4. 3D SOLIDS: SURFACE AREA & VOLUME SIMULATOR
function Solids3DTab(){
  const [solidType, setSolidType] = useState('cuboid');
  // Dimensions
  const [l, setL] = useState(8);
  const [b, setB] = useState(5);
  const [h, setH] = useState(4);
  const [r, setR] = useState(7);
  const [hc, setHc] = useState(10);

  // Cuboid metrics
  const cuboidTSA = 2 * (l * b + b * h + h * l);
  const cuboidLSA = 2 * h * (l + b);
  const cuboidVol = l * b * h;

  // Cylinder metrics (using pi = 22/7)
  const cylCSA = 2 * (22/7) * r * hc;
  const cylTSA = 2 * (22/7) * r * (r + hc);
  const cylVol = (22/7) * r * r * hc;

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>3D Surface Area & Volume Lab (ఘనపరిమాణాలు & వైశాల్యాలు)</h2>
      <p className="sub">Switch between a Cuboid and a Right Circular Cylinder to explore Lateral/Curved Surface Area, Total Surface Area, and Volume.</p>

      <div className="flex gap-2">
        <button className={`btn btn-sm ${solidType==='cuboid'?'btn-orange':'btn-dark'}`} onClick={()=>{ sound.playClick(); setSolidType('cuboid'); }}>
          📦 Cuboid (దీర్ఘఘనం)
        </button>
        <button className={`btn btn-sm ${solidType==='cylinder'?'btn-orange':'btn-dark'}`} onClick={()=>{ sound.playClick(); setSolidType('cylinder'); }}>
          🛢️ Cylinder (స్థూపం)
        </button>
      </div>

      {solidType === 'cuboid' ? (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
          <div className="space-y-2">
            <div className="result-box">
              <label>Length l (పొడవు cm): {l}</label>
              <input type="range" min="3" max="15" value={l} className="slider" onChange={e=>setL(Number(e.target.value))} />
            </div>
            <div className="result-box">
              <label>Breadth b (వెడల్పు cm): {b}</label>
              <input type="range" min="2" max="10" value={b} className="slider" onChange={e=>setB(Number(e.target.value))} />
            </div>
            <div className="result-box">
              <label>Height h (ఎత్తు cm): {h}</label>
              <input type="range" min="2" max="10" value={h} className="slider" onChange={e=>setH(Number(e.target.value))} />
            </div>
          </div>

          <div className="result-box space-y-2 font-mono text-sm">
            <div className="text-sm font-bold text-yellow-400">Cuboid Formulas & Results:</div>
            <div>1. Lateral Surface Area (LSA) = 2h(l + b) = <strong>{cuboidLSA} cm²</strong></div>
            <div>2. Total Surface Area (TSA) = 2(lb + bh + hl) = <strong className="orange text-base">{cuboidTSA} cm²</strong></div>
            <div>3. Volume (ఘనపరిమాణం) = l × b × h = <strong className="green text-lg font-black">{cuboidVol} cm³</strong></div>
            <div className="text-xs slate mt-1">Capacity: {cuboidVol} cm³ = {(cuboidVol / 1000).toFixed(3)} litres!</div>
          </div>
        </div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
          <div className="space-y-2">
            <div className="result-box">
              <label>Radius r (వ్యాసార్థం cm): {r}</label>
              <input type="range" min="2" max="14" step="1" value={r} className="slider" onChange={e=>setR(Number(e.target.value))} />
            </div>
            <div className="result-box">
              <label>Height h (ఎత్తు cm): {hc}</label>
              <input type="range" min="4" max="20" step="1" value={hc} className="slider" onChange={e=>setHc(Number(e.target.value))} />
            </div>
          </div>

          <div className="result-box space-y-2 font-mono text-sm">
            <div className="text-sm font-bold text-yellow-400">Cylinder (π ≈ 22/7) Results:</div>
            <div>1. Curved Surface Area (CSA) = 2πrh = <strong>{cylCSA.toFixed(1)} cm²</strong></div>
            <div>2. Total Surface Area (TSA) = 2πr(r + h) = <strong className="orange text-base">{cylTSA.toFixed(1)} cm²</strong></div>
            <div>3. Volume (ఘనపరిమాణం) = πr²h = <strong className="green text-lg font-black">{cylVol.toFixed(1)} cm³</strong></div>
            <div className="text-xs slate mt-1">Water Capacity: {(cylVol / 1000).toFixed(2)} litres!</div>
          </div>
        </div>
      )}
    </div>
  );
}

// 5. FIGURE IT OUT STEP-BY-STEP PROBLEMS
function FigOutTab(){
  const [activeProb, setActiveProb] = useState(0);

  const problems = [
    {
      q: "Q1. The parallel sides of a trapezium are 10 cm and 20 cm, and its non-parallel sides are both equal to 13 cm. Find its area.",
      tel: "ప్రశ్న 1: ఒక సమలంబ చతుర్భుజం (ట్రెపీజియం) సమాంతర భుజాలు 10 సెం.మీ, 20 సెం.మీ మరియు సమాంతరం కాని భుజాలు 13 సెం.మీ కలవు. దాని వైశాల్యం కనుగొనండి.",
      steps: [
        "Difference between parallel sides = 20 - 10 = 10 cm.",
        "Since it is an isosceles trapezium, the bottom base splits into: 5 cm + 10 cm + 5 cm.",
        "Height h = √(13² - 5²) = √(169 - 25) = √144 = 12 cm.",
        "Area of Trapezium = ½ × (a + b) × h = ½ × (10 + 20) × 12 = ½ × 30 × 12 = 180 cm²"
      ],
      ans: "Area = 180 cm²"
    },
    {
      q: "Q2. The diagonals of a rhombus are 7.5 cm and 12 cm. Find its area.",
      tel: "ప్రశ్న 2: ఒక రాంబస్ కర్ణాలు 7.5 సెం.మీ మరియు 12 సెం.మీ అయిన దాని వైశాల్యం కనుగొనండి.",
      steps: [
        "d₁ = 7.5 cm, d₂ = 12 cm",
        "Area of Rhombus = ½ × d₁ × d₂",
        "= ½ × 7.5 × 12 = 7.5 × 6 = 45 cm²"
      ],
      ans: "Area = 45 cm²"
    },
    {
      q: "Q3. A cylindrical tank has a radius of 1.4 m and depth of 7 m. How many litres of water can it hold?",
      tel: "ప్రశ్న 3: 1.4 మీ వ్యాసార్థం మరియు 7 మీ లోతు గల స్థూపాకార తొట్టె ఎన్ని లీటర్ల నీటిని నింపగలదు?",
      steps: [
        "Radius r = 1.4 m, Height h = 7 m",
        "Volume of Cylinder = πr²h = (22/7) × (1.4)² × 7 = 22 × 1.96 = 43.12 m³",
        "Since 1 m³ = 1,000 litres:",
        "Capacity = 43.12 × 1,000 = 43,120 litres"
      ],
      ans: "Capacity = 43,120 litres"
    }
  ];

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <h2>Figure It Out Textbook Solutions (సాధించిన సమస్యలు)</h2>
      <p className="sub">Step-by-step verified solutions for NCERT Ganita Prakash Chapter 14 problems.</p>

      <div className="flex gap-2 mb-2">
        {problems.map((p, idx) => (
          <button 
            key={idx} 
            className={`btn btn-sm ${activeProb===idx ? 'btn-orange' : 'btn-dark'}`}
            onClick={()=>{ sound.playClick(); setActiveProb(idx); }}
          >
            Problem {idx+1}
          </button>
        ))}
      </div>

      <div className="result-box space-y-2">
        <h3 className="text-base font-bold orange">{problems[activeProb].q}</h3>
        <p className="text-sm slate">{problems[activeProb].tel}</p>

        <div className="mt-3 p-3 bg-slate-900 rounded-lg space-y-2 border border-slate-700">
          <div className="text-xs font-bold text-yellow-400">Step-by-Step Solution:</div>
          {problems[activeProb].steps.map((st, i) => (
            <div key={i} className="text-sm text-slate-200 pl-3 border-l-2 border-orange-500">
              {st}
            </div>
          ))}
          <div className="mt-2 pt-2 border-t border-slate-700 font-bold green text-base">
            ✅ Solution: {problems[activeProb].ans}
          </div>
        </div>
      </div>
    </div>
  );
}

// 6. QUIZ TAB
function QuizTab(){
  const [selected, setSelected] = useState({});
  const [score, setScore] = useState(null);

  const questions = [
    {
      q: "What is the area formula for a trapezium with parallel sides a and b and height h?",
      opts: ["(a + b)h", "½(a + b)h", "½(a - b)h", "ab + h"],
      ans: 1,
      exp: "Area of a trapezium is ½(a + b)h."
    },
    {
      q: "If the diagonals of a rhombus are 10 cm and 16 cm, its area is:",
      opts: ["80 cm²", "160 cm²", "40 cm²", "130 cm²"],
      ans: 0,
      exp: "½ × 10 × 16 = 80 cm²."
    },
    {
      q: "What is the total surface area of a cube of edge 5 cm?",
      opts: ["125 cm²", "150 cm²", "100 cm²", "25 cm²"],
      ans: 1,
      exp: "TSA of cube = 6a² = 6 × 5² = 6 × 25 = 150 cm²."
    },
    {
      q: "How many cubic centimetres (cm³) make 1 litre?",
      opts: ["100 cm³", "1,000 cm³", "10,000 cm³", "10 cm³"],
      ans: 1,
      exp: "1 litre = 1,000 cm³ (and 1 m³ = 1,000 litres)."
    }
  ];

  const handleSelect = (qIdx, optIdx) => {
    sound.playClick();
    setSelected({ ...selected, [qIdx]: optIdx });
  };

  const calculateScore = () => {
    let s = 0;
    questions.forEach((q, i) => {
      if (selected[i] === q.ans) s++;
    });
    setScore(s);
    sound.playSuccess();
  };

  return (
    <div className="card h-full overflow-y-auto space-y-3">
      <div className="flex justify-between items-center">
        <h2>Chapter 14 Mastery Quiz (స్వీయ మూల్యాంకనం)</h2>
        {score !== null && (
          <span className="badge" style={{background:'#10b981',color:'#fff',padding:'0.4rem 0.8rem',fontSize:'1rem'}}>
            Score: {score} / {questions.length}
          </span>
        )}
      </div>

      <div className="space-y-3">
        {questions.map((q, qIdx) => (
          <div key={qIdx} className="result-box space-y-2">
            <div className="text-sm font-bold text-white">{qIdx+1}. {q.q}</div>
            <div className="space-y-1">
              {q.opts.map((opt, oIdx) => {
                let cls = "quiz-opt";
                if (score !== null) {
                  if (oIdx === q.ans) cls += " correct";
                  else if (selected[qIdx] === oIdx) cls += " wrong";
                  cls += " disabled";
                } else if (selected[qIdx] === oIdx) {
                  cls += " border-orange-500 bg-orange-950";
                }
                return (
                  <div key={oIdx} className={cls} onClick={()=>handleSelect(qIdx, oIdx)}>
                    <span style={{fontWeight:800}}>{String.fromCharCode(65+oIdx)}.</span>
                    <span>{opt}</span>
                  </div>
                );
              })}
            </div>
            {score !== null && (
              <div className="text-xs text-yellow-300 mt-1">
                💡 <strong>Explanation:</strong> {q.exp}
              </div>
            )}
          </div>
        ))}
      </div>

      <div className="text-center pt-2">
        {score === null ? (
          <button className="btn btn-orange text-base" onClick={calculateScore}>
            Submit Quiz & Check Score
          </button>
        ) : (
          <button className="btn btn-dark text-base" onClick={()=>{ setSelected({}); setScore(null); }}>
            Retake Quiz
          </button>
        )}
      </div>
    </div>
  );
}

// 7. WHITEBOARD TAB
function WhiteboardTab(){
  const canvasRef = useRef(null);
  const [color, setColor] = useState('#f97316');
  const [size, setSize] = useState(5);
  const drawingRef = useRef(false);

  useEffect(()=>{
    const c = canvasRef.current;
    if(!c) return;
    const ctx = c.getContext('2d');
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  },[]);

  const startDraw = (e)=>{ drawingRef.current = true; draw(e); };
  const endDraw = ()=>{ drawingRef.current = false; };
  const draw = (e)=>{
    if(!drawingRef.current) return;
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    const rect = c.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const clear = ()=>{
    sound.playClick();
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0,0,c.width,c.height);
  };

  return (
    <div className="card h-full flex flex-col space-y-2 overflow-hidden">
      <div className="flex justify-between items-center flex-wrap gap-2 flex-shrink-0">
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold slate">Color:</span>
          {['#f97316','#38bdf8','#10b981','#eab308','#ffffff','#f87171'].map(c=>(
            <button key={c} onClick={()=>{sound.playClick();setColor(c)}}
              style={{width:24,height:24,borderRadius:'50%',border:color===c?'2px solid #fff':'none',background:c,cursor:'pointer'}}/>
          ))}
          <span className="text-xs font-bold slate ml-2">Size:</span>
          {[3, 6, 12].map(s=>(
            <button key={s} className={`btn btn-sm ${size===s?'btn-orange':'btn-dark'}`} onClick={()=>{sound.playClick();setSize(s)}}>{s}px</button>
          ))}
        </div>
        <button className="btn btn-sm" style={{background:'#dc2626',color:'#fff'}} onClick={clear}>Clear Board</button>
      </div>

      <div className="flex-1 rounded-xl overflow-hidden border border-slate-600 relative" style={{minHeight:0,touchAction:'none'}}>
        <canvas 
          ref={canvasRef} 
          style={{width:'100%',height:'100%',display:'block',cursor:'crosshair'}}
          onMouseDown={startDraw} onMouseUp={endDraw} onMouseMove={draw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchEnd={endDraw} onTouchMove={draw}
        />
      </div>
      <p className="text-xs slate text-center flex-shrink-0">Mensuration Scratchpad • Sketch trapeziums, 3D cuboids, and cylinder nets.</p>
    </div>
  );
}
