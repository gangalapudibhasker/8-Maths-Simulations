.simulation-container{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;position:relative;box-shadow:0 25px 50px -12px rgba(0,0,0,.8);display:flex;flex-direction:column;overflow:hidden;background:#0f172a;border-radius:10px;border:1px solid rgba(255,255,255,.12)}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes popIn{0%{transform:scale(.94);opacity:.6}100%{transform:scale(1);opacity:1}}
.animate-fade-in{animation:fadeIn .25s ease-out}
.cue-success{animation:pulseGlow 1.2s ease-out 2}
.cue-error{animation:pulseError 1s ease-out 2,shake .35s ease-out}

.fig-valid{box-shadow:0 0 0 2px rgba(16,185,129,.5),0 0 18px rgba(16,185,129,.12)}
.fig-invalid{box-shadow:0 0 0 2px rgba(239,68,68,.4),0 0 14px rgba(239,68,68,.1)}

.tab-btn{display:flex;align-items:center;gap:.35rem;padding:.4rem .65rem;border-radius:.5rem;font-size:.76rem;font-weight:650;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.tab-active{background:linear-gradient(135deg,#ea580c,#f59e0b);color:#fff;box-shadow:0 3px 10px rgba(234,88,12,.4)}
.tab-idle{background:rgba(30,41,59,.65);color:#cbd5e1}.tab-idle:hover{background:#334155;color:#fff}
.input-dark{background:#0f172a;border:1.5px solid #475569;color:#fff;border-radius:.5rem;padding:.4rem .6rem;font-size:.9rem;outline:none;width:100%}

.flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:.25rem}.gap-1\.5{gap:.35rem}.gap-2{gap:.5rem}.gap-3{gap:.65rem}.gap-4{gap:.85rem}

.py-1{padding-top:.2rem;padding-bottom:.2rem}.py-1\.5{padding-top:.35rem;padding-bottom:.35rem}.py-2{padding-top:.45rem;padding-bottom:.45rem}.py-2\.5{padding-top:.55rem;padding-bottom:.55rem}.py-3{padding-top:.65rem;padding-bottom:.65rem}.py-3\.5{padding-top:.7rem;padding-bottom:.7rem}
.mb-0\.5{margin-bottom:.15rem}.mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.65rem}.mb-4{margin-bottom:.85rem}.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.65rem}.mt-4{margin-top:.85rem}
.rounded-lg{border-radius:.45rem}.rounded-xl{border-radius:.65rem}.rounded-2xl{border-radius:.85rem}.rounded-3xl{border-radius:1.15rem}
.text-xs{font-size:.8rem;line-height:1.15rem}.text-sm{font-size:.92rem;line-height:1.35rem}.text-base{font-size:1.05rem}.text-lg{font-size:1.2rem}.text-xl{font-size:1.35rem}.text-2xl{font-size:1.6rem}.text-4xl{font-size:2.25rem}
.font-bold{font-weight:700}.font-black{font-weight:900}.font-semibold{font-weight:600}.font-mono{font-family:ui-monospace,Menlo,Consolas,monospace}

.text-slate-200{color:#e2e8f0}.text-slate-300{color:#cbd5e1}.text-slate-400{color:#94a3b8}.text-white{color:#fff}
.text-emerald-400{color:#34d399}.text-red-400{color:#f87171}.text-cyan-400{color:#22d3ee}.text-blue-400{color:#60a5fa}
.bg-slate-800{background:#1e293b}.bg-slate-900{background:#0f172a}
.w-full{width:100%}.h-full{height:100%}.w-6{width:1.5rem}.h-6{height:1.5rem}.w-7{width:1.75rem}.h-7{height:1.75rem}
.flex-1{flex:1 1 0%}.flex-shrink-0{flex-shrink:0}.relative{position:relative}.overflow-hidden{overflow:hidden}.overflow-y-auto{overflow-y:auto}
.cursor-pointer{cursor:pointer}.transition{transition:all .15s}.space-y-1>:not([hidden])~:not([hidden]){margin-top:.25rem}.space-y-2>:not([hidden])~:not([hidden]){margin-top:.5rem}.space-y-2\.5>:not([hidden])~:not([hidden]){margin-top:.55rem}.space-y-3>:not([hidden])~:not([hidden]){margin-top:.65rem}.space-y-4>:not([hidden])~:not([hidden]){margin-top:.85rem}
.border{border-width:1px}.border-2{border-width:2px}.border-emerald-500{border-color:#10b981}.border-red-500{border-color:#ef4444}
.max-w-md{max-width:28rem}.max-w-xl{max-width:36rem}.pl-3{padding-left:.65rem}.pl-6{padding-left:1.25rem}

<body>
<div class="viewport-wrapper"><div id="root" class="simulation-container">
  <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:1.1rem;flex-direction:column;gap:12px;padding:24px;text-align:center">
    <div>Loading simulation…</div>
    <div style="font-size:0.85rem;color:#64748b">If this stays blank, allow scripts / check internet for React CDN.</div>
  </div>
</div></div>
<script type="text/babel" data-presets="react">
const {useState,useMemo,useEffect,useRef} = React;

/* ===== Sound ===== */
class SoundEngine{
  constructor(){this.ctx=null}
  ensure(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)()}
  tone(f,d,t,v=0.08){try{this.ensure();const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(this.ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+d);o.stop(this.ctx.currentTime+d)}catch(e){}}
  playClick(){this.tone(600,0.06,'square',0.06)}
  playTick(){this.tone(800,0.03,'sine',0.04)}
  playSuccess(){this.tone(523,0.1,'sine',0.08);setTimeout(()=>this.tone(659,0.12,'sine',0.08),80)}
  playError(){this.tone(200,0.15,'sawtooth',0.06)}
}
const sound=new SoundEngine();

const polyPoints=pts=>pts.map(p=>p.join(',')).join(' ');

/* ===== Interactive figures (scale to fill canvas) ===== */
function InteractiveRectangle({angleDeg=60,size=340}){
  const a=angleDeg*Math.PI/180, ox=size/2, oy=size/2, half=size*0.41;
  const A=[ox-half,oy], C=[ox+half,oy];
  const Bx=ox+half*Math.cos(a), By=oy-half*Math.sin(a);
  const Dx=ox-half*Math.cos(a), Dy=oy+half*Math.sin(a);
  const ordered=[A,[Bx,By],C,[Dx,Dy]];
  const fs=Math.max(13,size*0.045);
  return(
    <svg width={size} height={size} className="shape">
      <polygon points={polyPoints(ordered)} fill="rgba(249,115,22,.22)" stroke="#f97316" strokeWidth="3"/>
      <line x1={A[0]} y1={A[1]} x2={C[0]} y2={C[1]} stroke="#34d399" strokeWidth="2.4"/>
      <line x1={Bx} y1={By} x2={Dx} y2={Dy} stroke="#60a5fa" strokeWidth="2.4"/>
      <circle cx={ox} cy={oy} r="14" fill="none" stroke="#fbbf24" strokeWidth="2" opacity="0.5">
        <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx={ox} cy={oy} r="6" fill="#fbbf24" stroke="#0f172a" strokeWidth="1.5"/>
      <text x={A[0]-14} y={A[1]+5} fill="#e2e8f0" fontSize={fs} fontWeight="700">A</text>
      <text x={Bx+8} y={By+5} fill="#e2e8f0" fontSize={fs} fontWeight="700">B</text>
      <text x={C[0]+6} y={C[1]+5} fill="#e2e8f0" fontSize={fs} fontWeight="700">C</text>
      <text x={Dx-16} y={Dy+5} fill="#e2e8f0" fontSize={fs} fontWeight="700">D</text>
      <text x={ox+8} y={oy-10} fill="#fbbf24" fontSize={fs} fontWeight="700">O</text>
    </svg>
  );
}

function InteractiveParallelogram({d1=100,d2=75,angleDeg=55,size=340}){
  const a=angleDeg*Math.PI/180, ox=size/2, oy=size/2;
  const scale=(size*0.78)/Math.max(d1,d2,1);
  const h1=(d1/2)*scale, h2=(d2/2)*scale;
  const A=[ox-h1,oy], C=[ox+h1,oy];
  const B=[ox+h2*Math.cos(a),oy-h2*Math.sin(a)];
  const D=[ox-h2*Math.cos(a),oy+h2*Math.sin(a)];
  const fs=Math.max(13,size*0.045);
  return(
    <svg width={size} height={size} className="shape">
      <polygon points={polyPoints([A,B,C,D])} fill="rgba(249,115,22,.22)" stroke="#f97316" strokeWidth="3"/>
      <line x1={A[0]} y1={A[1]} x2={C[0]} y2={C[1]} stroke="#34d399" strokeWidth="2.2"/>
      <line x1={B[0]} y1={B[1]} x2={D[0]} y2={D[1]} stroke="#60a5fa" strokeWidth="2.2"/>
      <circle cx={ox} cy={oy} r="6" fill="#fbbf24" stroke="#0f172a" strokeWidth="1.5"/>
      <text x={A[0]-14} y={A[1]+5} fill="#e2e8f0" fontSize={fs} fontWeight="700">A</text>
      <text x={B[0]+8} y={B[1]+4} fill="#e2e8f0" fontSize={fs} fontWeight="700">B</text>
      <text x={C[0]+6} y={C[1]+5} fill="#e2e8f0" fontSize={fs} fontWeight="700">C</text>
      <text x={D[0]-16} y={D[1]+5} fill="#e2e8f0" fontSize={fs} fontWeight="700">D</text>
    </svg>
  );
}

function InteractiveRhombus({d1=140,d2=95,size=340}){
  const ox=size/2, oy=size/2;
  const scale=(size*0.8)/Math.max(d1,d2,1);
  const h1=(d1/2)*scale, h2=(d2/2)*scale;
  const A=[ox,oy-h2], C=[ox,oy+h2], B=[ox+h1,oy], D=[ox-h1,oy];
  const fs=Math.max(13,size*0.045);
  return(
    <svg width={size} height={size} className="shape">
      <polygon points={polyPoints([A,B,C,D])} fill="rgba(249,115,22,.22)" stroke="#f97316" strokeWidth="3"/>
      <line x1={D[0]} y1={D[1]} x2={B[0]} y2={B[1]} stroke="#34d399" strokeWidth="2.4"/>
      <line x1={A[0]} y1={A[1]} x2={C[0]} y2={C[1]} stroke="#60a5fa" strokeWidth="2.4"/>
      <circle cx={ox} cy={oy} r="6" fill="#fbbf24" stroke="#0f172a" strokeWidth="1.5"/>
      <path d={`M ${ox+10} ${oy} L ${ox+10} ${oy-10} L ${ox} ${oy-10}`} fill="none" stroke="#fbbf24" strokeWidth="1.8"/>
      <text x={A[0]-5} y={A[1]-8} fill="#e2e8f0" fontSize={fs} fontWeight="700">A</text>
      <text x={B[0]+8} y={B[1]+5} fill="#e2e8f0" fontSize={fs} fontWeight="700">B</text>
      <text x={C[0]-5} y={C[1]+18} fill="#e2e8f0" fontSize={fs} fontWeight="700">C</text>
      <text x={D[0]-16} y={D[1]+5} fill="#e2e8f0" fontSize={fs} fontWeight="700">D</text>
    </svg>
  );
}

function InteractiveKite({top=75,bottom=110,width=95,size=340}){
  const ox=size/2, oy=size/2;
  const scale=(size*0.78)/Math.max(top+bottom,width*2,1);
  const t=top*scale,b=bottom*scale,w=width*scale;
  const A=[ox,oy-t], C=[ox,oy+b], B=[ox+w,oy], D=[ox-w,oy];
  const fs=Math.max(13,size*0.045);
  return(
    <svg width={size} height={size} className="shape">
      <polygon points={polyPoints([A,B,C,D])} fill="rgba(249,115,22,.22)" stroke="#f97316" strokeWidth="3"/>
      <line x1={A[0]} y1={A[1]} x2={C[0]} y2={C[1]} stroke="#34d399" strokeWidth="2.4"/>
      <line x1={D[0]} y1={D[1]} x2={B[0]} y2={B[1]} stroke="#60a5fa" strokeWidth="2.2" strokeDasharray="5 3"/>
      <circle cx={ox} cy={oy} r="6" fill="#fbbf24" stroke="#0f172a" strokeWidth="1.5"/>
      <text x={A[0]-5} y={A[1]-8} fill="#e2e8f0" fontSize={fs} fontWeight="700">A</text>
      <text x={B[0]+8} y={B[1]+5} fill="#e2e8f0" fontSize={fs} fontWeight="700">B</text>
      <text x={C[0]-5} y={C[1]+18} fill="#e2e8f0" fontSize={fs} fontWeight="700">C</text>
      <text x={D[0]-16} y={D[1]+5} fill="#e2e8f0" fontSize={fs} fontWeight="700">D</text>
    </svg>
  );
}

function InteractiveTrapezium({topW=90,botW=160,iso=true,size=340}){
  const ox=size/2, oy=size/2;
  const scale=(size*0.8)/Math.max(botW,topW,1);
  const tw=topW*scale, bw=botW*scale, h=size*0.45;
  const by=oy+h/2, ty=oy-h/2;
  const tl=iso?ox-tw/2:ox-tw/2-12, tr=iso?ox+tw/2:ox+tw/2+8;
  const bl=ox-bw/2, br=ox+bw/2;
  const fs=Math.max(13,size*0.045);
  return(
    <svg width={size} height={size} className="shape">
      <polygon points={polyPoints([[bl,by],[br,by],[tr,ty],[tl,ty]])} fill="rgba(249,115,22,.22)" stroke="#f97316" strokeWidth="3"/>
      <line x1={tl} y1={ty} x2={tr} y2={ty} stroke="#60a5fa" strokeWidth="3"/>
      <line x1={bl} y1={by} x2={br} y2={by} stroke="#60a5fa" strokeWidth="3"/>
      <text x={bl-12} y={by+18} fill="#e2e8f0" fontSize={fs} fontWeight="700">A</text>
      <text x={br+6} y={by+18} fill="#e2e8f0" fontSize={fs} fontWeight="700">B</text>
      <text x={tr+6} y={ty-6} fill="#e2e8f0" fontSize={fs} fontWeight="700">C</text>
      <text x={tl-14} y={ty-6} fill="#e2e8f0" fontSize={fs} fontWeight="700">D</text>
    </svg>
  );
}

function RectSVG({w=180,h=110,showDiag=true}){
  const ox=28,oy=28;
  return(
    <svg width={w+56} height={h+56} className="shape">
      <polygon points={`${ox},${oy+h} ${ox+w},${oy+h} ${ox+w},${oy} ${ox},${oy}`} fill="rgba(249,115,22,.2)" stroke="#f97316" strokeWidth="3"/>
      {showDiag&&<>
        <line x1={ox} y1={oy+h} x2={ox+w} y2={oy} stroke="#34d399" strokeWidth="2"/>
        <line x1={ox} y1={oy} x2={ox+w} y2={oy+h} stroke="#60a5fa" strokeWidth="2"/>
        <circle cx={ox+w/2} cy={oy+h/2} r="5" fill="#fbbf24"/>
      </>}
      <text x={ox-10} y={oy+h+5} fill="#e2e8f0" fontSize="13" fontWeight="700">A</text>
      <text x={ox+w+5} y={oy+h+5} fill="#e2e8f0" fontSize="13" fontWeight="700">B</text>
      <text x={ox+w+5} y={oy-2} fill="#e2e8f0" fontSize="13" fontWeight="700">C</text>
      <text x={ox-10} y={oy-2} fill="#e2e8f0" fontSize="13" fontWeight="700">D</text>
    </svg>
  );
}

/* ===== TABS ===== */
function IntroTab(){
  return(
    <div className="h-full overflow-y-auto pr-1 space-y-3">
      <div className="glass-panel p-4 rounded-2xl">
        <h2 className="text-2xl font-black text-orange-400 mb-1">Quadrilaterals</h2>
        <p className="text-base text-slate-300 mb-3">Ganita Prakash Grade 8 · Chapter 4 — Explore shapes, diagonals, angles and hierarchy with interactive figures.</p>

        {/* Visual gallery of all six shapes */}
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-3">
          <div className="shape-card text-center" style={{borderColor:'#f9731655'}}>
            <div className="flex justify-center mb-1"><InteractiveRectangle angleDeg={55} size={110}/></div>
            <div className="text-base font-bold" style={{color:'#f97316'}}>Rectangle</div>
            <div className="text-xs text-slate-300 mt-0.5">Four right angles · opposite sides equal · diagonals equal & bisect</div>
          </div>
          <div className="shape-card text-center" style={{borderColor:'#fbbf2455'}}>
            <div className="flex justify-center mb-1"><InteractiveRhombus d1={90} d2={90} size={110}/></div>
            <div className="text-base font-bold" style={{color:'#fbbf24'}}>Square</div>
            <div className="text-xs text-slate-300 mt-0.5">All sides equal · all angles 90° · diagonals equal, ⊥ & bisect</div>
          </div>
          <div className="shape-card text-center" style={{borderColor:'#34d39955'}}>
            <div className="flex justify-center mb-1"><InteractiveParallelogram d1={90} d2={65} angleDeg={50} size={110}/></div>
            <div className="text-base font-bold" style={{color:'#34d399'}}>Parallelogram</div>
            <div className="text-xs text-slate-300 mt-0.5">Opposite sides parallel & equal · diagonals bisect each other</div>
          </div>
          <div className="shape-card text-center" style={{borderColor:'#60a5fa55'}}>
            <div className="flex justify-center mb-1"><InteractiveRhombus d1={100} d2={70} size={110}/></div>
            <div className="text-base font-bold" style={{color:'#60a5fa'}}>Rhombus</div>
            <div className="text-xs text-slate-300 mt-0.5">All sides equal · diagonals perpendicular bisectors</div>

function AngleSumTab(){
  const [a,setA]=useState(90),[b,setB]=useState(90),[c,setC]=useState(90);
  const d=Math.max(20,Math.min(200,360-a-b-c));
  const [showDiag,setShowDiag]=useState(true);
  const [showFree,setShowFree]=useState(false);
  const [dFree,setDFree]=useState(90);
  const useAngles=showFree?[a,b,c,dFree]:[a,b,c,d];
  const useSum=useAngles.reduce((s,x)=>s+x,0);
  const useValid=useSum===360;
  const presets=[
    {name:'Rectangle',vals:[90,90,90]},
    {name:'Parallelogram',vals:[70,110,70]},
    {name:'Trapezium',vals:[80,80,100]},
    {name:'Irregular',vals:[60,100,120]},
  ];
  const pts=useMemo(()=>{
    const ang=useAngles; let x=0,y=0,heading=0; const raw=[[x,y]];
    for(let i=0;i<4;i++){x+=Math.cos(heading);y+=Math.sin(heading);raw.push([x,y]);heading+=Math.PI-(ang[i]*Math.PI/180);}
    const verts=raw.slice(0,4), closePt=raw[4], size=320, pad=40;
    const all=useValid?verts:[...verts,closePt];
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    all.forEach(([px,py])=>{minX=Math.min(minX,px);maxX=Math.max(maxX,px);minY=Math.min(minY,py);maxY=Math.max(maxY,py);});
    const bw=maxX-minX||1,bh=maxY-minY||1,sc=Math.min((size-2*pad)/bw,(size-2*pad)/bh);
    const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
    const map=([px,py])=>[size/2+(px-cx)*sc,size/2+(py-cy)*sc];
    return{verts:verts.map(map),end:map(closePt),start:map(verts[0])};
  },[useAngles.join(','),useValid]);
  const labels=['A','B','C','D'];
  const arcPath=(i,verts)=>{
    const p=verts[i],prev=verts[(i+3)%4],next=verts[(i+1)%4];
    const start=Math.atan2(prev[1]-p[1],prev[0]-p[0]), end=Math.atan2(next[1]-p[1],next[0]-p[0]);
    let diff=end-start; while(diff>Math.PI)diff-=2*Math.PI; while(diff<-Math.PI)diff+=2*Math.PI;
    const r=24,x1=p[0]+r*Math.cos(start),y1=p[1]+r*Math.sin(start),x2=p[0]+r*Math.cos(end),y2=p[1]+r*Math.sin(end);
    return `M ${x1} ${y1} A ${r} ${r} 0 ${Math.abs(diff)>Math.PI?1:0} ${diff>0?1:0} ${x2} ${y2}`;
  };
  const verts=pts.verts;
  return(
    <div className="h-full overflow-y-auto pr-1 space-y-3">
      <div className="glass-panel p-4 rounded-2xl">
        <div className="flex flex-wrap justify-between items-center gap-2 mb-2">
          <div>
            <h3 className="text-lg font-bold text-orange-400">Sum of Interior Angles = 360°</h3>
            <p className="text-sm text-slate-300">A simple quadrilateral closes only when angles add to 360°. ∠D is set automatically.</p>
          </div>
          <div className="flex flex-wrap gap-3 items-center">
            <label className="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
              <input type="checkbox" checked={showDiag} onChange={()=>{setShowDiag(!showDiag);sound.playClick();}} className="accent-orange-500"/> Show diagonal
            </label>
            <label className="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
              <input type="checkbox" checked={showFree} onChange={()=>{setShowFree(!showFree);sound.playClick();}} className="accent-orange-500"/> Free ∠D (demo gap)
            </label>
          </div>
        </div>
        <div className="flex flex-wrap gap-2 mb-3">
          {presets.map(p=>(
            <button key={p.name} className="btn btn-slate px-3 py-1.5 text-xs"
              onClick={()=>{setA(p.vals[0]);setB(p.vals[1]);setC(p.vals[2]);setShowFree(false);sound.playClick();}}>{p.name}</button>
          ))}
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div className={`fig-stage cue-pop ${useValid?'fig-valid':'fig-invalid'}`} style={{minHeight:340}}>
            <svg width="320" height="320" className="shape">
              {useValid?(
                <polygon points={verts.map(p=>p.join(',')).join(' ')} fill="rgba(249,115,22,.22)" stroke="#f97316" strokeWidth="3"/>
              ):(
                <>
                  <polyline points={[...verts,pts.end].map(p=>p.join(',')).join(' ')} fill="none" stroke="#ef4444" strokeWidth="3"/>
                  <line x1={pts.end[0]} y1={pts.end[1]} x2={pts.start[0]} y2={pts.start[1]} stroke="#fbbf24" strokeWidth="2.5" strokeDasharray="6 4"/>
                  <text x={(pts.end[0]+pts.start[0])/2} y={(pts.end[1]+pts.start[1])/2-8} fill="#fbbf24" fontSize="13" fontWeight="800" textAnchor="middle">GAP — cannot close</text>
                  <circle cx={pts.end[0]} cy={pts.end[1]} r="5" fill="#ef4444"/>
                  <circle cx={pts.start[0]} cy={pts.start[1]} r="5" fill="#34d399"/>
                </>
              )}
              {showDiag&&useValid&&(
                <>
                  <line x1={verts[0][0]} y1={verts[0][1]} x2={verts[2][0]} y2={verts[2][1]} stroke="#34d399" strokeWidth="2.2" strokeDasharray="6 4"/>
                  <text x={(verts[0][0]+verts[2][0])/2+8} y={(verts[0][1]+verts[2][1])/2} fill="#34d399" fontSize="13" fontWeight="700">diagonal</text>
                </>
              )}
              {verts.map((p,i)=>(
                <g key={i}>
                  {useValid&&<path d={arcPath(i,verts)} fill="none" stroke="#fbbf24" strokeWidth="2.2"/>}
                  <circle cx={p[0]} cy={p[1]} r="6" fill="#fbbf24" stroke="#0f172a" strokeWidth="1.5"/>
                  <text x={p[0]+(p[0]<160?-20:12)} y={p[1]+(p[1]<160?-10:18)} fill="#f8fafc" fontSize="15" fontWeight="800">{labels[i]}</text>
                  <text x={p[0]+(p[0]<160?-6:8)} y={p[1]+(p[1]<160?26:-14)} fill="#fbbf24" fontSize="13" fontWeight="700">{useAngles[i]}°</text>
                </g>
              ))}
            </svg>
          </div>
          <div className="space-y-2">
            {[
              {lab:'A',val:a,set:setA,free:true},
              {lab:'B',val:b,set:setB,free:true},
              {lab:'C',val:c,set:setC,free:true},
              {lab:'D',val:showFree?dFree:d,set:showFree?setDFree:null,free:showFree},
            ].map(item=>(
              <div key={item.lab}>
                <div className="flex justify-between text-sm mb-0.5">
                  <span className="text-slate-300 font-semibold">∠{item.lab} {!item.free&&<span className="text-emerald-400 text-xs font-bold">(auto)</span>}</span>
                  <span className="text-orange-400 font-black">{item.val}°</span>
                </div>
                <input type="range" min="30" max="150" value={item.val} disabled={!item.free}
                  onChange={e=>item.set&&item.set(+e.target.value)} className="accent-orange-500" style={{opacity:item.free?1:0.55}}/>
              </div>
            ))}
            <div className={`grid grid-cols-2 gap-2 mt-1 ${useValid?'cue-success':'cue-error'}`}>
              <div className="metric"><div className="metric-val" style={{color:useValid?'#34d399':'#f87171'}}>{useSum}°</div><div className="metric-lbl">Sum</div></div>
              <div className="metric"><div className="metric-val" style={{color:useValid?'#34d399':'#f87171'}}>{useValid?'✓':'✗'}</div><div className="metric-lbl">{useValid?'Closed':'Open gap'}</div></div>
            </div>
            <div className={`badge-live ${useValid?'badge-ok':'badge-bad'} cue-pop`}>
              {useValid?'✓ Sum = 360° — sides meet; closed quadrilateral':`✗ Sum = ${useSum}° — sides do not meet (gap of ${Math.abs(360-useSum)}°)`}
            </div>
            <div className="p-3 rounded-xl text-sm" style={{background:useValid?'rgba(16,185,129,.12)':'rgba(239,68,68,.12)',border:`1.5px solid ${useValid?'#10b981':'#ef4444'}`,color:useValid?'#6ee7b7':'#fca5a5'}}>
              {useValid?'A simple quadrilateral always has interior angle sum 360°. Diagonal AC splits it into two triangles (180° + 180°).':'If the angles do not add to 360°, the fourth side cannot join the start — you get an open path, not a quadrilateral.'}
            </div>
            <div className="text-sm text-slate-300 leading-snug">
              <strong className="text-amber-300">Proof idea:</strong> Draw diagonal AC. Angles in △ABC = 180°, angles in △ADC = 180° → total for ABCD = 360°.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function VennTab(){
  const relations=[
    {q:'Every square is a rectangle',a:true,why:'All angles 90° and opposite sides equal.'},
    {q:'Every rectangle is a square',a:false,why:'Sides of a rectangle need not all be equal.'},
    {q:'Every rhombus is a parallelogram',a:true,why:'All sides equal ⇒ opposite sides parallel.'},
    {q:'Every kite is a rhombus',a:false,why:'Kite sides are not necessarily all equal.'},
    {q:'Every square is a rhombus',a:true,why:'All sides equal.'},
    {q:'Every parallelogram is a rectangle',a:false,why:'Angles need not be 90°.'},
    {q:'Isosceles trapeziums are parallelograms',a:false,why:'Only one pair of parallel sides.'},
  ];
  const [ans,setAns]=useState({});
  return(
    <div className="h-full overflow-y-auto pr-1 space-y-3">
      <div className="glass-panel p-4 rounded-2xl">

          <InteractiveRectangle angleDeg={50} size={120}/>
          <InteractiveKite top={30} bottom={45} width={35} size={120}/>
          <InteractiveTrapezium topW={35} botW={60} size={120}/>
        </div>
        <div className="p-3 rounded-xl text-sm text-slate-300 font-mono leading-relaxed mb-3" style={{background:'#0f172a',border:'1px solid #334155'}}>
          <div>Quadrilaterals</div>
          <div className="pl-3">└─ Parallelograms</div>
          <div className="pl-6">├─ Rectangles ── Squares</div>
          <div className="pl-6">└─ Rhombuses ── Squares</div>
          <div className="pl-3">└─ Kites ⊃ some rhombuses</div>
          <div className="pl-3">└─ Trapeziums (one pair ∥)</div>
        </div>
        <h4 className="text-sm font-bold text-amber-400 mb-2">True or False</h4>
        <div className="space-y-2">
          {relations.map((r,i)=>{

            return(
              <div key={i} className={`shape-card ${chosen!==undefined?(ok?'border-emerald-500 cue-success':'border-red-500 cue-error'):''}`}>
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <span className="text-sm text-slate-200">{r.q}</span>
                  <div className="flex gap-2">
                    <button className="btn btn-slate px-3 py-1 text-xs" onClick={()=>{setAns({...ans,[i]:true});sound.playClick();}}>True</button>
                    <button className="btn btn-slate px-3 py-1 text-xs" onClick={()=>{setAns({...ans,[i]:false});sound.playClick();}}>False</button>
                  </div>
                </div>
                {chosen!==undefined&&<div className={`text-xs mt-1 font-semibold ${ok?'text-emerald-400':'text-red-400'}`}>{ok?'✓':'✗'} {r.why}</div>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function QuizTab(){
  const questions=[
    {q:'A quadrilateral with all angles 90° and opposite sides equal is a…',options:['Rhombus','Rectangle','Kite','Trapezium'],correct:1,exp:'All right angles + opposite sides equal defines a rectangle.'},
    {q:'Sum of interior angles of any simple quadrilateral is…',options:['180°','270°','360°','540°'],correct:2,exp:'One diagonal splits it into two triangles: 180°+180°=360°.'},
    {q:'Diagonals of a rhombus are…',options:['Equal only','Perpendicular bisectors of each other','Parallel','Never equal'],correct:1,exp:'In a rhombus diagonals bisect each other at 90°.'},
    {q:'A square is also a…',options:['Only a rectangle','Only a rhombus','Rectangle and rhombus','Trapezium only'],correct:2,exp:'Square has all angles 90° (rectangle) and all sides equal (rhombus).'},
    {q:'Exactly one pair of parallel sides describes a…',options:['Parallelogram','Rhombus','Trapezium','Kite'],correct:2,exp:'Trapezium (trapezoid) has exactly one pair of parallel sides.'},
    {q:'If diagonals of a parallelogram are equal, it is a…',options:['Rhombus','Rectangle','Kite','General parallelogram'],correct:1,exp:'Equal diagonals that bisect each other force 90° angles → rectangle.'},
    {q:'In a kite, the diagonals are…',options:['Equal','Perpendicular','Parallel','Never bisect'],correct:1,exp:'Kite diagonals are perpendicular; one is axis of symmetry.'},
    {q:'Every parallelogram is a trapezium (exactly one pair ∥).',options:['True','False'],correct:1,exp:'False — a parallelogram has two pairs of parallel sides.'},
    {q:'Adjacent angles of a parallelogram are…',options:['Equal','Complementary (90°)','Supplementary (180°)','Always 60°'],correct:2,exp:'Consecutive angles between parallel sides are supplementary.'},
    {q:'A rhombus with equal diagonals is a…',options:['Kite only','Rectangle only','Square','Trapezium'],correct:2,exp:'Equal perpendicular diagonals → square.'},
  ];
  const [idx,setIdx]=useState(0),[score,setScore]=useState(0),[selected,setSelected]=useState(null),[showExp,setShowExp]=useState(false),[done,setDone]=useState(false);
  const submit=i=>{if(showExp)return;setSelected(i);setShowExp(true);if(i===questions[idx].correct){setScore(s=>s+1);sound.playSuccess();}else sound.playError();};
  const next=()=>{if(idx+1<questions.length){setIdx(idx+1);setSelected(null);setShowExp(false);}else setDone(true);};
  const restart=()=>{setIdx(0);setScore(0);setSelected(null);setShowExp(false);setDone(false);};
  if(done)return(
    <div className="h-full flex items-center justify-center">
      <div className="glass-panel p-8 rounded-3xl max-w-md w-full text-center space-y-4 cue-success cue-pop">
        <div className="text-4xl">🎉</div>
        <h3 className="text-2xl font-black text-white">Quiz Complete</h3>
        <p className="text-lg text-orange-400 font-bold">Score: {score} / {questions.length}</p>
        <button className="btn btn-orange px-6 py-2.5" onClick={restart}>Try Again</button>
      </div>
    </div>
  );
  const q=questions[idx];
  return(
    <div className="h-full flex items-center justify-center overflow-y-auto">
      <div className="glass-panel p-6 rounded-3xl max-w-xl w-full space-y-4">
        <div className="flex justify-between text-sm text-slate-300">
          <span>Question {idx+1} of {questions.length}</span>
          <span className="text-orange-400 font-bold">Score: {score}</span>
        </div>
        <div className="h-2 rounded-full overflow-hidden" style={{background:'#1e293b'}}>
          <div className="h-full" style={{width:`${((idx+(showExp?1:0))/questions.length)*100}%`,background:'linear-gradient(90deg,#f97316,#fbbf24)'}}/>
        </div>
        <h4 className="text-lg font-bold" style={{color:'#f8fafc'}}>{q.q}</h4>
        <div className="space-y-2.5">
          {q.options.map((opt,i)=>{
            let bg='#0f172a',border='#475569',color='#f1f5f9';
            if(showExp){
              if(i===q.correct){bg='rgba(16,185,129,0.2)';border='#10b981';color='#6ee7b7';}
              else if(i===selected){bg='rgba(239,68,68,0.2)';border='#ef4444';color='#fca5a5';}
              else{bg='#0f172a';border='#1e293b';color='#64748b';}
            }
            return(
              <button key={i} onClick={()=>submit(i)} disabled={showExp}
                className="w-full text-left px-4 py-3.5 rounded-xl border-2 text-sm font-semibold transition flex items-center gap-3 cursor-pointer"
                style={{background:bg,borderColor:border,color:color}}
                onMouseEnter={e=>{if(!showExp){e.currentTarget.style.borderColor='#f97316';e.currentTarget.style.background='#1e293b';}}}
                onMouseLeave={e=>{if(!showExp){e.currentTarget.style.borderColor='#475569';e.currentTarget.style.background='#0f172a';}}}>
                <span className="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-black flex-shrink-0"
                  style={{background:showExp&&i===q.correct?'#10b981':showExp&&i===selected?'#ef4444':'#ea580c',color:'#fff'}}>
                  {String.fromCharCode(65+i)}
                </span>
                <span style={{color:'inherit'}}>{opt}</span>
              </button>
            );
          })}
        </div>
        {showExp&&(
          <div className={`p-4 rounded-xl text-sm animate-fade-in ${selected===q.correct?'cue-success':'cue-error'}`}
            style={{background:selected===q.correct?'rgba(16,185,129,0.15)':'rgba(245,158,11,0.12)',border:`2px solid ${selected===q.correct?'#10b981':'#f59e0b'}`,color:selected===q.correct?'#6ee7b7':'#fcd34d'}}>
            <div className="font-bold mb-1 text-base">{selected===q.correct?'✅ Correct! Well done':'❌ Not quite — see why below'}</div>
            <div style={{color:'#e2e8f0'}}>{q.exp}</div>
            {selected!==q.correct&&<div className="mt-2 text-sm" style={{color:'#6ee7b7'}}>Correct answer: <strong>{String.fromCharCode(65+q.correct)}. {q.options[q.correct]}</strong></div>}
            <button className="btn btn-orange px-5 py-2 mt-3" onClick={next}>{idx+1<questions.length?'Next →':'See Results'}</button>
          </div>
        )}
      </div>
    </div>
  );
}

      <nav className="px-3 py-2 flex flex-wrap gap-1.5 flex-shrink-0" style={{borderBottom:'1px solid rgba(255,255,255,.08)'}}>
        {TABS.map(t=>(
          <button key={t.id} className={`tab-btn ${tab===t.id?'tab-active':'tab-idle'}`} onClick={()=>go(t.id)}>
            <span>{t.icon}</span>{t.label}
          </button>
        ))}
      </nav>
      <main className="flex-1 overflow-hidden relative flex flex-col p-3">{body[tab]}</main>
      <footer className="glass-panel px-5 py-1.5 flex justify-between items-center text-xs text-slate-400 flex-shrink-0" style={{borderTop:'1px solid rgba(255,255,255,.1)'}}>
        <span>NCERT Ganita Prakash • Chapter 4 • Quadrilaterals</span>
        <span>Andhra Pradesh Mathematics Forum • Author: Gangalapudi Bhasker Reddy</span>
      </footer>
    </div>
  );
}

try {
  const rootEl = document.getElementById('root');
  ReactDOM.createRoot(rootEl).render(<App/>);
} catch (err) {
  document.getElementById('root').innerHTML = '<div style="padding:24px;color:#fca5a5;font-family:system-ui"><h2>Render error</h2><pre style="white-space:pre-wrap;color:#e2e8f0">'+String(err)+'</pre></div>';
  console.error(err);
}
</script>
</body>
</html>
