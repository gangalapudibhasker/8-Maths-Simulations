<div id="root" class="viewport-wrapper"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}
const sound = new SoundEngine();

function SmartGrid({ rows, cols, colorClass, label }) {
  const maxDim = 14;
  const showR = Math.min(rows, maxDim);
  const showC = Math.min(cols, maxDim);
  const cellPx = showR * showC > 80 ? 11 : showR * showC > 40 ? 15 : 18;
  const truncated = rows > maxDim || cols > maxDim;
  return (
    <div className="text-center">
      <div className="text-sm font-bold slate mb-1">{label}</div>
      <div className="grid-vis" style={{gridTemplateColumns:`repeat(${showC},${cellPx}px)`}}>
        {Array.from({length: showR * showC}).map((_,i)=>(
          <div key={i} className={`cell ${colorClass}`} style={{width:cellPx,height:cellPx}}></div>
        ))}
      </div>
      {truncated && <div className="text-xs amber mt-1">showing {showR}×{showC} of {rows}×{cols}</div>}
    </div>
  );
}

function OverviewTab() {
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>6. We Distribute, Yet Things Multiply</h2>
      <p className="sub">Algebra writes general statements about patterns and proves properties. This chapter explores the <strong className="orange">distributive property</strong> and how it unlocks identities and fast calculations.</p>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'.55rem'}}>
        <div className="result-box">
          <div className="text-base font-bold orange mb-1">Core Idea</div>
          <div className="math">a(b + c) = ab + ac</div>
          <p className="text-sm slate mt-1">Multiplication “distributes” over addition. Same law works for more terms and for subtraction.</p>
        </div>
        <div className="result-box">
          <div className="text-base font-bold amber mb-1">What You Will Master</div>
          <ul className="text-sm" style={{paddingLeft:'1.15rem',lineHeight:1.5}}>
            <li>How products change when numbers ↑ / ↓</li>
            <li>Identity (a+m)(b+n) = ab + an + bm + mn</li>
            <li>Expanding algebraic products neatly</li>
            <li>Fast mental multiplication by 11, 101, 99…</li>
          </ul>
        </div>
      </div>

      {/* Visual figure: distributive rectangles */}
      <div className="identity-card">
        <div className="text-base font-bold white mb-2 text-center">Figure 1 — Distributive Property as Rectangles</div>
        <div className="vis-row">
          <div style={{textAlign:'center'}}>
            <div className="text-xs slate mb-1">ab</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,14px)',gap:2}}>
              {Array.from({length:12}).map((_,i)=>(
                <div key={'ab'+i} style={{width:14,height:14,borderRadius:3,background:'#3b82f6'}}></div>
              ))}
            </div>
            <div className="text-xs slate mt-1">3×4</div>
          </div>
          <span className="step-arrow">+</span>
          <div style={{textAlign:'center'}}>
            <div className="text-xs slate mb-1">ac</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(2,14px)',gap:2}}>
              {Array.from({length:6}).map((_,i)=>(
                <div key={'ac'+i} style={{width:14,height:14,borderRadius:3,background:'#f59e0b'}}></div>
              ))}
            </div>
            <div className="text-xs slate mt-1">3×2</div>
          </div>
          <span className="step-arrow">=</span>
          <div style={{textAlign:'center'}}>
            <div className="text-xs slate mb-1">a(b+c)</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(6,14px)',gap:2}}>
              {Array.from({length:18}).map((_,i)=>(
                <div key={'t'+i} style={{width:14,height:14,borderRadius:3,background:i%6<4?'#3b82f6':'#f59e0b'}}></div>
              ))}
            </div>
            <div className="text-xs slate mt-1">3×(4+2) = 18</div>
          </div>
        </div>
        <div className="math text-center mt-2" style={{fontSize:'1.1rem'}}>a(b + c) = ab + ac</div>
      </div>

      <div className="identity-card">
        <div className="text-base font-bold white mb-1">Key Identity (Identity 1)</div>
        <div className="math text-center py-1">(a + m)(b + n) = ab + mb + an + mn</div>
        <p className="text-sm slate text-center mt-1">Increase = an + bm + mn. One identity covers increases <em>and</em> decreases (use negative m or n).</p>
      </div>

      {/* Visual figure: Identity 1 four rectangles */}
      <div className="result-box">
        <div className="text-sm font-bold amber mb-2 text-center">Figure 2 — Identity 1 as Four Rectangles</div>
        <div className="vis-row">
          <div style={{textAlign:'center'}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,12px)',gap:2}}>
              {Array.from({length:6}).map((_,i)=>(<div key={i} style={{width:12,height:12,borderRadius:2,background:'#3b82f6'}}></div>))}
            </div>
            <div className="text-xs" style={{color:'#60a5fa'}}>ab</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(2,12px)',gap:2}}>
              {Array.from({length:4}).map((_,i)=>(<div key={i} style={{width:12,height:12,borderRadius:2,background:'#f59e0b'}}></div>))}
            </div>
            <div className="text-xs" style={{color:'#fbbf24'}}>an</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,12px)',gap:2}}>
              {Array.from({length:3}).map((_,i)=>(<div key={i} style={{width:12,height:12,borderRadius:2,background:'#10b981'}}></div>))}
            </div>
            <div className="text-xs" style={{color:'#34d399'}}>mb</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(2,12px)',gap:2}}>
              {Array.from({length:2}).map((_,i)=>(<div key={i} style={{width:12,height:12,borderRadius:2,background:'#ec4899'}}></div>))}
            </div>
            <div className="text-xs" style={{color:'#f472b6'}}>mn</div>
          </div>
        </div>
        <div className="step-flow" style={{marginTop:'.4rem'}}>
          <div className="step-node">ab</div><span className="step-arrow">+</span>
          <div className="step-node">an</div><span className="step-arrow">+</span>
          <div className="step-node">mb</div><span className="step-arrow">+</span>
          <div className="step-node">mn</div><span className="step-arrow">=</span>
          <div className="step-result">(a+m)(b+n)</div>
        </div>
      </div>

      <div className="formula-grid">
        <div className="formula-item"><div className="name">Definition — Identity</div><div className="eq">Two expressions equal for all values of the letters</div></div>
        <div className="formula-item"><div className="name">Definition — Like terms</div><div className="eq">Terms with exactly the same letter-numbers</div></div>
        <div className="formula-item"><div className="name">Distributivity (3 terms)</div><div className="eq">a(b + c + d) = ab + ac + ad</div></div>
        <div className="formula-item"><div className="name">Commutativity used</div><div className="eq">(a+b)c = c(a+b) = ca + cb</div></div>
      </div>

      {/* Figure: product increase */}
      <div className="result-box">
        <div className="text-sm font-bold amber mb-2 text-center">Figure 3 — How the product increases</div>
        <div className="step-flow">
          <div className="diag-box"><div className="diag-label">Only a ↑1</div><div className="diag-val">↑ = b</div></div>
          <div className="diag-box"><div className="diag-label">Only b ↑1</div><div className="diag-val">↑ = a</div></div>
          <div className="diag-box"><div className="diag-label">Both ↑1</div><div className="diag-val">↑ = a+b+1</div></div>
        </div>
        <p className="text-sm slate text-center mt-2">General: (a+m)(b+n) − ab = an + bm + mn</p>
      </div>

      <div className="tip"><strong className="amber">History:</strong> Brahmagupta (628 CE) first stated the distributive law as <em>khaṇḍa-guṇanam</em> (multiplication by parts). Fast methods were called <em>ista-gunana</em>.</div>
      <div className="tip-blue"><strong className="blue">How to use:</strong> Move through the tabs. Each has calculators, visual grids, definitions and practice. Whiteboard works on IFP / stylus / touch.</div>
    </div>
  );
}

function IncreasesTab() {
  const [a, setA] = useState(23);
  const [b, setB] = useState(27);
  const [m, setM] = useState(1);
  const [n, setN] = useState(1);
  const orig = a * b;
  const newProd = (a + m) * (b + n);
  const increase = newProd - orig;
  const formulaInc = a * n + b * m + m * n;
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>1. Increments in Products</h2>
      <p className="sub">Change a and b by any amounts m and n and see exactly how the product changes.</p>
      <div className="row">
        <div><label>a</label><input type="number" value={a} onChange={e=>{sound.playClick();setA(+e.target.value)}} className="input" /></div>
        <div><label>b</label><input type="number" value={b} onChange={e=>{sound.playClick();setB(+e.target.value)}} className="input" /></div>
        <div><label>m (Δa)</label><input type="number" value={m} onChange={e=>{sound.playClick();setM(+e.target.value)}} className="input" /></div>
        <div><label>n (Δb)</label><input type="number" value={n} onChange={e=>{sound.playClick();setN(+e.target.value)}} className="input" /></div>
        <button className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setA(23);setB(27);setM(1);setN(1)}}>Reset 23×27</button>
      </div>
      <div className="result-box">
        <div className="text-lg mb-1">Original: <span className="orange font-black">{a} × {b} = {orig}</span></div>
        <div className="text-lg mb-1">New: <span className="emerald font-black">({a}{m>=0?'+':''}{m}) × ({b}{n>=0?'+':''}{n}) = {newProd}</span></div>
        <div className="text-lg">Change: <span className={`font-black ${increase>=0?'green':'red'}`}>{increase>=0?'+':''}{increase}</span>
          <span className="text-sm slate"> &nbsp;|&nbsp; an + bm + mn = {a}·{n} + {b}·{m} + {m}·{n} = {formulaInc}</span>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'.45rem'}}>
        <div className="result-box text-center"><div className="text-sm slate">Only a ↑ by 1</div><div className="text-lg font-black orange">↑ = b</div><div className="text-sm">a(b+1) − ab = b</div></div>
        <div className="result-box text-center"><div className="text-sm slate">Only b ↑ by 1</div><div className="text-lg font-black orange">↑ = a</div><div className="text-sm">(a+1)b − ab = a</div></div>

      <p className="sub">Use the distributive property to multiply by 11, 101, 1001, 99, 999… in one line.</p>

        <div><label>Multiply by</label>
          <select value={mult} onChange={e=>{sound.playClick();setMult(+e.target.value)}} className="input" style={{width:115}}>

            <option value={99}>99</option><option value={999}>999</option><option value={10001}>10001</option>

        </div>

            <div className="step-box">Step 1: Write units digit of 3874 → <strong>4</strong></div>
            <div className="step-box">Step 2: Add last two digits 7+4 = 11. Write <strong>1</strong>, carry 1</div>
            <div className="step-box">Step 3: Add next pair 8+7 = 15, plus carry 1 = 16. Write <strong>6</strong>, carry 1</div>
            <div className="step-box">Step 4: Add next pair 3+8 = 11, plus carry 1 = 12. Write <strong>2</strong>, carry 1</div>
            <div className="step-box">Step 5: Leading digit 3 + carry 1 = <strong>4</strong></div>
            <div className="step-box">Result: <strong className="green">42614</strong> &nbsp;|&nbsp; Check: 3874×10 + 3874 = 38740+3874 = 42614 ✓</div>
            <div style={{marginTop:'.55rem'}}>

              <div className="digit-flow">
                <div className="digit-cell src">3</div>
                <div className="digit-cell src">8</div>
                <div className="digit-cell src">7</div>
                <div className="digit-cell src">4</div>
              </div>
              <div className="text-xs slate text-center mb-1" style={{marginTop:'.35rem'}}>Result with carries</div>
              <div className="digit-flow">
                <div className="digit-cell res">4</div>
                <div className="digit-cell res">2</div>
                <div className="digit-cell carry">¹</div>
                <div className="digit-cell res">6</div>
                <div className="digit-cell carry">¹</div>
                <div className="digit-cell res">1</div>
                <div className="digit-cell carry">¹</div>
                <div className="digit-cell res">4</div>
              </div>
              <div className="step-flow" style={{marginTop:'.4rem'}}>
                <div className="step-node">3+8+1</div>
                <span className="step-arrow">→</span>
                <div className="step-node">8+7+1</div>
                <span className="step-arrow">→</span>
                <div className="step-node">7+4</div>
                <span className="step-arrow">→</span>
                <div className="step-result">42614</div>
              </div>
            </div>
          </div>

        </div>
      )}
      {mult===101 && (
        <div className="space-y-1">
          <div className="text-base font-bold amber">Method for ×101</div>
          <div className="step-box">{num} × 101 = {num} × (100 + 1) = {num*100} + {num}</div>
          <div className="def-card"><div className="title">General rule</div><div className="body">×101 = write the number, leave two zeros, add the original shifted two places.</div></div>
        </div>
      )}
      {(mult===99||mult===999) && (
        <div className="space-y-1">
          <div className="text-base font-bold amber">Method for ×{mult}</div>

    </div>
  );
}

function FormulasTab() {
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>7. Definitions & Formula Sheet</h2>
      <p className="sub">All key definitions and identities from the chapter in one place for quick revision.</p>
      <div className="def-card">
        <div className="title">1. Distributive Property of Multiplication over Addition</div>
        <div className="body math" style={{fontSize:'1.15rem'}}>a(b + c) = ab + ac &nbsp;&nbsp;|&nbsp;&nbsp; (a + b)c = ac + bc</div>
        <div className="body text-sm slate mt-1">Also for subtraction: a(b − c) = ab − ac. Works for any number of terms inside the brackets.</div>
      </div>
      <div className="def-card">
        <div className="title">2. Identity</div>
        <div className="body">A statement that two algebraic expressions are equal for <em>every</em> value of the letter-numbers. Example: (a+1)(b−1) = ab + b − a − 1 is an identity.</div>
      </div>
      <div className="def-card">
        <div className="title">3. Like Terms</div>
        <div className="body">Terms that contain exactly the same letter-numbers raised to the same powers (e.g. 7xy² and −3xy²). Only like terms may be combined by addition or subtraction.</div>
      </div>
      <div className="identity-card">
        <div className="text-base font-bold white mb-1">Identity 1 — The Master Identity</div>
        <div className="math text-center">(a + m)(b + n) = ab + an + bm + mn</div>
        <div className="text-sm slate text-center mt-1">Increase in product = an + bm + mn</div>
      </div>
      <div className="formula-grid">
        <div className="formula-item"><div className="name">Both +1</div><div className="eq">(a+1)(b+1) = ab + a + b + 1</div></div>
        <div className="formula-item"><div className="name">a+1, b−1</div><div className="eq">(a+1)(b−1) = ab + b − a − 1</div></div>
        <div className="formula-item"><div className="name">Difference of squares</div><div className="eq">(a−b)(a+b) = a² − b²</div></div>
        <div className="formula-item"><div className="name">Square of sum</div><div className="eq">(a+b)² = a² + 2ab + b²</div></div>
        <div className="formula-item"><div className="name">Cube of sum</div><div className="eq">(a+b)³ = a³ + 3a²b + 3ab² + b³</div></div>
        <div className="formula-item"><div className="name">Difference of cubes</div><div className="eq">(a−b)(a²+ab+b²) = a³ − b³</div></div>
        <div className="formula-item"><div className="name">a−u, b+v</div><div className="eq">(a−u)(b+v) = ab − ub + av − uv</div></div>
        <div className="formula-item"><div className="name">a−u, b−v</div><div className="eq">(a−u)(b−v) = ab − ub − av + uv</div></div>
      </div>
      <div className="def-card">
        <div className="title">4. Fast-multiplication formulae</div>
        <div className="body" style={{lineHeight:1.55}}>
          n × 11 = n × (10 + 1) = 10n + n<br/>
          n × 101 = n × (100 + 1) = 100n + n<br/>
          n × 99 = n × (100 − 1) = 100n − n<br/>
          n × 999 = n × (1000 − 1) = 1000n − n
        </div>
      </div>
      <div className="tip-purple"><strong style={{color:'#a78bfa'}}>Historical note:</strong> Brahmagupta (Brahmasphutasiddhānta, verse 12.55) first wrote the distributive law explicitly as <em>khaṇḍa-guṇanam</em>. Verse 12.56 describes <em>ista-gunana</em> — fast multiplication by preferred numbers.</div>
    </div>
  );
}

    {q:'Identity 1 states (a+m)(b+n) equals…', options:['ab+mn','ab + an + bm + mn','a+b+m+n','(a+b)(m+n)'], correct:1, exp:'Every term of the first factor multiplies every term of the second.'},
    {q:'(a−b)(a+b) expands to…', options:['a²+b²','a² − b²','a²−2ab+b²','2ab'], correct:1, exp:'Difference of squares: a² − b².'},
    {q:'When one factor rises by 1 and the other falls by 1, the product…', options:['Always increases','Always decreases','Changes by b − a − 1','Stays the same'], correct:2, exp:'(a+1)(b−1) = ab + b − a − 1, so the change is b − a − 1.'},
    {q:'Quick method for ×11 uses…', options:['Doubling every digit','Summing neighbouring digits','Appending a zero','Reversing digits'], correct:1, exp:'Each new digit is the sum of two consecutive original digits (with carry).'},
    {q:'Brahmagupta called the distributive law…', options:['ista-gunana','khaṇḍa-guṇanam','Lilavati','Aryabhatiya'], correct:1, exp:'khaṇḍa-guṇanam means “multiplication by parts”.'},
    {q:'Expanding (a+b)(a²+2ab+b²) yields…', options:['a³+b³','a³ + 3a²b + 3ab² + b³','a³+2a²b+2ab²+b³','Only (a+b)³'], correct:1, exp:'This is exactly the expansion of (a+b)³.'},
    {q:'Which identity handles both increases and decreases?', options:['Only a(b+c)=ab+ac','(a+m)(b+n) with m,n allowed negative','Only (a+1)(b+1)','None'], correct:1, exp:'Negative m or n simply turn addition into subtraction.'},
    {q:'Like terms are terms that…', options:['Have the same coefficient','Have exactly the same letter-numbers','Are always positive','Contain only one letter'], correct:1, exp:'Like terms share identical letter-numbers so they can be added.'},
    {q:'n × 99 can be computed as…', options:['100n + n','100n − n','99n','n + 99'], correct:1, exp:'99 = 100 − 1, so n × 99 = 100n − n.'},

        <div className="text-3xl font-black orange">{score} / {qs.length}</div>

      <div style={{height:8,background:'#1e293b',borderRadius:4,overflow:'hidden'}}>

        </div>
      )}

  );
}

function WhiteboardTab() {
  const canvasRef = useRef(null);
  const isDrawing = useRef(false);
  const lastPos = useRef({x:0,y:0});
  const [color, setColor] = useState('#f97316');
  const [size, setSize] = useState(5);
  const colorRef = useRef(color), sizeRef = useRef(size);
  colorRef.current = color; sizeRef.current = size;
  const getPos = useCallback((e) => {
    const canvas = canvasRef.current; if(!canvas) return {x:0,y:0};
    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    if(e.touches&&e.touches.length>0){clientX=e.touches[0].clientX;clientY=e.touches[0].clientY;}
    else if(e.changedTouches&&e.changedTouches.length>0){clientX=e.changedTouches[0].clientX;clientY=e.changedTouches[0].clientY;}
    else{clientX=e.clientX;clientY=e.clientY;}
    return {x:(clientX-rect.left)*(canvas.width/rect.width), y:(clientY-rect.top)*(canvas.height/rect.height)};
  },[]);
  useEffect(()=>{
    const canvas=canvasRef.current; if(!canvas)return;
    const parent=canvas.parentElement;
    const resize=()=>{
      const dpr=window.devicePixelRatio||1, w=parent.clientWidth, h=parent.clientHeight;
      canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px';
      const ctx=canvas.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
      ctx.fillStyle='#1e293b'; ctx.fillRect(0,0,w,h);
    };
    resize(); window.addEventListener('resize',resize);
    const start=e=>{e.preventDefault();isDrawing.current=true;lastPos.current=getPos(e);};
    const stop=e=>{e.preventDefault();isDrawing.current=false;};
    const move=e=>{
      if(!isDrawing.current)return; e.preventDefault();
      const pos=getPos(e), ctx=canvas.getContext('2d'), dpr=window.devicePixelRatio||1;
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=sizeRef.current; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=colorRef.current;
      ctx.beginPath(); ctx.moveTo(lastPos.current.x/dpr,lastPos.current.y/dpr); ctx.lineTo(pos.x/dpr,pos.y/dpr); ctx.stroke();
      lastPos.current=pos;
    };
    ['mousedown','mouseup','mouseleave','mousemove','touchstart','touchend','touchcancel','touchmove','pointerdown','pointerup','pointerleave','pointermove'].forEach(ev=>{
      const fn=ev.includes('down')||ev.includes('start')?start:(ev.includes('up')||ev.includes('leave')||ev.includes('cancel')||ev.includes('end')?stop:move);
      canvas.addEventListener(ev,fn,{passive:false});
    });
    return()=>window.removeEventListener('resize',resize);
  },[getPos]);
  const clear=()=>{
    sound.playClick();
    const canvas=canvasRef.current; if(!canvas)return;
    const ctx=canvas.getContext('2d'), dpr=window.devicePixelRatio||1;
    ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#1e293b'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.scale(dpr,dpr);
  };
  return (
    <div className="card h-full flex flex-col space-y-2 overflow-hidden">
      <div className="flex flex-wrap gap-2 items-center flex-shrink-0">
        <span className="text-sm font-bold slate">Color:</span>
        {['#f97316','#3b82f6','#10b981','#eab308','#ec4899','#ffffff','#f87171'].map(c=>(
          <button key={c} onClick={()=>{sound.playClick();setColor(c)}}

        <span className="text-sm font-bold slate" style={{marginLeft:6}}>Size:</span>

          <button key={s} className={`btn btn-sm ${size===s?'btn-orange':'btn-dark'}`} onClick={()=>{sound.playClick();setSize(s)}}>{s}px</button>

      </div>
      <p className="text-xs slate text-center flex-shrink-0">Touch / stylus / mouse. Sketch expansions, rectangle models or the ×11 method. Optimised for Interactive Flat Panels.</p>
    </div>
  );
}
