<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Power Play • Ganita Prakash Grade 8</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;background:#0b0f19;color:#f1f5f9;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center;touch-action:manipulation}
.viewport-wrapper{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 30% 15%,#1e293b 0%,#0f172a 65%)}
.simulation-container{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;position:relative;box-shadow:0 25px 50px -12px rgba(0,0,0,.75);display:flex;flex-direction:column;overflow:hidden;background:#0f172a;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
.simulation-container:fullscreen,.simulation-container:-webkit-full-screen{width:100vw;height:100vh;max-width:none;max-height:none;border-radius:0;border:none}
.glass{background:rgba(30,41,59,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14)}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(249,115,22,.6);border-radius:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .25s ease-out forwards}
.flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-3{gap:.7rem}
.w-full{width:100%}.h-full{height:100%}.flex-1{flex:1 1 0%}.flex-shrink-0{flex-shrink:0}
.overflow-y-auto{overflow-y:auto}.overflow-hidden{overflow:hidden}
h2{font-size:1.5rem;font-weight:800;color:#fb923c;margin-bottom:.12rem;letter-spacing:-.02em}
.sub{font-size:1.1rem;color:#94a3b8;margin-bottom:.45rem;line-height:1.4}
label{font-size:.98rem;font-weight:700;color:#e2e8f0;display:block;margin-bottom:.15rem}
.text-lg{font-size:1.18rem}.text-base{font-size:1.1rem}.text-sm{font-size:1rem}.text-xs{font-size:.88rem}
.font-mono{font-family:ui-monospace,Menlo,Consolas,monospace}.font-bold{font-weight:700}.font-black{font-weight:900}
.orange{color:#fb923c}.amber{color:#fbbf24}.green{color:#4ade80}.red{color:#f87171}.blue{color:#60a5fa}.slate{color:#94a3b8}.white{color:#f8fafc}.emerald{color:#34d399}
.input{background:#0f172a;border:2px solid #475569;color:#fff;border-radius:.5rem;padding:.5rem .65rem;font-size:1.12rem;font-weight:700;outline:none;width:100px;text-align:center}
.input:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.3)}
.input-wide{width:140px}
.btn{cursor:pointer;border:none;border-radius:.5rem;font-weight:700;font-size:.98rem;padding:.5rem 1rem;transition:all .12s;touch-action:manipulation}
.btn-orange{background:#ea580c;color:#fff}.btn-orange:hover,.btn-orange:active{background:#f97316}
.btn-dark{background:#1e293b;color:#e2e8f0;border:1px solid #475569}.btn-dark:hover{background:#334155}
.btn-emerald{background:#059669;color:#fff}
.btn-sm{padding:.38rem .75rem;font-size:.9rem}
.tab-bar{display:flex;overflow-x:auto;gap:.3rem;padding:.4rem .6rem;background:#0f172a;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.tab{display:flex;align-items:center;gap:.28rem;padding:.5rem .8rem;border-radius:.5rem;font-size:.88rem;font-weight:700;cursor:pointer;border:none;white-space:nowrap;transition:all .12s;background:transparent;color:#94a3b8;touch-action:manipulation}
.tab:hover{background:#1e293b;color:#e2e8f0}
.tab.on{background:#ea580c;color:#fff;box-shadow:0 3px 12px rgba(234,88,12,.45)}
.card{background:rgba(30,41,59,.97);border:1px solid rgba(255,255,255,.14);border-radius:.85rem;padding:.75rem .95rem;display:flex;flex-direction:column}
.scene-caption{font-size:1rem;font-weight:700;color:#fbbf24;text-align:center;margin:.35rem 0 .15rem}
.scene-legend{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;margin:.3rem 0}
.legend-item{display:flex;align-items:center;gap:.3rem;background:#0f172a;border:1px solid #475569;border-radius:.45rem;padding:.3rem .55rem;font-size:.92rem;font-weight:600;color:#e2e8f0}
.annot{position:absolute;font-size:.78rem;font-weight:800;color:#fef9c3;text-shadow:0 1px 3px #000;background:rgba(15,23,42,.75);padding:2px 6px;border-radius:4px;border:1px solid rgba(251,191,36,.4)}

.row{display:flex;flex-wrap:wrap;gap:.55rem;align-items:flex-end;margin-bottom:.4rem}
.result-box{background:#0f172a;border:1px solid #475569;border-radius:.65rem;padding:.7rem .9rem;font-size:1.1rem;line-height:1.45}
.tip{margin-top:.35rem;padding:.65rem .9rem;background:rgba(251,191,36,.16);border-left:5px solid #fbbf24;border-radius:0 .5rem .5rem 0;font-size:1.05rem;color:#f1f5f9;line-height:1.4}
.tip-blue{margin-top:.35rem;padding:.65rem .9rem;background:rgba(96,165,250,.16);border-left:5px solid #60a5fa;border-radius:0 .5rem .5rem 0;font-size:1.05rem;color:#f1f5f9;line-height:1.4}
.tip-green{margin-top:.35rem;padding:.65rem .9rem;background:rgba(52,211,153,.16);border-left:5px solid #34d399;border-radius:0 .5rem .5rem 0;font-size:1.05rem;color:#f1f5f9;line-height:1.4}
.badge{display:inline-block;background:rgba(249,115,22,.3);color:#fb923c;padding:.2rem .65rem;border-radius:999px;font-size:.92rem;font-weight:800}
.step-box{background:#0f172a;border:1px solid #475569;border-radius:.5rem;padding:.5rem .8rem;margin:.25rem 0;font-family:ui-monospace,monospace;font-size:1.05rem;font-weight:600}
.identity-card{background:linear-gradient(135deg,rgba(234,88,12,.22),rgba(251,191,36,.12));border:1px solid rgba(249,115,22,.45);border-radius:.7rem;padding:.75rem .95rem;margin:.3rem 0}
.def-card{background:rgba(15,23,42,.9);border:1px solid #334155;border-radius:.6rem;padding:.55rem .8rem;margin:.25rem 0}
.def-card .title{font-size:.95rem;font-weight:800;color:#fbbf24;margin-bottom:.12rem}
.def-card .body{font-size:1rem;color:#e2e8f0;line-height:1.4}
.math{font-family:Georgia,'Times New Roman',serif;font-size:1.25rem;font-weight:600;color:#fbbf24}
.formula-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.formula-item{background:#0f172a;border:1px solid #334155;border-radius:.5rem;padding:.5rem .7rem}
.formula-item .name{font-size:.85rem;font-weight:700;color:#fb923c;margin-bottom:.08rem}
.formula-item .eq{font-family:Georgia,serif;font-size:1.08rem;color:#fbbf24;font-weight:600}
.quiz-opt{width:100%;text-align:left;padding:.65rem .9rem;border-radius:.6rem;border:2px solid #334155;background:#1e293b;color:#f1f5f9;font-size:1.05rem;font-weight:600;cursor:pointer;margin-bottom:.35rem;display:flex;align-items:center;gap:.6rem;touch-action:manipulation}
.quiz-opt:hover{border-color:#f97316;background:rgba(249,115,22,.15)}
.quiz-opt.correct{background:rgba(16,185,129,.28);border-color:#34d399;color:#d1fae5}
.quiz-opt.wrong{background:rgba(239,68,68,.22);border-color:#f87171;color:#fecaca}
.quiz-opt.disabled{pointer-events:none;opacity:.65}
.space-y-2>*+*{margin-top:.45rem}
.fold-bar{height:18px;border-radius:4px;background:linear-gradient(90deg,#f97316,#fbbf24);transition:width .3s}
.power-line{display:flex;flex-direction:column;gap:2px;font-family:ui-monospace,monospace;font-size:.92rem}
.power-line div{display:flex;justify-content:space-between;padding:3px 8px;border-radius:4px;background:#0f172a}
.logo-wrap{width:48px;height:48px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:transparent}
.logo-wrap img{width:100%;height:100%;object-fit:contain;mix-blend-mode:normal}
.pond-scene{position:relative;width:100%;min-height:200px;height:220px;border-radius:1rem;overflow:hidden;background:linear-gradient(180deg,#38bdf8 0%,#0ea5e9 35%,#0284c7 65%,#0c4a6e 100%);border:2px solid #7dd3fc;margin:.4rem 0}
.pond-water{position:absolute;bottom:0;left:0;right:0;min-height:45%;height:55%;background:linear-gradient(180deg,rgba(125,211,252,.55),rgba(14,116,144,.95));}
.pond-ripple{position:absolute;border:2px solid rgba(255,255,255,.35);border-radius:50%;animation:ripple 3s ease-out infinite}
@keyframes ripple{0%{transform:scale(.3);opacity:.8}100%{transform:scale(2.2);opacity:0}}
.lotus{position:absolute;font-size:1.6rem;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));transition:all .4s ease;cursor:default;user-select:none}
.lotus.bloom{animation:bloom .5s ease}
@keyframes bloom{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.paper-stack{display:flex;flex-direction:column;align-items:center;gap:0;margin:.5rem auto}
.paper-sheet{background:linear-gradient(135deg,#fef9c3,#fde047);border:1px solid #fbbf24;box-shadow:0 1px 4px rgba(251,191,36,.4);border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:all .25s}
.fold-scene{position:relative;width:100%;height:160px;border-radius:.85rem;overflow:hidden;background:linear-gradient(180deg,#1e3a5f 0%,#0f172a 55%,#1a2332 100%);border:1px solid #475569;display:flex;align-items:center;justify-content:center}
.moon{position:absolute;top:12px;right:20px;width:36px;height:36px;border-radius:50%;background:#fef9c3;box-shadow:0 0 20px #fde047}
.building{position:absolute;bottom:0;width:18px;background:linear-gradient(180deg,#64748b,#334155);border-radius:2px 2px 0 0}
.plane-icon{position:absolute;font-size:1.4rem;animation:fly 4s linear infinite}
@keyframes fly{0%{left:5%;top:40%}50%{left:70%;top:25%}100%{left:5%;top:40%}}
.thickness-viz{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100px;padding:8px}
.thickness-bar{background:linear-gradient(180deg,#fbbf24,#f97316);border-radius:3px 3px 0 0;min-width:8px;transition:height .3s}

const { useState, useMemo, useEffect, useRef, useCallback } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}

function formatThickness(cm) {
  if (cm < 0.01) return cm.toFixed(4) + ' cm';
  if (cm < 100) return cm.toFixed(3) + ' cm';
  if (cm < 100000) return (cm/100).toFixed(2) + ' m';
  if (cm < 1e7) return (cm/100000).toFixed(2) + ' km';
  return (cm/100000).toExponential(2) + ' km';
}

function LawsTab() {
  const [n, setN] = useState(2);
  const [a, setA] = useState(5);
  const [b, setB] = useState(3);
  const prod = Math.pow(n,a) * Math.pow(n,b);
  const pow = Math.pow(Math.pow(n,a), b);
  const quot = a>=b ? Math.pow(n, a-b) : 1/Math.pow(n, b-a);
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>3. Laws of Exponents</h2>
      <p className="sub">Live calculator for the three core laws. Change base and exponents.</p>
      <div className="row">
        <div><label>Base n</label><input type="number" value={n} onChange={e=>{sound.playClick();setN(+e.target.value||1)}} className="input" /></div>
        <div><label>a</label><input type="number" value={a} onChange={e=>{sound.playClick();setA(+e.target.value)}} className="input" /></div>
        <div><label>b</label><input type="number" value={b} onChange={e=>{sound.playClick();setB(+e.target.value)}} className="input" /></div>
      </div>
      <div className="identity-card">
        <div className="math text-center">{n}<sup>{a}</sup> × {n}<sup>{b}</sup> = {n}<sup>{a+b}</sup> = {prod}</div>
        <div className="text-sm slate text-center">Product law: n<sup>a</sup> × n<sup>b</sup> = n<sup>a+b</sup></div>
      </div>
      <div className="identity-card">
        <div className="math text-center">({n}<sup>{a}</sup>)<sup>{b}</sup> = {n}<sup>{a*b}</sup> = {pow}</div>
        <div className="text-sm slate text-center">Power law: (n<sup>a</sup>)<sup>b</sup> = n<sup>ab</sup></div>
      </div>
      <div className="identity-card">
        <div className="math text-center">{n}<sup>{a}</sup> ÷ {n}<sup>{b}</sup> = {n}<sup>{a-b}</sup> = {Number.isFinite(quot)?quot.toPrecision(6):'…'}</div>
        <div className="text-sm slate text-center">Quotient law: n<sup>a</sup> ÷ n<sup>b</sup> = n<sup>a−b</sup> (n ≠ 0)</div>
      </div>
      <div className="def-card">
        <div className="title">Same exponent on different bases</div>
        <div className="body math" style={{fontSize:'1.1rem'}}>m<sup>a</sup> × n<sup>a</sup> = (mn)<sup>a</sup> &nbsp;&nbsp;|&nbsp;&nbsp; m<sup>a</sup> / n<sup>a</sup> = (m/n)<sup>a</sup></div>
      </div>
      <div className="tip"><strong className="amber">Worked example:</strong> 3⁷ = 3⁴ × 3³ = 81 × 27 = 2187. Also 3⁷ = 3² × 3⁵.</div>
      <div className="tip-green"><strong className="emerald">Also:</strong> 2¹⁰ = (2²)⁵ = (2⁵)². Same exponent product can be regrouped many ways.</div>
    </div>
  );
}

function Powers10Tab() {
  const [numStr, setNumStr] = useState('561.903');
  const expanded = useMemo(() => {
    const raw = numStr.trim();
    if (!raw || isNaN(Number(raw))) return { parts: [], error: 'Enter a valid number' };
    const neg = raw.startsWith('-');
    const s = neg ? raw.slice(1) : raw;
    const [whole, frac = ''] = s.split('.');
    const parts = [];
    for (let i = 0; i < whole.length; i++) {
      const d = whole[i];
      if (d === '0') continue;
      const p = whole.length - 1 - i;
      parts.push({ d, p, term: `${d} × 10${p === 0 ? '⁰' : p === 1 ? '¹' : p === 2 ? '²' : p === 3 ? '³' : p === 4 ? '⁴' : '⁺' + p}` });
    }
    for (let i = 0; i < frac.length; i++) {
      const d = frac[i];
      if (d === '0') continue;
      const p = -(i + 1);
      parts.push({ d, p, term: `${d} × 10⁻${i + 1}` });
    }
    return { parts, neg, error: null };
  }, [numStr]);

  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>6. Powers of 10</h2>
      <p className="sub">Place value is powers of 10. Positive for whole places, negative for decimals.</p>

      <div className="result-box">
        <div className="text-sm font-bold amber mb-1">Textbook example</div>
        <div className="math" style={{fontSize:'1.08rem'}}>
          47561 = (4×10⁴) + (7×10³) + (5×10²) + (6×10¹) + (1×10⁰)
        </div>
      </div>
      <div className="result-box">
        <div className="math" style={{fontSize:'1.08rem'}}>
          561.903 = (5×10²)+(6×10¹)+(1×10⁰)+(9×10⁻¹)+(0×10⁻²)+(3×10⁻³)
        </div>
      </div>

      <div className="row">

    {q:'Simplify 2⁹ using product law (e.g. 2⁵×2⁴)', a:'2⁵×2⁴ = 2⁹ = 512', steps:['2⁵=32, 2⁴=16','32×16=512']},
    {q:'(4³)² in two ways', a:'4⁶ = 4096', steps:['(4³)² = 4⁶','Or 4³×4³ = 64×64 = 4096']},
    {q:'2⁴ ÷ 2⁵', a:'2⁻¹ = 1/2', steps:['Quotient law: 2⁴⁻⁵ = 2⁻¹','Negative exponent → reciprocal 1/2']},
    {q:'Pond half full if full on day 30', a:'Day 29', steps:['Doubling: full = 2 × half','So half occurs one day before full']},

    {q:'Is (−2)⁴ = 16?', a:'Yes, 16', steps:['Even power: negative base becomes positive','(−2)×(−2)×(−2)×(−2) = 16']},

function QuizTab() {
  const qs = [
    {q:'Thickness after n folds (initial v) is…', options:['v+n','v×n','v×2ⁿ','2ⁿ'], correct:2, exp:'Each fold doubles → multiply by 2, n times → v×2ⁿ.'},
    {q:'2¹⁰ equals…', options:['20','1024','100','512'], correct:1, exp:'2¹⁰ = 1024. After every 10 folds thickness multiplies by 1024.'},
    {q:'nᵃ × nᵇ equals…', options:['nᵃᵇ','nᵃ⁺ᵇ','nᵃ⁻ᵇ','(nᵃ)ᵇ'], correct:1, exp:'Product law: add the exponents.'},
    {q:'(nᵃ)ᵇ equals…', options:['nᵃ⁺ᵇ','nᵃᵇ','nᵃ⁻ᵇ','aⁿᵇ'], correct:1, exp:'Power of a power: multiply exponents.'},
    {q:'n⁰ (n≠0) equals…', options:['0','n','1','undefined'], correct:2, exp:'From nᵃ÷nᵃ = n⁰ = 1.'},
    {q:'2⁻³ equals…', options:['−8','1/8','−1/8','8'], correct:1, exp:'n⁻ᵃ = 1/nᵃ → 1/2³ = 1/8.'},
    {q:'Pond full on day 30 is half full on…', options:['Day 15','Day 29','Day 28','Day 1'], correct:1, exp:'Doubling means half one day before full.'},
    {q:'5-digit numeric lock has how many passwords?', options:['5×10','10⁵','5¹⁰','50'], correct:1, exp:'10 choices per digit, 5 digits → 10⁵ = 100000.'},
  ];
  const [idx,setIdx]=useState(0),[sel,setSel]=useState(null),[score,setScore]=useState(0),[done,setDone]=useState(false),[show,setShow]=useState(false);
  const submit=i=>{if(show)return;sound.playClick();setSel(i);setShow(true);if(i===qs[idx].correct){setScore(s=>s+1);sound.playSuccess();}};
  const next=()=>{sound.playClick();if(idx+1>=qs.length)setDone(true);else{setIdx(idx+1);setSel(null);setShow(false);}};
  if(done) return (
    <div className="card h-full flex items-center justify-center">
      <div className="text-center space-y-3" style={{maxWidth:400}}>
        <div style={{fontSize:48}}>{score>=qs.length*0.7?'🎉':'📚'}</div>
        <h2>Quiz Complete</h2>
        <div className="text-3xl font-black orange">{score} / {qs.length}</div>
        <button className="btn btn-orange" onClick={()=>{setIdx(0);setSel(null);setScore(0);setDone(false);setShow(false);sound.playClick();}}>Try Again</button>
      </div>
    </div>
  );
  const q=qs[idx];
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <div className="flex justify-between"><span className="text-sm slate font-bold">Q {idx+1}/{qs.length}</span><span className="badge">Score {score}</span></div>
      <h2 style={{fontSize:'1.2rem'}}>{q.q}</h2>
      {q.options.map((o,i)=>{
        let cls='quiz-opt';
        if(show){if(i===q.correct)cls+=' correct';else if(i===sel)cls+=' wrong';else cls+=' disabled';}
        return <button key={i} className={cls} onClick={()=>submit(i)} disabled={show}>
          <span style={{width:30,height:30,borderRadius:7,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,background:show&&i===q.correct?'#10b981':show&&i===sel?'#ef4444':'#ea580c',color:'#fff'}}>{String.fromCharCode(65+i)}</span>
          <span>{o}</span>
        </button>;
      })}
      {show && <div className={sel===q.correct?'tip-green':'tip'}><strong>{sel===q.correct?'✅ Correct!':'❌ Not quite.'}</strong> {q.exp}
        <div className="mt-2"><button className="btn btn-orange" onClick={next}>{idx+1<qs.length?'Next →':'Results'}</button></div>
      </div>}
    </div>
  );
}

function WhiteboardTab() {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const last = useRef({x:0,y:0});
  const [color, setColor] = useState('#f97316');
  const [size, setSize] = useState(5);
  const colorRef = useRef(color); const sizeRef = useRef(size);
  colorRef.current=color; sizeRef.current=size;
  const getPos = useCallback(e=>{
    const c=canvasRef.current; if(!c)return{x:0,y:0};
    const r=c.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    return {x:(cx-r.left)*(c.width/r.width), y:(cy-r.top)*(c.height/r.height)};
  },[]);
  useEffect(()=>{
    const c=canvasRef.current; if(!c)return;
    const p=c.parentElement;
    const resize=()=>{const d=window.devicePixelRatio||1;c.width=p.clientWidth*d;c.height=p.clientHeight*d;c.style.width=p.clientWidth+'px';c.style.height=p.clientHeight+'px';const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#1e293b';ctx.fillRect(0,0,p.clientWidth,p.clientHeight);};
    resize(); window.addEventListener('resize',resize);
    const start=e=>{e.preventDefault();drawing.current=true;last.current=getPos(e);};
    const stop=e=>{e.preventDefault();drawing.current=false;};
    const move=e=>{if(!drawing.current)return;e.preventDefault();const pos=getPos(e);const ctx=c.getContext('2d');const d=window.devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=sizeRef.current;ctx.lineCap='round';ctx.strokeStyle=colorRef.current;ctx.beginPath();ctx.moveTo(last.current.x/d,last.current.y/d);ctx.lineTo(pos.x/d,pos.y/d);ctx.stroke();last.current=pos;};
    ['pointerdown','mousedown','touchstart'].forEach(ev=>c.addEventListener(ev,start,{passive:false}));
    ['pointerup','mouseup','touchend','pointerleave','mouseleave'].forEach(ev=>c.addEventListener(ev,stop,{passive:false}));
    ['pointermove','mousemove','touchmove'].forEach(ev=>c.addEventListener(ev,move,{passive:false}));
    return()=>window.removeEventListener('resize',resize);
  },[getPos]);
  const clear=()=>{sound.playClick();const c=canvasRef.current;if(!c)return;const ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#1e293b';ctx.fillRect(0,0,c.width,c.height);};
  return (
    <div className="card h-full flex flex-col space-y-2 overflow-hidden">
      <div className="flex flex-wrap gap-2 items-center">
        {['#f97316','#3b82f6','#10b981','#eab308','#ec4899','#fff'].map(col=>(
          <button key={col} onClick={()=>{sound.playClick();setColor(col)}} style={{width:28,height:28,borderRadius:'50%',background:col,border:color===col?'3px solid #fff':'2px solid transparent'}} />
        ))}
        {[3,5,8,14].map(s=><button key={s} className={`btn btn-sm ${size===s?'btn-orange':'btn-dark'}`} onClick={()=>{sound.playClick();setSize(s)}}>{s}px</button>)}
        <button className="btn btn-sm" style={{background:'#dc2626',color:'#fff'}} onClick={clear}>Clear</button>
      </div>
      <div className="flex-1 rounded-xl overflow-hidden border border-slate-600" style={{minHeight:0,touchAction:'none'}}>
        <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block',touchAction:'none',cursor:'crosshair'}} />
      </div>
    </div>
  );
}
