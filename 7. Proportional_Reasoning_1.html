<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(600,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}
const sound = new SoundEngine();

function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a||1; }
function simplify(a,b){ const g=gcd(a,b); return [a/g,b/g]; }
function isProportional(a,b,c,d){ return a*d===b*c; }

function pronounce(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-IN'; u.rate = 0.92;
  window.speechSynthesis.speak(u);
  sound.playClick();
}
function PronounceBtn({text, label='Pronounce'}){
  return (
    <button className="pronounce-btn" onClick={()=>pronounce(text)} title="Listen">
      🔊 {label}
    </button>
  );
}

function App(){
  const [dark, setDark] = useState(true);
  const [muted, setMuted] = useState(false);
  const [tab, setTab] = useState('intro');
  const [isFullscreen, setIsFullscreen] = useState(false);

  useEffect(()=>{ sound.setMuted(muted); },[muted]);
  useEffect(()=>{ document.documentElement.classList.toggle('dark', dark); },[dark]);
  useEffect(()=>{
    const onFs = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange', onFs);
    return () => document.removeEventListener('fullscreenchange', onFs);
  },[]);

  const toggleFullscreen = () => {
    sound.playClick();
    const el = document.querySelector('.simulation-container');
    if (!document.fullscreenElement) (el||document.documentElement).requestFullscreen?.().catch(()=>{});
    else document.exitFullscreen?.().catch(()=>{});
  };

  const tabs = [
    {id:'intro', label:'0. Overview', icon:'📖'},
    {id:'similar', label:'1. Similar Images', icon:'🖼️'},
    {id:'ratios', label:'2. Ratios', icon:'⚖️'},
    {id:'simplest', label:'3. Simplest Form', icon:'✂️'},
    {id:'check', label:'4. Check Proportion', icon:'✓'},
    {id:'scale', label:'5. Scaling Factor', icon:'🔍'},
    {id:'rule3', label:'6. Rule of Three', icon:'3️⃣'},
    {id:'cross', label:'7. Cross Multiply', icon:'✖️'},
    {id:'examples', label:'8. Real-Life', icon:'🍋'},
    {id:'coffee', label:'9. Filter Coffee', icon:'☕'},
    {id:'share', label:'10. Sharing', icon:'🤝'},
    {id:'figout', label:'11. Figure it Out', icon:'📝'},
    {id:'whiteboard', label:'12. Whiteboard', icon:'✍️'},
    {id:'quiz', label:'13. Quiz', icon:'🏆'},
  ];

  return (
    <div className="simulation-container">
      <header className="glass-panel px-4 py-2 flex justify-between items-center z-30 flex-shrink-0 border-b border-white/10">
        <div className="flex items-center space-x-3">
          <img src={"data:image/png;base64,"+LOGO} alt="APMF" className="w-11 h-11 rounded-xl shadow-lg object-contain bg-white" style={{padding:'2px'}} />
          <div>
            <h1 className="text-lg font-bold tracking-tight text-white">Proportional Reasoning-1</h1>
            <p className="text-xs text-slate-400">Ganita Prakash Grade 8 • Complete Simulation</p>
          </div>
        </div>
        <div className="flex items-center space-x-3">
          <div className="hidden md:flex flex-col items-end">
            <span className="text-xs font-semibold text-orange-400">Andhra Pradesh Mathematics Forum</span>
            <span className="text-sm font-bold text-white">Gangalapudi Bhasker Reddy</span>
          </div>
          <div className="flex items-center space-x-1.5 bg-slate-800 p-1.5 rounded-xl border border-slate-700">
            <button onClick={()=>{sound.playClick();setDark(!dark);}} className="p-1.5 rounded-lg text-slate-300 cursor-pointer" title={dark?'Light':'Dark'}>{dark?'🌙':'☀️'}</button>
            <button onClick={()=>{sound.playClick();setMuted(!muted);}} className="p-1.5 rounded-lg text-slate-300 cursor-pointer" title={muted?'Unmute':'Mute'}>{muted?'🔇':'🔊'}</button>
            <button onClick={toggleFullscreen} className="p-1.5 rounded-lg text-slate-300 cursor-pointer" title="Fullscreen">{isFullscreen?'🗗':'⛶'}</button>
          </div>
        </div>
      </header>

      <nav className="bg-slate-900/90 px-2 py-1.5 border-b border-slate-800 flex-shrink-0 z-20">
        <div className="flex flex-wrap gap-1 justify-center">
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>{sound.playClick();setTab(t.id);}} className={`tab-btn ${tab===t.id?'tab-active':'tab-idle'}`}>
              <span>{t.icon}</span><span>{t.label}</span>
            </button>
          ))}
        </div>
      </nav>

      <main className="flex-1 overflow-hidden relative flex flex-col p-3">
        {tab==='intro' && <IntroTab />}
        {tab==='similar' && <SimilarTab />}
        {tab==='ratios' && <RatiosTab />}
        {tab==='simplest' && <SimplestTab />}
        {tab==='check' && <CheckTab />}
        {tab==='scale' && <ScaleTab />}
        {tab==='rule3' && <Rule3Tab />}
        {tab==='cross' && <CrossTab />}
        {tab==='examples' && <ExamplesTab />}
        {tab==='coffee' && <CoffeeTab />}
        {tab==='share' && <ShareTab />}
        {tab==='figout' && <FigOutTab />}
        {tab==='whiteboard' && <WhiteboardTab />}
        {tab==='quiz' && <QuizTab />}
      </main>

      <footer className="glass-panel px-4 py-1.5 flex justify-between items-center text-xs text-slate-400 flex-shrink-0 border-t border-white/10 z-30">
        <span>NCERT Ganita Prakash • Chapter 7 • Proportional Reasoning-1</span>
        <span>APMF • <strong>Gangalapudi Bhasker Reddy</strong></span>
      </footer>
    </div>
  );
}

/* ===== 0. Overview ===== */
function IntroTab(){
  const ideas = [
    {t:'Similarity in Change', d:'Images look similar only when width & height change by the SAME factor (multiply), not the same amount (subtract).'},
    {t:'Ratio a : b', d:'For every a units of the first quantity there are b units of the second. These are the terms of the ratio.'},
    {t:'Simplest Form', d:'Divide both terms by their HCF. Two ratios are proportional when their simplest forms are identical.'},
    {t:'Proportion ∷', d:'a : b ∷ c : d means the ratios are proportional. Equivalent to a/b = c/d or a×d = b×c.'},
    {t:'Rule of Three', d:'Given three quantities, find the fourth so ratios stay proportional. Called Trairasika by Āryabhaṭa.'},
    {t:'Cross Multiplication', d:'If a : b ∷ c : d then a×d = b×c. Unknown d = (b×c)/a.'},
  ];
  return (
    <div className="h-full overflow-y-auto pr-1 space-y-3">

/* ===== 3. Simplest Form ===== */
function SimplestTab(){
  const [a,setA]=useState(72);
  const [b,setB]=useState(96);
  const g = gcd(a,b);
  const [sa,sb] = simplify(a,b);
  const steps = [];
  let x=a, y=b;
  while(y){ steps.push(`${x} = ${Math.floor(x/y)}×${y} + ${x%y}`); const t=y; y=x%y; x=t; }

  return (
    <div className="h-full overflow-y-auto pr-1 space-y-3">
      <div className="glass-panel p-4 rounded-2xl">
        <div className="flex justify-between items-start mb-2 flex-wrap gap-2">
          <h3 className="text-lg font-bold text-orange-400">7.3 Ratios in their Simplest Form</h3>
          <PronounceBtn text="To write a ratio in simplest form, divide both terms by their highest common factor, or H C F. The resulting ratio cannot be simplified further." />
        </div>
        <p className="text-sm text-slate-300 mb-3">Divide both terms by their HCF. The result cannot be simplified further.</p>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div className="space-y-3">
            <div className="flex gap-3 items-center justify-center">
              <input type="number" className="input-dark w-24 text-center font-mono text-lg" value={a} onChange={e=>setA(+e.target.value||1)}/>
              <span className="text-3xl text-orange-400 font-black">:</span>
              <input type="number" className="input-dark w-24 text-center font-mono text-lg" value={b} onChange={e=>setB(+e.target.value||1)}/>
            </div>
            <div className="bg-slate-900/80 p-4 rounded-xl border border-orange-500/40 text-center">
              <div className="text-xs text-slate-400 mb-1">HCF</div>
              <div className="text-3xl font-black text-amber-400">{g}</div>
              <div className="text-sm text-slate-300 mt-2">
                {a} ÷ {g} = <strong className="text-orange-400">{sa}</strong> &nbsp;
                {b} ÷ {g} = <strong className="text-orange-400">{sb}</strong>
              </div>
              <div className="text-2xl font-black text-emerald-400 mt-2">{sa} : {sb}</div>
            </div>
            <div className="flex flex-wrap gap-1.5 justify-center">
              {[[3,4],[72,96],[60,40],[90,60],[14,21],[18,24],[15,35]].map(([x,y])=>(
                <button key={x+':'+y} className={`btn px-2.5 py-1 text-xs ${a===x&&b===y?'btn-orange':'btn-slate'}`}
                  onClick={()=>{setA(x);setB(y);sound.playClick();}}>{x}:{y}</button>
              ))}
            </div>
          </div>
          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
            <div className="text-sm font-bold text-amber-400 mb-2">Euclidean Algorithm</div>
            <div className="space-y-1 font-mono text-sm text-slate-300">
              {steps.map((s,i)=><div key={i}>{s}</div>)}
              <div className="text-emerald-400 font-bold mt-2">HCF = {g}</div>
            </div>
          </div>
        </div>
      </div>
      <div className="formula-box text-sm">
        <strong className="text-emerald-400">Rule:</strong> a : b is simplest when gcd(a,b)=1.
        Two ratios are proportional ⇔ simplest forms identical ⇔ a×d = b×c.
      </div>
    </div>
  );
}

/* ===== 7. Cross Multiplication ===== */
function CrossTab(){
  const [a,setA]=useState(150);

        <div className="flex justify-between items-start mb-2 flex-wrap gap-2">
          <h3 className="text-lg font-bold text-orange-400">Cross Multiplication</h3>
          <PronounceBtn text="When two ratios a to b and c to d are proportional, the product of the extremes equals the product of the means. That is a times d equals b times c. We can solve for the unknown by rearranging: d equals b times c divided by a." />
        </div>
        <p className="text-sm text-slate-300 mb-3">When a : b ∷ c : d, the products of extremes and means are equal: <strong>a × d = b × c</strong>.</p>
        <div className="formula-box text-center text-lg mb-3">a × d = b × c &nbsp;⇒&nbsp; d = (b × c) / a</div>

        <div className="flex flex-wrap items-center justify-center gap-2 mb-3">
          <div className="cross-box" style={{borderColor:'#f97316'}}>
            <div className="text-[10px] text-slate-500 uppercase">a</div>
            <input type="number" className="input-dark w-16 text-center text-lg font-bold mt-1" value={a} onChange={e=>setA(+e.target.value||1)}/>
          </div>
          <span className="text-xl text-orange-400 font-black">:</span>
          <div className="cross-box">
            <div className="text-[10px] text-slate-500 uppercase">b</div>
            <input type="number" className="input-dark w-16 text-center text-lg font-bold mt-1" value={b} onChange={e=>setB(+e.target.value||1)}/>
          </div>
          <span className="text-2xl text-amber-400 font-black">∷</span>
          <div className="cross-box">
            <div className="text-[10px] text-slate-500 uppercase">c</div>
            <input type="number" className="input-dark w-16 text-center text-lg font-bold mt-1" value={c} onChange={e=>setC(+e.target.value||1)}/>
          </div>
          <span className="text-xl text-orange-400 font-black">:</span>
          <div className="cross-box" style={{borderColor:'#10b981',boxShadow:'0 0 0 3px rgba(16,185,129,.25)'}}>
            <div className="text-[10px] text-emerald-400 uppercase font-bold">d</div>
            <div className="text-2xl font-black text-emerald-400 mt-1">{dDisp}</div>
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mb-3">
          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-700 text-center">
            <div className="text-xs text-slate-400 mb-1">Extremes (a × d)</div>
            <div className="text-xl font-black text-orange-400">{a} × {dDisp} = <span className="text-white">{(a*d).toFixed(1)}</span></div>
          </div>
          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-700 text-center">
            <div className="text-xs text-slate-400 mb-1">Means (b × c)</div>
            <div className="text-xl font-black text-blue-400">{b} × {c} = <span className="text-white">{b*c}</span></div>
          </div>
        </div>
        <div className={`p-2.5 rounded-xl text-center text-sm font-bold ${Math.abs(a*d-b*c)<0.01?'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40':'bg-red-500/20 text-red-300 border border-red-500/40'}`}>
          {Math.abs(a*d-b*c)<0.01 ? '✅ Cross products match — proportion is true!' : 'Products differ'}
        </div>
      </div>
      <div className="glass-panel p-3 rounded-2xl">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm">
          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
            <div className="text-amber-400 font-bold mb-1">🚗 Car example</div>
            <p className="text-slate-300">150 min : 90 km ∷ 240 min : ?</p>
            <button className="btn btn-slate px-3 py-1 mt-1.5 text-xs" onClick={()=>{setA(150);setB(90);setC(240);sound.playClick();}}>Load</button>
            <p className="text-emerald-400 mt-1 font-semibold">→ 144 km</p>
          </div>
          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
            <div className="text-amber-400 font-bold mb-1">Derivation</div>
            <p className="text-slate-300 leading-relaxed text-xs">
              c = f·a → f = c/a<br/>
              d = f·b → d = (c/a)·b = (b·c)/a<br/>

            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

  ];
  return (
    <div className="h-full overflow-y-auto pr-1 space-y-3">
      <div className="glass-panel p-4 rounded-2xl">
        <h3 className="text-lg font-bold text-orange-400 mb-2">Figure it Out — Practice</h3>
        <div className="space-y-2">
          {questions.map(q=>(
            <div key={q.id} className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
              <div className="text-sm font-semibold text-white mb-1">{q.id}. {q.q}</div>
              <button className="btn btn-slate px-2.5 py-1 text-xs mb-1"
                onClick={()=>{setAns({...ans,[q.id]:!ans[q.id]});sound.playClick();}}>
                {ans[q.id]?'Hide':'Show'} Hint & Answer
              </button>
              {ans[q.id] && (
                <div className="text-sm text-slate-300 mt-1 animate-fade-in">
                  <div className="text-amber-400">Hint: {q.hint}</div>
                  <div className="text-emerald-400 font-bold">Answer: {q.sample}</div>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ===== 12. Whiteboard ===== */
function WhiteboardTab(){
  const canvasRef = useRef(null);
  const isDrawing = useRef(false);
  const lastPos = useRef({x:0,y:0});
  const [drawingColor,setDrawingColor]=useState('#f97316');
  const [brushSize,setBrushSize]=useState(4);

  useEffect(()=>{
    const canvas=canvasRef.current; if(!canvas)return;
    const parent=canvas.parentElement;
    const resize=()=>{
      canvas.width=parent.clientWidth; canvas.height=parent.clientHeight;
      const ctx=canvas.getContext('2d'); ctx.fillStyle='#1e293b'; ctx.fillRect(0,0,canvas.width,canvas.height);
    };
    resize(); window.addEventListener('resize',resize);
    return()=>window.removeEventListener('resize',resize);
  },[]);

  const getPos=(e)=>{
    const rect=canvasRef.current.getBoundingClientRect();
    const clientX=e.clientX??(e.touches&&e.touches[0].clientX);
    const clientY=e.clientY??(e.touches&&e.touches[0].clientY);
    return{x:clientX-rect.left,y:clientY-rect.top};
  };
  const startDrawing=(e)=>{e.preventDefault();isDrawing.current=true;const pos=getPos(e);lastPos.current=pos;};
  const stopDrawing=()=>{isDrawing.current=false;};
  const draw=(e)=>{
    if(!isDrawing.current||!canvasRef.current)return;
    e.preventDefault();
    const pos=getPos(e); const ctx=canvasRef.current.getContext('2d');
    ctx.lineWidth=brushSize;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=drawingColor;
    ctx.beginPath();ctx.moveTo(lastPos.current.x,lastPos.current.y);ctx.lineTo(pos.x,pos.y);ctx.stroke();
    lastPos.current=pos;
  };
  const clearWhiteboard=()=>{
    sound.playClick();
    const canvas=canvasRef.current;
    if(canvas){const ctx=canvas.getContext('2d');ctx.fillStyle='#1e293b';ctx.fillRect(0,0,canvas.width,canvas.height);}
  };

  return (
    <div className="h-full flex flex-col space-y-2 overflow-hidden">
      <div className="glass-panel px-3 py-2 rounded-xl flex items-center justify-between flex-shrink-0 flex-wrap gap-2">
        <div className="flex items-center gap-1.5">
          <span className="text-xs font-bold text-slate-300">Color:</span>
          {['#f97316','#3b82f6','#10b981','#eab308','#ec4899','#ffffff','#000000'].map(c=>(
            <button key={c} onClick={()=>{sound.playClick();setDrawingColor(c);}}
              className="w-5 h-5 rounded-full border-2 transition cursor-pointer"
              style={{backgroundColor:c,borderColor:drawingColor===c?'#fff':'transparent',transform:drawingColor===c?'scale(1.15)':'scale(1)'}}/>
          ))}
        </div>
        <div className="flex items-center gap-1.5">
          <span className="text-xs font-bold text-slate-300">Size:</span>
          {[2,4,8,14].map(s=>(
            <button key={s} onClick={()=>{sound.playClick();setBrushSize(s);}}
              className={`btn px-2 py-0.5 text-xs ${brushSize===s?'btn-orange':'btn-slate'}`}>{s}px</button>
          ))}
          <button onClick={clearWhiteboard} className="btn btn-red px-2.5 py-0.5 text-xs">Clear</button>
        </div>
      </div>
      <div className="glass-panel rounded-2xl flex-1 overflow-hidden relative border border-slate-800">
        <canvas ref={canvasRef}
          onMouseDown={startDrawing} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onMouseMove={draw}
          onTouchStart={startDrawing} onTouchEnd={stopDrawing} onTouchMove={draw}
          className="cursor-crosshair w-full h-full block" style={{touchAction:'none'}}/>
      </div>
      <p className="text-xs text-slate-500 text-center">Sketch ratio bars, similar rectangles, or cross-multiplication steps.</p>
    </div>
  );
}

/* ===== 13. Quiz ===== */
function QuizTab(){
  const qs = [
    {q:'Images look similar when width and height change by…',options:['The same amount (subtraction)','The same factor (multiplication)','Any random numbers','Only when they stay the same size'],correct:1,exp:'Same multiplicative factor keeps the ratio constant → similar shapes.',wrong:'Adding/subtracting the same number changes the ratio.'},
    {q:'The ratio 60 : 40 in simplest form is…',options:['6 : 4','15 : 10','3 : 2','30 : 20'],correct:2,exp:'HCF of 60 and 40 is 20 → 3 : 2.',wrong:'Divide both terms by their HCF (20).'},
    {q:'Two ratios a:b and c:d are proportional when…',options:['a+b = c+d','a×d = b×c','a−b = c−d','a/b = c−d'],correct:1,exp:'Cross-multiplication equality is the definition of proportion.',wrong:'Remember a×d = b×c.'},
    {q:'In the Rule of Three, ichchhāphala = …',options:['(pramāṇa × phala)/ichchhā','(phala × ichchhā)/pramāṇa','pramāṇa + phala + ichchhā','phala − ichchhā'],correct:1,exp:'Āryabhaṭa: multiply phala by ichchhā and divide by pramāṇa.',wrong:'d = (b×c)/a.'},
    {q:'6 glasses : 10 spoons ∷ 18 glasses : ? spoons',options:['20','25','30','15'],correct:2,exp:'Factor 18/6=3 → 10×3=30.',wrong:'Scale both terms by the same factor 3.'},
    {q:'Which tea is more expensive per kg? Himachal 200 g = ₹200, Meghalaya 1 kg = ₹800',options:['Meghalaya','Himachal','Same price','Cannot tell'],correct:1,exp:'Himachal costs ₹1000 per kg; Meghalaya ₹800 per kg.',wrong:'Convert to same weight first.'},
    {q:'Adding the same number to both terms of a ratio…',options:['Keeps it proportional','Usually changes the ratio','Always gives 1:1','Doubles the ratio'],correct:1,exp:'Age example: 3:30 becomes 12:39 — no longer 1:10.',wrong:'Only multiplication/division by the same factor preserves the ratio.'},
    {q:'Filter coffee 15:35 is regular. 20:30 is…',options:['Lighter','Stronger','The same','Not a ratio'],correct:1,exp:'20/30 > 15/35 → higher proportion of decoction → stronger.',wrong:'Compare the fractions decoction/milk.'},
  ];
  const [idx,setIdx]=useState(0);
  const [sel,setSel]=useState(null);
  const [score,setScore]=useState(0);
  const [done,setDone]=useState(false);
  const [show,setShow]=useState(false);

  const submit=i=>{
    if(show)return;
    sound.playClick(); setSel(i); setShow(true);
    if(i===qs[idx].correct){setScore(s=>s+1);sound.playSuccess();}
  };
  const next=()=>{
    sound.playClick();
    if(idx+1>=qs.length)setDone(true);
    else{setIdx(idx+1);setSel(null);setShow(false);}
  };
  const restart=()=>{setIdx(0);setSel(null);setScore(0);setDone(false);setShow(false);sound.playClick();};

  if(done) return (
    <div className="h-full flex items-center justify-center">
      <div className="glass-panel p-8 rounded-3xl max-w-md w-full text-center space-y-3">
        <div className="text-5xl">{score>=qs.length*0.7?'🎉':'📚'}</div>
        <h3 className="text-2xl font-black text-white">Quiz Complete</h3>
        <div className="text-4xl font-black text-orange-400">{score} / {qs.length}</div>
        <p className="text-sm text-slate-400">
          {score===qs.length?'Perfect! You have mastered proportional reasoning.':
           score>=qs.length*0.7?'Great work — review the few you missed.':
           'Keep exploring the tabs and try again!'}
        </p>
        <button className="btn btn-orange px-6 py-2" onClick={restart}>Try Again</button>
      </div>
    </div>
  );

  const q=qs[idx];
  const isCorrect=sel===q.correct;

  return (
    <div className="h-full flex items-center justify-center overflow-y-auto pr-1">
      <div className="glass-panel p-5 rounded-3xl max-w-xl w-full space-y-3">
        <div className="flex justify-between items-center text-sm">
          <span className="text-slate-400 font-semibold">Question {idx+1} of {qs.length}</span>
          <span className="bg-slate-800 text-orange-400 font-bold px-3 py-1 rounded-full">Score: {score}</span>
        </div>
        <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-orange-500 to-amber-400 transition-all" style={{width:`${((idx+(show?1:0))/qs.length)*100}%`}}/>
        </div>
        <h4 className="text-base font-bold text-white leading-snug">{q.q}</h4>
        <div className="space-y-2">
          {q.options.map((o,i)=>{
            let cls='w-full text-left px-3 py-2.5 rounded-xl border-2 text-sm font-semibold transition flex items-center gap-2.5 cursor-pointer ';
            if(show){
              if(i===q.correct) cls+='bg-emerald-600/25 border-emerald-400 text-emerald-100';
              else if(i===sel) cls+='bg-red-600/25 border-red-400 text-red-100';
              else cls+='bg-slate-800/40 border-slate-700 text-slate-500';
            }else cls+='bg-slate-800 border-slate-600 text-white hover:border-orange-400 hover:bg-orange-600/15';
            return (
              <button key={i} className={cls} onClick={()=>submit(i)} disabled={show}>
                <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-sm font-black flex-shrink-0 ${
                  show&&i===q.correct?'bg-emerald-500 text-white':
                  show&&i===sel?'bg-red-500 text-white':'bg-orange-600 text-white'
                }`}>{String.fromCharCode(65+i)}</span>
                <span>{o}</span>
              </button>
            );
          })}
        </div>
        {show && (
          <div className={`p-3 rounded-xl text-sm animate-fade-in leading-relaxed ${
            isCorrect?'bg-emerald-500/15 border border-emerald-500/40 text-emerald-200':'bg-amber-500/15 border border-amber-500/40 text-amber-100'
          }`}>
            <div className="font-bold mb-1 text-base">{isCorrect?'✅ Correct!':'❌ Incorrect'}</div>
            <div className="text-sm opacity-95">{isCorrect?q.exp:q.wrong}</div>
            {!isCorrect && (
              <div className="mt-2 pt-2 border-t border-amber-500/30 text-sm text-emerald-300">
                <strong>Right answer:</strong> {q.options[q.correct]}<br/>{q.exp}
              </div>
            )}
            <button className="btn btn-orange px-5 py-1.5 mt-2" onClick={next}>
              {idx+1<qs.length?'Next Question →':'See Results'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
