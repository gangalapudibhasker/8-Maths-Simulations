<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(600,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}
const sound = new SoundEngine();

/* Egyptian landmarks — symbols matching the textbook (powers of 10)
   1 = | stroke    10 = ∩ heel    100 = 𓍢 coil    1000 = 𓆼 lotus
   10⁴ = 𓂭 finger  10⁵ = 𓆐 tadpole  10⁶ = 𓁨 man  10⁷ = ☀ sun */
const EG_DISP = [
  {v:10000000, label:'10⁷', sym:'☀',  name:'10,000,000 (sun)',     color:'#fbbf24'},
  {v:1000000,  label:'10⁶', sym:'𓁨', name:'1,000,000 (man)',      color:'#a78bfa'},
  {v:100000,   label:'10⁵', sym:'𓆐', name:'100,000 (tadpole)',    color:'#ec4899'},
  {v:10000,    label:'10⁴', sym:'𓂭', name:'10,000 (finger)',      color:'#f472b6'},
  {v:1000,     label:'10³', sym:'𓆼', name:'1,000 (lotus)',        color:'#f59e0b'},
  {v:100,      label:'10²', sym:'𓍢', name:'100 (coil)',           color:'#fb923c'},
  {v:10,       label:'10',  sym:'∩',  name:'10 (heel)',            color:'#10b981'},
  {v:1,        label:'1',   sym:'|',  name:'1 (stroke)',           color:'#3b82f6'},
];

function toEgyptian(n){
  const parts=[];
  let rem=n;
  for(const e of EG_DISP){
    const c=Math.floor(rem/e.v);
    if(c>0){ parts.push({...e, count:c}); rem-=c*e.v; }
  }
  return parts;
}

function fromEgyptianParts(parts){
  return parts.reduce((s,p)=>s+p.count*p.v,0);
}

/* Base-5 landmarks */
const B5 = [
  {v:125, label:'125', shape:'chip-125', name:'△ 125'},
  {v:25, label:'25', shape:'chip-25', name:'□ 25'},
  {v:5, label:'5', shape:'chip-5', name:'⬡ 5'},
  {v:1, label:'1', shape:'chip-1', name:'○ 1'},
];
function toBase5(n){
  const parts=[];
  let rem=n;
  for(const e of B5){
    const c=Math.floor(rem/e.v);
    if(c>0){ parts.push({...e, count:c}); rem-=c*e.v; }
  }
  return parts;
}

  const [dark, setDark] = useState(true);

  useEffect(()=>{ sound.setMuted(muted); },[muted]);
  useEffect(()=>{ document.documentElement.classList.toggle('dark', dark); },[dark]);

  useEffect(()=>{
    const onFsChange = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange', onFsChange);
    return () => document.removeEventListener('fullscreenchange', onFsChange);
  },[]);

  const toggleFullscreen = () => {
    sound.playClick();
    const el = document.querySelector('.simulation-container');
    if (!document.fullscreenElement) {
      (el || document.documentElement).requestFullscreen?.().catch(()=>{});
    } else {
      document.exitFullscreen?.().catch(()=>{});
    }
  };

  const tabs = [
    {id:'intro', label:'0. Overview', icon:'📖'},
    {id:'roman', label:'1. Roman Practice', icon:'🏛️'},
    {id:'gumulgal', label:'2. Q1–Q2 Gumulgal', icon:'🏝️'},
    {id:'egyptian-add', label:'3. Egyptian', icon:'𓂀'},
    {id:'base5-add', label:'4. Base-5', icon:'⬡'},
    {id:'base4', label:'5. Base-4', icon:'④'},
    {id:'abacus', label:'6. Abacus', icon:'🧮'},
    {id:'mesopotamia', label:'7. Mesopotamian', icon:'𒀭'},
    {id:'mayan', label:'8. Mayan', icon:'🗿'},
    {id:'chinese', label:'9. Chinese', icon:'🥢'},

/* ===== TAB 1: Gumulgal ===== */
function GumulgalTab(){
  const [n, setN] = useState(9);
  const [showQ1, setShowQ1] = useState(false);
  const [exprA, setExprA] = useState('ukasar-ukasar-ukasar-ukasar-urapon');
  const [exprB, setExprB] = useState('ukasar-ukasar-ukasar-urapon');
  const [op, setOp] = useState('+');
  const [result, setResult] = useState(null);

  const toGum = (x) => {
    if (x <= 0) return '—';
    const parts = [];
    for (let i = 0; i < Math.floor(x / 2); i++) parts.push('ukasar');
    if (x % 2) parts.push('urapon');
    return parts.join('-');
  };
  const fromGum = (str) => {
    if (!str) return NaN;
    const tokens = str.toLowerCase().replace(/\s/g, '').split(/-+/).filter(Boolean);
    let total = 0;
    for (const t of tokens) {
      if (t === 'ukasar') total += 2;
      else if (t === 'urapon') total += 1;
      else return NaN;
    }
    return total;
  };
  const name = toGum(n);
  const examples = [
    { a: 'ukasar-ukasar-ukasar-ukasar-urapon', b: 'ukasar-ukasar-ukasar-urapon', op: '+', label: '(i) +' },
    { a: 'ukasar-ukasar-ukasar-ukasar-urapon', b: 'ukasar-ukasar-ukasar', op: '-', label: '(ii) −' },
    { a: 'ukasar-ukasar-ukasar-ukasar-urapon', b: 'ukasar-ukasar', op: '×', label: '(iii) ×' },
    { a: 'ukasar-ukasar-ukasar-ukasar-ukasar-ukasar-ukasar-ukasar', b: 'ukasar-ukasar', op: '÷', label: '(iv) ÷' },
  ];
  const compute = () => {
    sound.playClick();
    const va = fromGum(exprA), vb = fromGum(exprB);
    if (isNaN(va) || isNaN(vb)) { setResult({ error: 'Invalid Gumulgal name' }); return; }
    let r;
    if (op === '+') r = va + vb;
    else if (op === '-') r = va - vb;
    else if (op === '×') r = va * vb;
    else r = vb !== 0 ? Math.floor(va / vb) : NaN;
    if (isNaN(r) || r < 0) { setResult({ error: 'Result not representable' }); return; }
    setResult({ va, vb, r, name: toGum(r) });
    sound.playSuccess();
  };

  return (
    <div className="h-full overflow-y-auto pr-1 space-y-4">
      <div className="glass-panel p-4 rounded-2xl">
        <h3 className="text-base font-bold text-orange-400 mb-1">Q1 — Different Number Names for Different Objects</h3>
        <p className="text-xs text-slate-300 mb-3">Page 60 — A group of indigenous people in a Pacific island use different sequences of number names to count different objects. Why do you think they do this?</p>
        <button className="btn btn-slate px-3 py-1.5 mb-2" onClick={() => { setShowQ1(!showQ1); sound.playClick(); }}>
          {showQ1 ? 'Hide Answer' : 'Show Answer'}
        </button>
        {showQ1 && (
          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 leading-relaxed animate-fade-in">
            <strong className="text-emerald-400">Answer:</strong> They do this because their counting systems evolved based on their daily needs, culture, traditions and the environment around them. Different sequences help them count objects in the most convenient and meaningful way for their lives.
          </div>
        )}
      </div>

      <div className="glass-panel p-4 rounded-2xl">
        <h3 className="text-base font-bold text-orange-400 mb-1">Gumulgal Counting System</h3>
        <p className="text-xs text-slate-300 mb-3">Page 60–61 — An extension of counting by 2s. <strong>urapon = 1</strong>, <strong>ukasar = 2</strong>.</p>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label className="text-xs text-slate-400 block mb-1">Number: <span className="text-orange-400 font-bold">{n}</span></label>
            <input type="range" min="1" max="20" value={n} onChange={e => setN(+e.target.value)} className="w-full accent-orange-500 cursor-pointer" />
            <div className="mt-3 text-center">
              <div className="text-lg font-bold text-orange-400 font-mono break-all px-2">{name}</div>
              <div className="flex flex-wrap justify-center gap-1.5 mt-3">
                {Array.from({ length: Math.floor(n / 2) }).map((_, i) => (
                  <div key={i} className="group-ring">
                    <div className="w-4 h-4 rounded-full" style={{ background: 'radial-gradient(circle at 30% 30%,#fbbf24,#ea580c)' }} />
                    <div className="w-4 h-4 rounded-full" style={{ background: 'radial-gradient(circle at 30% 30%,#fbbf24,#ea580c)' }} />
                  </div>
                ))}
                {n % 2 === 1 && (
                  <div className="group-ring">
                    <div className="w-4 h-4 rounded-full" style={{ background: 'radial-gradient(circle at 30% 30%,#fbbf24,#ea580c)' }} />
                  </div>
                )}
              </div>
              <p className="text-[11px] text-slate-400 mt-2">{Math.floor(n / 2)} × ukasar {n % 2 ? '+ 1 urapon' : ''} = {n}</p>
            </div>
          </div>
          <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 space-y-2 text-xs text-slate-300">
            <div><span className="text-amber-400 font-bold">urapon</span> = 1 (a single unit)</div>
            <div><span className="text-amber-400 font-bold">ukasar</span> = 2 (a pair)</div>
            <div className="pt-2 border-t border-slate-700">Names are chained with hyphens:<br />e.g. ukasar-ukasar-urapon = 2+2+1 = 5</div>
            <div className="text-slate-400">This is like counting only in groups of 2 — related to a base-2 idea.</div>
          </div>
        </div>
      </div>

      <div className="glass-panel p-4 rounded-2xl">
        <h4 className="text-sm font-bold text-orange-400 mb-2">Figure it Out — Arithmetic (page 61)</h4>
        <p className="text-[11px] text-slate-400 mb-3">Perform +, −, ×, ÷ without converting to Hindu numerals first — then check.</p>
        <div className="flex flex-wrap gap-2 mb-3">
          {examples.map((ex, i) => (
            <button key={i} className="btn btn-slate px-2.5 py-1 text-[11px]"
              onClick={() => { setExprA(ex.a); setExprB(ex.b); setOp(ex.op); sound.playClick(); }}>
              {ex.label}
            </button>
          ))}
        </div>
        <div className="space-y-2 mb-3">

/* ===== TAB 2: Roman ===== */
function RomanTab(){
  const MAP = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  const toRoman = (n) => {
    if (n <= 0 || n > 3999) return '—';
    let r = '', x = n;
    for (const [v, s] of MAP) { while (x >= v) { r += s; x -= v; } }
    return r;
  };
  const fromRoman = (str) => {
    if (!str) return NaN;
    const s = str.toUpperCase().replace(/\s/g, '');
    let i = 0, total = 0;
    const val = { M: 1000, D: 500, C: 100, L: 50, X: 10, V: 5, I: 1 };
    while (i < s.length) {
      const cur = val[s[i]] || 0, next = val[s[i + 1]] || 0;
      if (next > cur) { total += next - cur; i += 2; }
      else { total += cur; i += 1; }
    }
    return total;
  };
  const [num, setNum] = useState(27);
  const [a, setA] = useState('LXXXVII');
  const [b, setB] = useState('LXXVIII');
  const [addResult, setAddResult] = useState(null);
  const [multA, setMultA] = useState('V');
  const [multB, setMultB] = useState('L');
  const [multResult, setMultResult] = useState(null);

  const roman = toRoman(num);
  const breakdown = (() => {
    let n = num, parts = [];
    for (const [val, sym] of MAP) {
      while (n >= val) { parts.push({ sym, val }); n -= val; }
    }
    return parts;
  })();

  const doAdd = () => {
    sound.playClick();
    const va = fromRoman(a), vb = fromRoman(b);
    if (isNaN(va) || isNaN(vb)) { setAddResult({ error: 'Invalid Roman numeral' }); return; }
    const sum = va + vb;
    setAddResult({ va, vb, sum, roman: toRoman(sum) });
    sound.playSuccess();
  };
  const doMult = () => {
    sound.playClick();
    const va = fromRoman(multA), vb = fromRoman(multB);
    if (isNaN(va) || isNaN(vb)) { setMultResult({ error: 'Invalid' }); return; }
    const prod = va * vb;
    setMultResult({ va, vb, prod, roman: toRoman(prod) });
    sound.playSuccess();
  };

  return (
    <div className="h-full overflow-y-auto pr-1 space-y-4">
      <div className="glass-panel p-4 rounded-2xl">
        <h3 className="text-base font-bold text-orange-400 mb-1">Roman Numerals Explorer</h3>
        <p className="text-xs text-slate-300 mb-3">Page 60 — Convert numbers, add and multiply landmark values the way the textbook asks.</p>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label className="text-xs text-slate-400 block mb-1">Number: <span className="text-orange-400 font-bold">{num}</span></label>
            <input type="range" min="1" max="2000" value={num} onChange={e => setNum(+e.target.value)} className="w-full accent-orange-500 cursor-pointer" />
            <div className="flex justify-between text-[10px] text-slate-500 mt-0.5"><span>1</span><span>500</span><span>1000</span><span>2000</span></div>
            <div className="mt-3 text-center">
              <div className="text-3xl font-black text-orange-400 font-mono tracking-wider">{roman}</div>
              <div className="flex flex-wrap justify-center gap-1.5 mt-2">
                {breakdown.map((p, i) => (
                  <span key={i} className="eg-chip" style={{ fontSize: '0.85rem' }}>{p.sym}</span>
                ))}
              </div>
              <p className="text-[11px] text-slate-400 mt-1">{breakdown.map(p => p.val).join(' + ')} = {num}</p>
            </div>
          </div>
          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">

                  <tr key={s}>

/* ===== TAB 4: Decimal Abacus ===== */
function AbacusTab(){
  // Interactive single abacus: counters per place (0–15 allowed, carry when ≥10)
  const [ones, setOnes] = useState(6);
  const [tens, setTens] = useState(2);
  const [hundreds, setHundreds] = useState(4);
  const [thousands, setThousands] = useState(3);
  const [mode, setMode] = useState('explore'); // explore | add
  const [step, setStep] = useState(0); // for guided addition animation
  const [addLeft, setAddLeft] = useState(2907);
  const [addRight, setAddRight] = useState(43);

  const total = thousands * 1000 + hundreds * 100 + tens * 10 + ones;

  const toPlaces = (n) => ({
    th: Math.floor(Math.min(Math.max(n, 0), 9999) / 1000),
    h: Math.floor((Math.min(Math.max(n, 0), 9999) % 1000) / 100),
    t: Math.floor((Math.min(Math.max(n, 0), 9999) % 100) / 10),
    o: Math.min(Math.max(n, 0), 9999) % 10,
  });
  const leftP = toPlaces(addLeft);
  const rightP = toPlaces(addRight);
  // Combined before carry
  const combO = leftP.o + rightP.o;
  const combT = leftP.t + rightP.t;
  const combH = leftP.h + rightP.h;
  const combTh = leftP.th + rightP.th;
  // After successive carries
  let cO = combO, cT = combT, cH = combH, cTh = combTh;
  if (cO >= 10) { cT += Math.floor(cO / 10); cO = cO % 10; }
  if (cT >= 10) { cH += Math.floor(cT / 10); cT = cT % 10; }
  if (cH >= 10) { cTh += Math.floor(cH / 10); cH = cH % 10; }
  const sumVal = addLeft + addRight;

  const addBead = (place) => {
    sound.playClick();
    if (place === 'ones') setOnes(v => Math.min(v + 1, 15));
    if (place === 'tens') setTens(v => Math.min(v + 1, 15));
    if (place === 'hundreds') setHundreds(v => Math.min(v + 1, 15));
    if (place === 'thousands') setThousands(v => Math.min(v + 1, 15));
  };
  const removeBead = (place) => {
    sound.playClick();
    if (place === 'ones') setOnes(v => Math.max(v - 1, 0));
    if (place === 'tens') setTens(v => Math.max(v - 1, 0));
    if (place === 'hundreds') setHundreds(v => Math.max(v - 1, 0));
    if (place === 'thousands') setThousands(v => Math.max(v - 1, 0));
  };
  const clearAll = () => { sound.playClick(); setOnes(0); setTens(0); setHundreds(0); setThousands(0); };
  const setExample = (n) => {
    sound.playClick();
    setThousands(Math.floor(n / 1000));
    setHundreds(Math.floor((n % 1000) / 100));
    setTens(Math.floor((n % 100) / 10));
    setOnes(n % 10);
  };
  const doCarry = () => {
    sound.playSuccess();
    let o = ones, t = tens, h = hundreds, th = thousands;
    if (o >= 10) { t += Math.floor(o / 10); o = o % 10; }
    if (t >= 10) { h += Math.floor(t / 10); t = t % 10; }
    if (h >= 10) { th += Math.floor(h / 10); h = h % 10; }
    setOnes(o); setTens(t); setHundreds(h); setThousands(th);
  };

  // Textbook addition example state
  const left = { th: 2, h: 9, t: 0, o: 7 };   // 2907
  const right = { th: 0, h: 0, t: 4, o: 3 };  // 43
  // After combining before carry: th=2, h=9, t=4, o=10
  // After carry: th=2, h=9, t=5, o=0 → 2950

  const Bead = () => (
    <div style={{
      width: 18, height: 18, borderRadius: '50%',
      background: 'radial-gradient(circle at 32% 28%, #fecaca, #dc2626 55%, #7f1d1d)',
      boxShadow: '0 2px 4px rgba(0,0,0,.35), inset 0 1px 2px rgba(255,255,255,.4)',
      flexShrink: 0
    }} />
  );

  const AbacusBoard = ({ th, h, t, o, interactive, title, wide }) => (
    <div style={{
      background: 'linear-gradient(180deg, #fef9c3 0%, #fde68a 100%)',
      borderRadius: 16, padding: '12px 16px',
      border: '3px solid #ca8a04',
      boxShadow: 'inset 0 0 20px rgba(0,0,0,.08), 0 8px 20px rgba(0,0,0,.25)',
      minWidth: wide ? 280 : 200
    }}>
      {title && <div style={{ textAlign: 'center', fontSize: 11, fontWeight: 700, color: '#92400e', marginBottom: 6 }}>{title}</div>}
      {[
        { label: '1000', val: th, place: 'thousands' },
        { label: '100', val: h, place: 'hundreds' },
        { label: '10', val: t, place: 'tens' },
        { label: '1', val: o, place: 'ones' },
      ].map(row => (
        <div key={row.label} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
          <div style={{
            width: 36, textAlign: 'right', fontSize: 11, fontWeight: 800,
            color: '#78350f', fontFamily: 'ui-monospace, monospace'
          }}>{row.label}</div>
          <div style={{
            flex: 1, height: 28, borderBottom: '2.5px solid #1e3a5f',
            display: 'flex', alignItems: 'center', gap: 3, paddingLeft: 4, position: 'relative'
          }}>
            {/* vertical guide line on left like textbook */}
            <div style={{ position: 'absolute', left: 0, top: -6, bottom: -6, width: 2, background: '#1e3a5f' }} />
            {Array.from({ length: Math.min(row.val, 12) }).map((_, i) => <Bead key={i} />)}
            {row.val > 12 && <span style={{ fontSize: 10, color: '#78350f', fontWeight: 700 }}>+{row.val - 12}</span>}
          </div>
          {interactive && (
            <div style={{ display: 'flex', gap: 2 }}>
              <button onClick={() => addBead(row.place)} className="btn btn-orange" style={{ padding: '2px 7px', fontSize: 12 }}>+</button>
              <button onClick={() => removeBead(row.place)} className="btn btn-slate" style={{ padding: '2px 7px', fontSize: 12 }}>−</button>
            </div>
          )}
        </div>
      ))}
    </div>
  );

  return (
    <div className="h-full overflow-y-auto pr-1 space-y-4">
      <div className="glass-panel p-4 rounded-2xl">
        <h3 className="text-base font-bold text-orange-400 mb-1">Abacus that Makes Use of the Decimal System</h3>
        <p className="text-xs text-slate-300 mb-3">
          A board with horizontal lines for powers of 10. Counters (beads) on each line show how many times that power appears — the same grouping idea as Egyptian landmarks.
        </p>

        <div className="flex flex-wrap gap-2 mb-3">
          <button className={`btn px-3 py-1.5 ${mode === 'explore' ? 'btn-orange' : 'btn-slate'}`} onClick={() => { setMode('explore'); sound.playClick(); }}>Explore Abacus</button>
          <button className={`btn px-3 py-1.5 ${mode === 'add' ? 'btn-orange' : 'btn-slate'}`} onClick={() => { setMode('add'); setStep(0); sound.playClick(); }}>Addition (custom)</button>
        </div>

        {mode === 'explore' && (
          <div className="space-y-3 animate-fade-in">
            <div className="flex flex-wrap gap-2 items-center">
              <span className="text-xs text-slate-400">Quick set:</span>
              {[3426, 1000, 555, 42, 7].map(n => (
                <button key={n} className="btn btn-slate px-2.5 py-1 text-[11px]" onClick={() => setExample(n)}>{n}</button>
              ))}
              <button className="btn btn-slate px-2.5 py-1 text-[11px]" onClick={clearAll}>Clear</button>
              <button className="btn btn-emerald px-2.5 py-1 text-[11px]" onClick={doCarry}>Carry (≥10)</button>
            </div>
            <div className="flex flex-wrap gap-4 items-start justify-center">
              <AbacusBoard th={thousands} h={hundreds} t={tens} o={ones} interactive title="Your Abacus (click + / −)" wide />
              <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-2 max-w-xs">
                <div className="text-2xl font-black text-orange-400 font-mono text-center">{total}</div>
                <p className="text-center text-slate-400">
                  {thousands}×1000 + {hundreds}×100 + {tens}×10 + {ones}×1
                </p>
                <p><strong className="text-amber-400">How to use:</strong> Click <strong>+</strong> to place a counter on a line, <strong>−</strong> to remove. When any line has 10 or more, click <strong>Carry</strong> — 10 counters on a line become 1 on the next higher line.</p>
                <p className="text-slate-400">This is exactly how the abacus in Fig. 3.1 of the textbook works.</p>
              </div>
            </div>
          </div>
        )}

        {mode === 'add' && (
          <div className="space-y-3 animate-fade-in">
            <div className="flex flex-wrap gap-3 items-end justify-center mb-2">
              <div>
                <label className="text-[10px] text-slate-400 block mb-0.5">Left number</label>
                <input type="number" min="0" max="9999" value={addLeft}
                  onChange={e => { setAddLeft(Math.min(9999, Math.max(0, +e.target.value || 0))); setStep(0); }}
                  className="input-dark w-24 text-center font-mono" />
              </div>
              <span className="text-xl text-orange-400 font-bold pb-1">+</span>
              <div>
                <label className="text-[10px] text-slate-400 block mb-0.5">Right number</label>
                <input type="number" min="0" max="9999" value={addRight}
                  onChange={e => { setAddRight(Math.min(9999, Math.max(0, +e.target.value || 0))); setStep(0); }}
                  className="input-dark w-24 text-center font-mono" />
              </div>
              <button className="btn btn-slate px-3 py-1.5 text-[11px]" onClick={() => { setAddLeft(2907); setAddRight(43); setStep(0); sound.playClick(); }}>Textbook: 2907+43</button>
            </div>
            <p className="text-xs text-slate-300 text-center">Counters on left and right of a vertical partition, then brought together. Enter any numbers (0–9999).</p>
            <div className="flex flex-wrap gap-2 justify-center">
              {['Show both sides', 'Combine lines', 'Carry', 'Final sum'].map((label, i) => (
                <button key={i} className={`btn px-3 py-1.5 text-[11px] ${step === i ? 'btn-orange' : 'btn-slate'}`}
                  onClick={() => { setStep(i); sound.playClick(); }}>{i + 1}. {label}</button>
              ))}
            </div>

            <div className="flex flex-wrap gap-4 justify-center items-start">
              {step === 0 && (
                <>
                  <AbacusBoard th={leftP.th} h={leftP.h} t={leftP.t} o={leftP.o} title={`${addLeft} (left)`} />
                  <div className="text-2xl text-slate-400 self-center font-bold">|</div>
                  <AbacusBoard th={rightP.th} h={rightP.h} t={rightP.t} o={rightP.o} title={`${addRight} (right)`} />
                </>
              )}
              {step === 1 && (
                <AbacusBoard th={combTh} h={combH} t={combT} o={combO} title="Combined (before carry)" wide />
              )}
              {step === 2 && (
                <div className="text-center space-y-2">
                  <AbacusBoard th={cTh} h={cH} t={cT} o={cO} title="After carry" wide />
                  <p className="text-xs text-amber-400">
                    {combO >= 10 ? `${leftP.o} + ${rightP.o} = ${combO} ones → ${cO} ones, carry ${Math.floor(combO/10)} to tens. ` : ''}
                    {combT >= 10 || (combO >= 10 && leftP.t + rightP.t + Math.floor(combO/10) >= 10) ? 'Tens/hundreds carried similarly.' : 'No further carry needed.'}
                  </p>
                </div>
              )}
              {step === 3 && (
                <div className="text-center space-y-2">
                  <AbacusBoard th={cTh} h={cH} t={cT} o={cO} title={`Sum = ${sumVal}`} wide />
                  <div className="text-2xl font-black text-emerald-400">{addLeft} + {addRight} = {sumVal} ✓</div>
                </div>
              )}
            </div>
            <p className="text-[11px] text-slate-400 text-center max-w-lg mx-auto">
              <strong className="text-amber-400">Hint from the book:</strong> The counters along each line were brought together. When the total in a line exceeded 10, those 10 became one counter on the next higher line.
            </p>
          </div>
        )}
      </div>

      <div className="glass-panel p-4 rounded-2xl text-xs text-slate-300 space-y-2">
        <h4 className="text-sm font-bold text-orange-400">III. Shortcomings of the Egyptian System</h4>
        <p>Despite efficient representations up to a crore (10⁷) and relatively easy computations, the Egyptian system had a drawback:</p>
        <p>If larger numbers were needed, an unending sequence of new symbols for higher powers of 10 would be required. The original challenge of number representation resurfaced in a different form.</p>
        <p className="text-emerald-400 font-semibold">The next idea — a place-value system with a fixed set of digits and zero — solves this and simplifies both representation and calculation.</p>
      </div>
    </div>
  );
}

/* ===== TAB 5: Mesopotamian (Base-60) ===== */
function MesopotamiaTab(){
  const [num, setNum] = useState(640);
  const [showCompact, setShowCompact] = useState(true);

  // Convert decimal to base-60 digits (place values)
  const toBase60 = (n) => {
    n = Math.max(0, Math.floor(n));
    if (n === 0) return [0];
    const digits = [];
    while (n > 0) {
      digits.unshift(n % 60);
      n = Math.floor(n / 60);
    }
    return digits;
  };

  // Render a single sexagesimal "digit" 0–59 using ▼ (1) and ◀ (10) style symbols
  const renderDigit = (d) => {
    if (d === 0) return <span className="text-slate-500 font-mono text-sm px-1">◇</span>; // placeholder zero
    const tens = Math.floor(d / 10);
    const ones = d % 10;
    return (
      <span className="inline-flex flex-wrap items-center gap-0.5 mx-0.5">
        {Array.from({ length: tens }).map((_, i) => (
          <span key={'t'+i} style={{ color: '#fbbf24', fontSize: '1.1rem', fontWeight: 900 }}>◀</span>
        ))}
        {Array.from({ length: ones }).map((_, i) => (
          <span key={'o'+i} style={{ color: '#fb923c', fontSize: '0.95rem', fontWeight: 900 }}>▼</span>
        ))}
      </span>
    );
  };

  const digits = toBase60(num);
  const powers = digits.map((_, i) => Math.pow(60, digits.length - 1 - i));

  const examples = [
    { n: 63, note: '1×60 + 3' },
    { n: 132, note: '2×60 + 12' },
    { n: 200, note: '3×60 + 20' },
    { n: 60, note: '1×60 + 0' },
    { n: 3605, note: '1×3600 + 0×60 + 5' },
    { n: 640, note: '10×60 + 40' },
    { n: 7530, note: '2×3600 + 5×60 + 30' },
  ];

  return (
    <div className="h-full overflow-y-auto pr-1 space-y-4">
      <div className="glass-panel p-4 rounded-2xl">
        <h3 className="text-base font-bold text-orange-400 mb-1">I. The Mesopotamian Number System (Base-60)</h3>
        <p className="text-xs text-slate-300 mb-3">
          Ancient Mesopotamia developed a <strong>sexagesimal</strong> (base-60) system. Landmarks are powers of 60: 1, 60, 3600, 216000…
          Its influence remains in our time units: 60 seconds = 1 minute, 60 minutes = 1 hour.
        </p>
        <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 mb-3">
          <div className="text-[10px] text-amber-400 font-bold mb-2">Symbols (textbook style)</div>
          <div className="flex flex-wrap gap-4 items-center text-xs text-slate-300">
            <span><span style={{color:'#fb923c',fontWeight:900,fontSize:'1.2rem'}}>▼</span> = 1</span>
            <span><span style={{color:'#fbbf24',fontWeight:900,fontSize:'1.2rem'}}>◀</span> = 10</span>
            <span><span className="text-slate-500 font-mono">◇</span> = placeholder (blank / zero)</span>
            <span className="text-slate-400">Numbers 1–59 built from ▼ and ◀ only</span>
          </div>
          <div className="flex flex-wrap gap-2 mt-2 text-[11px]">
            {[1,2,3,5,9,10,11,20,30,40,50,59].map(d => (
              <div key={d} className="bg-slate-800 px-2 py-1 rounded-lg flex items-center gap-1">
                <span className="text-slate-400">{d}:</span> {renderDigit(d)}
              </div>
            ))}
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label className="text-xs text-slate-400">Number: <strong className="text-orange-400">{num}</strong></label>
            <input type="range" min="1" max="10000" value={num} onChange={e => setNum(+e.target.value)} className="w-full accent-orange-500 cursor-pointer mb-2" />
            <div className="flex flex-wrap gap-2.5 mb-2">
              {examples.map(ex => (
                <button key={ex.n} className={`btn px-3 py-1.5 text-[11px] ${num===ex.n?'btn-orange':'btn-slate'}`}
                  onClick={() => { setNum(ex.n); sound.playClick(); }}>{ex.n}</button>
              ))}
            </div>
          </div>
          <div className="bg-slate-900/80 p-4 rounded-xl border border-orange-500/50 text-center">
            <div className="text-[10px] text-slate-400 mb-1">Mesopotamian (positional base-60)</div>
            <div className="flex flex-wrap justify-center items-end gap-1 min-h-[48px]">
              {digits.map((d, i) => (
                <div key={i} className="text-center">
                  <div className="bg-slate-800 rounded-lg px-2 py-1.5 border border-slate-700 min-w-[40px]">
                    {renderDigit(d)}
                  </div>
                  <div className="text-[9px] text-slate-500 mt-0.5">60<sup>{digits.length-1-i}</sup></div>
                </div>
              ))}
            </div>
            <div className="text-xs text-slate-300 mt-2 font-mono">
              {digits.map((d,i) => `${d}×${powers[i]}`).join(' + ')} = {num}
            </div>
          </div>
        </div>
      </div>

      <div className="glass-panel p-4 rounded-2xl">
        <h3 className="text-base font-bold text-orange-400 mb-1">Place Value — The Big Idea</h3>
        <p className="text-xs text-slate-300 mb-3">
          Instead of inventing new symbols for every higher landmark, the Mesopotamians used <strong>position</strong>:
          the rightmost group = ones, next = 60s, next = 3600s, and so on. A blank (later a placeholder ◇) marked a missing power.
        </p>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
            <div className="text-amber-400 font-bold mb-1">Example: 640</div>
            <p>640 = 10×60 + 40</p>
            <div className="flex items-center gap-2 mt-2 justify-center">
              {renderDigit(10)} <span className="text-slate-500">|</span> {renderDigit(40)}
            </div>
            <p className="text-slate-400 mt-1 text-center">ten 60s and forty 1s</p>
          </div>
          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
            <div className="text-amber-400 font-bold mb-1">Example: 7530</div>
            <p>7530 = 2×3600 + 5×60 + 30</p>
            <div className="flex items-center gap-2 mt-2 justify-center">
              {renderDigit(2)} <span className="text-slate-500">|</span> {renderDigit(5)} <span className="text-slate-500">|</span> {renderDigit(30)}
            </div>
          </div>
        </div>
        <p className="text-[11px] text-emerald-400 mt-3 text-center font-semibold">
          This is a positional (place-value) system — the highest point reached so far in the evolution of number systems.
        </p>
      </div>

      <div className="glass-panel p-4 rounded-2xl">
        <h3 className="text-base font-bold text-orange-400 mb-1">Figure it Out — Represent these numbers</h3>
        <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
          {[63, 132, 200, 60, 3605].map(n => {
            const digs = toBase60(n);
            return (
              <div key={n} className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-center">
                <div className="text-orange-400 font-bold text-sm mb-1">{n}</div>
                <div className="flex flex-wrap justify-center gap-0.5 min-h-[32px] items-center">
                  {digs.map((d,i) => <span key={i}>{renderDigit(d)}</span>)}
                </div>
                <div className="text-[9px] text-slate-500 mt-1 font-mono">
                  {digs.map((d,i) => d + (digs.length-1-i > 0 ? `·60^${digs.length-1-i}` : '')).join('+')}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="glass-panel p-4 rounded-2xl text-xs text-slate-300 space-y-2">
        <h4 className="text-sm font-bold text-orange-400">Ambiguity & the birth of zero</h4>
        <p>Without clear spacing, the same symbols could be read in different ways (e.g. 1 vs 60 vs 3600 all looked like a single ▼). Later Mesopotamians introduced a <strong>placeholder symbol</strong> (◇) for a blank power of 60 — the ancestor of our zero.</p>
        <p className="text-slate-400">Even then, the placeholder was mainly used in the middle of numbers, not always at the end — so some ambiguity remained.</p>
        <p className="text-emerald-400 font-semibold">A fully developed place-value system with a true zero (usable in any position) would come later — from India.</p>
      </div>
    </div>
  );
}

/* ===== TAB 6: Mayan Number System ===== */
function MayanTab(){
  const [num, setNum] = useState(1660);

  // Mayan places: ones, 20s, 360s (18×20), 7200s (20×360), ...
  // Simplified textbook: 1, 20, 360, 7200, 144000
  const toMayan = (n) => {
    n = Math.max(0, Math.floor(n));
    const places = [];
    const vals = [144000, 7200, 360, 20, 1];
    for (const v of vals) {
      const d = Math.floor(n / v);
      places.push({ v, d });
      n = n % v;
    }
    // trim leading zeros but keep at least ones
    while (places.length > 1 && places[0].d === 0) places.shift();
    return places;
  };

  // Render a Mayan digit 0–19: dots (1) and bars (5), shell for 0
  const renderMayanDigit = (d) => {
    if (d === 0) {
      return (
        <div style={{ width: 36, height: 22, border: '2px solid #fbbf24', borderRadius: '50% / 40%', background: 'rgba(251,191,36,0.15)', margin: '2px auto' }} title="0 (shell)" />
      );
    }
    const bars = Math.floor(d / 5);
    const dots = d % 5;
    return (
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, minHeight: 28 }}>
        <div style={{ display: 'flex', gap: 3 }}>
          {Array.from({ length: dots }).map((_, i) => (
            <div key={i} style={{ width: 8, height: 8, borderRadius: '50%', background: '#f97316' }} />
          ))}
        </div>
        {Array.from({ length: bars }).map((_, i) => (
          <div key={i} style={{ width: 28, height: 5, borderRadius: 2, background: '#fbbf24' }} />
        ))}
      </div>
    );
  };

  const places = toMayan(num);
  const examples = [77, 100, 361, 721, 1660, 20, 5, 19];

  return (
    <div className="h-full overflow-y-auto pr-1 space-y-4">
      <div className="glass-panel p-4 rounded-2xl">
        <h3 className="text-base font-bold text-orange-400 mb-1">II. The Mayan Number System</h3>
        <p className="text-xs text-slate-300 mb-3">
          The Mayan civilisation (Central America, ~3rd–10th centuries CE) independently invented a place-value system and a placeholder for zero (a seashell). It is almost a base-20 system; the third landmark is 360 (18×20), linked to their calendar.
        </p>
        <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 mb-3">
          <div className="text-[10px] text-amber-400 font-bold mb-2">Symbols</div>
          <div className="flex flex-wrap gap-4 items-center text-xs text-slate-300">
            <span className="flex items-center gap-1"><span style={{width:8,height:8,borderRadius:'50%',background:'#f97316',display:'inline-block'}}/> = 1 (dot)</span>
            <span className="flex items-center gap-1"><span style={{width:20,height:5,borderRadius:2,background:'#fbbf24',display:'inline-block'}}/> = 5 (bar)</span>
            <span className="flex items-center gap-1"><span style={{width:20,height:12,border:'2px solid #fbbf24',borderRadius:'50% / 40%',display:'inline-block'}}/> = 0 (shell)</span>
          </div>
          <p className="text-[11px] text-slate-400 mt-2">Symbols are stacked <strong>vertically</strong>: bottom = ones, above = 20s, above that = 360s, then 7200s…</p>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label className="text-xs text-slate-400">Number: <strong className="text-orange-400">{num}</strong></label>
            <input type="range" min="0" max="5000" value={num} onChange={e => setNum(+e.target.value)} className="w-full accent-orange-500 cursor-pointer mb-2" />
            <div className="flex flex-wrap gap-2.5 mb-2">
              {examples.map(n => (
                <button key={n} className={`btn px-3 py-1.5 text-[11px] ${num===n?'btn-orange':'btn-slate'}`}
                  onClick={() => { setNum(n); sound.playClick(); }}>{n}</button>
              ))}
            </div>
          </div>
          <div className="bg-slate-900/80 p-4 rounded-xl border border-orange-500/50 text-center">
            <div className="text-[10px] text-slate-400 mb-2">Mayan (vertical place value)</div>
            <div className="inline-flex flex-col-reverse items-center gap-1 bg-slate-800/80 rounded-xl px-4 py-3 border border-slate-700">
              {places.slice().reverse().map((p, i) => (
                <div key={i} className="flex items-center gap-3">
                  <div className="w-10 text-right text-[9px] text-slate-500 font-mono">{p.v}</div>
                  <div className="min-w-[40px]">{renderMayanDigit(p.d)}</div>
                  <div className="w-8 text-left text-[10px] text-orange-400 font-bold">{p.d}</div>
                </div>

/* ===== TAB: Bases & Place Value ===== */
function toBaseWithPlaces(num, base) {
  if (base === 10) {
    const str = String(num);
    const places = str.split('').map((d, i) => ({
      digit: d,
      power: str.length - 1 - i,
      value: parseInt(d, 10) * Math.pow(10, str.length - 1 - i)
    }));
    return { representation: str, places };
  }
  if (base === 60) {
    const q = Math.floor(num / 60);
    const r = num % 60;
    return {
      representation: q > 0 ? `${q}×60 + ${r}` : String(r),
      places: q > 0
        ? [{ digit: q, power: 1, value: q * 60 }, { digit: r, power: 0, value: r }]
        : [{ digit: r, power: 0, value: r }]
    };
  }
  let n = num;
  const digits = [];
  if (n === 0) digits.push(0);
  while (n > 0) {
    digits.unshift(n % base);
    n = Math.floor(n / base);
  }
  const places = digits.map((d, i) => ({
    digit: d.toString(36).toUpperCase(),
    power: digits.length - 1 - i,
    value: d * Math.pow(base, digits.length - 1 - i)
  }));
  return {
    representation: digits.map(d => d.toString(36).toUpperCase()).join(''),
    places
  };
}

function BasesPlaceValueTab() {
  const [simBase, setSimBase] = useState(10);
  const [simNumber, setSimNumber] = useState(33);
  const [showSteps, setShowSteps] = useState(true);
  const [customBase, setCustomBase] = useState(7);
  const effectiveBase = simBase === 'custom' ? Math.max(2, Math.min(36, customBase)) : simBase;

  return (
    <div className="h-full flex flex-col space-y-4 overflow-y-auto pr-1">

          <div>
            <h3 className="text-base font-bold text-orange-400 mb-1">Base-n Number Visualizer</h3>
            <p className="text-xs text-slate-300 mb-3">Explore how the same quantity is written in different bases and how place values work.</p>
          </div>
          <div className="space-y-4">
            <div>
              <label className="text-xs font-medium text-slate-400 block mb-1">Target Number: <span className="text-orange-400 font-bold">{simNumber}</span></label>
              <input type="range" min="1" max="50" value={simNumber} onChange={e => setSimNumber(parseInt(e.target.value, 10))} className="w-full accent-orange-500 cursor-pointer" />
              <div className="flex justify-between text-[10px] text-slate-500 mt-0.5"><span>1</span><span>25</span><span>50</span></div>
            </div>
            <div>
              <label className="text-xs font-medium text-slate-400 block mb-1">Base (n)</label>
              <div className="flex flex-wrap gap-2">
                {[2, 5, 8, 10, 12, 16, 60].map(b => (
                  <button key={b} onClick={() => { sound.playClick(); setSimBase(b); }}
                    className={`btn px-3 py-1.5 text-xs ${simBase === b ? 'btn-orange' : 'btn-slate'}`}>
                    {b}
                  </button>
                ))}
                <button onClick={() => { sound.playClick(); setSimBase('custom'); }}
                  className={`btn px-3 py-1.5 text-xs ${simBase === 'custom' ? 'btn-orange' : 'btn-slate'}`}>
                  Custom
                </button>
              </div>
              {simBase === 'custom' && (
                <div className="mt-2 flex items-center gap-2">
                  <input type="number" min="2" max="36" value={customBase} onChange={e => setCustomBase(parseInt(e.target.value, 10) || 2)}
                    className="input-dark w-16 text-xs" />
                  <span className="text-xs text-slate-400">(2–36) currently Base {effectiveBase}</span>
                </div>
              )}
            </div>
            <label className="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
              <input type="checkbox" checked={showSteps} onChange={() => setShowSteps(!showSteps)} className="accent-orange-500" />
              <span>Show place-value steps</span>
            </label>
          </div>
        </div>

        <div className="glass-panel p-5 rounded-2xl md:col-span-2 flex flex-col justify-center items-center text-center">
          <span className="text-xs uppercase tracking-widest text-slate-400 font-semibold mb-2">Representation in Base {effectiveBase}</span>
          <div className="text-3xl font-black text-orange-400 font-mono tracking-wider mb-1">
            {baseInfo.representation}
            <span className="text-sm font-normal text-slate-400 ml-2">(Base {effectiveBase})</span>
          </div>
          <p className="text-xs text-slate-300 max-w-md mb-3">
            {effectiveBase === 10 && "Standard decimal system based on powers of 10 (units, tens, hundreds…)."}
            {effectiveBase === 5 && "Base-5 uses landmark powers of 5 (1, 5, 25, 125…)."}
            {effectiveBase === 2 && "Binary (powers of 2) is the foundation of all modern digital computers."}
            {effectiveBase === 60 && "Sexagesimal system of the ancient Mesopotamians — still visible in clocks and angles."}
            {![2,5,10,60].includes(effectiveBase) && `Each place is ${effectiveBase} times the place to its right.`}
          </p>
          {showSteps && baseInfo.places.length > 0 && (
            <div className="w-full max-w-lg mt-2">
              <div className="text-xs font-semibold text-amber-400 mb-2">Place-Value Breakdown</div>
              <div className="flex flex-wrap justify-center gap-2">
                {baseInfo.places.map((p, idx) => (
                  <div key={idx} className="bg-slate-900/80 px-3 py-2 rounded-xl border border-slate-700 text-center animate-fade-in">
                    <div className="text-lg font-black text-orange-400 font-mono">{p.digit}</div>
                    <div className="text-[10px] text-slate-400">× {effectiveBase}<sup>{p.power}</sup></div>
                    <div className="text-xs text-emerald-400 font-bold">= {p.value}</div>
                  </div>
                ))}
              </div>
              <div className="mt-3 text-sm text-slate-300">

        <p className="text-[11px] text-slate-400 mb-3 text-center max-w-xl">
          The empty space you see between clusters is the “gap”. Each complete group of <strong className="text-orange-400">{effectiveBase}</strong> becomes the next place value (just like 10 units become 1 ten).
        </p>
        <div className="flex flex-wrap gap-4 justify-center max-w-4xl items-start p-4 bg-slate-900/60 rounded-xl border border-slate-800 min-h-[120px] max-h-[260px] overflow-y-auto">
          {(() => {
            const groups = [];
            let remaining = simNumber;
            while (remaining >= effectiveBase) {
              groups.push(effectiveBase);
              remaining -= effectiveBase;
            }
            if (remaining > 0) groups.push(remaining);
            return groups.map((gSize, gi) => (
              <div key={gi} className="group-ring" style={{ flexDirection: 'column', alignItems: 'center' }}>
                <div className="flex flex-wrap gap-1 justify-center">
                  {Array.from({ length: gSize }).map((_, i) => (
                    <div key={i} className="w-7 h-7 rounded-lg flex items-center justify-center text-[10px] font-black text-white"
                      style={{ background: 'linear-gradient(135deg,#f97316,#fbbf24)' }}>
                      {i + 1}
                    </div>
                  ))}
                </div>
                <div className="w-full text-center text-[9px] font-bold mt-1" style={{ color: gSize === effectiveBase ? '#fb923c' : '#94a3b8' }}>
                  {gSize === effectiveBase ? `1 group of ${effectiveBase}` : `${gSize} left over`}
                </div>
              </div>
            ));
          })()}
        </div>
        <div className="mt-3 text-xs text-slate-300 text-center max-w-2xl space-y-1">
          <p><strong className="text-orange-400">Why the gap?</strong> When we have a full group of {effectiveBase}, we stop counting units and start a new “place”. That empty space is the visual reminder of the place-value jump.</p>
          <p className="text-slate-400">Example: in base 10, ten single units become one “ten” and leave a gap before the next units begin.</p>
        </div>
      </div>
    </div>
  );
}

/* ===== TAB: Whiteboard ===== */
function WhiteboardTab() {
  const canvasRef = useRef(null);
  const isDrawing = useRef(false);
  const lastPos = useRef({ x: 0, y: 0 });
  const [drawingColor, setDrawingColor] = useState('#f97316');
  const [brushSize, setBrushSize] = useState(4);
  const [dark] = useState(true);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const parent = canvas.parentElement;
    const resize = () => {
      canvas.width = parent.clientWidth;
      canvas.height = parent.clientHeight;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };
    resize();
    window.addEventListener('resize', resize);
    return () => window.removeEventListener('resize', resize);
  }, []);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
    const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);
    return { x: clientX - rect.left, y: clientY - rect.top };
  };
  const startDrawing = (e) => {
    e.preventDefault();
    isDrawing.current = true;
    const pos = getPos(e);
    lastPos.current = pos;
    const ctx = canvasRef.current.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  };
  const stopDrawing = () => { isDrawing.current = false; };
  const draw = (e) => {
    if (!isDrawing.current || !canvasRef.current) return;
    e.preventDefault();
    const pos = getPos(e);
    const ctx = canvasRef.current.getContext('2d');
    ctx.lineWidth = brushSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = drawingColor;
    ctx.beginPath();
    ctx.moveTo(lastPos.current.x, lastPos.current.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    lastPos.current = pos;
  };
  const clearWhiteboard = () => {
    sound.playClick();
    const canvas = canvasRef.current;
    if (canvas) {
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  };

  return (
    <div className="h-full flex flex-col space-y-3 overflow-hidden">
      <div className="glass-panel px-4 py-2 rounded-xl flex items-center justify-between flex-shrink-0 flex-wrap gap-2">
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold text-slate-300">Color:</span>
          {['#f97316', '#3b82f6', '#10b981', '#eab308', '#ec4899', '#ffffff', '#000000'].map(c => (
            <button key={c} onClick={() => { sound.playClick(); setDrawingColor(c); }}
              className="w-6 h-6 rounded-full border-2 transition cursor-pointer"
              style={{ backgroundColor: c, borderColor: drawingColor === c ? '#fff' : 'transparent', transform: drawingColor === c ? 'scale(1.1)' : 'scale(1)' }}
              aria-label={`Select color ${c}`} />
          ))}
        </div>
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold text-slate-300">Size:</span>
          {[2, 4, 8, 14].map(s => (
            <button key={s} onClick={() => { sound.playClick(); setBrushSize(s); }}
              className={`btn px-2.5 py-1 text-xs ${brushSize === s ? 'btn-orange' : 'btn-slate'}`}>
              {s}px
            </button>
          ))}
          <button onClick={clearWhiteboard} className="btn btn-red px-3 py-1 text-xs">Clear Board</button>
        </div>
      </div>
      <div className="glass-panel rounded-2xl flex-1 overflow-hidden relative border border-slate-800">
        <canvas ref={canvasRef}
          onMouseDown={startDrawing} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onMouseMove={draw}
          onTouchStart={startDrawing} onTouchEnd={stopDrawing} onTouchMove={draw}
          className="cursor-crosshair w-full h-full block" style={{ touchAction: 'none' }} />
      </div>
      <p className="text-[10px] text-slate-500 text-center">Use the whiteboard to sketch place-value charts, fraction bars or any calculation steps.</p>
    </div>
  );
}

/* ===== TAB: Quiz ===== */
function QuizTab(){
  const qs = [
    {
      q: 'In the Egyptian system, 10 of one landmark become…',
      options: ['Nothing special', '1 of the next higher landmark', '10 of the previous landmark', 'A Roman numeral'],
      correct: 1,
      exp: 'Correct: 10 ones → 1 ten; 10 tens → 1 hundred. That is the carrying rule for any base-10 landmark system.',
      wrong: 'Not quite. In Egyptian numerals each landmark is a power of 10, so ten of one symbol are rewritten as one of the next higher symbol.'
    },
    {
      q: 'The Mesopotamian system is based on which number?',
      options: ['10', '20', '60', '5'],
      correct: 2,
      exp: 'Correct: Sexagesimal (base-60). Its influence remains in 60 seconds = 1 minute and 60 minutes = 1 hour.',
      wrong: 'Not quite. Mesopotamia used a base-60 (sexagesimal) system — still visible in our time and angle units.'
    },
    {
      q: 'What did the Mayans use as a symbol for zero?',
      options: ['A blank space', 'A seashell', 'A vertical rod', 'The letter O'],
      correct: 1,
      exp: 'Correct: A seashell (or similar oval glyph) was their placeholder for zero in the vertical place-value stack.',
      wrong: 'Not quite. The Mayan placeholder for zero was drawn as a seashell (or an oval shell-like glyph).'
    },
    {
      q: 'In Chinese rod numerals, Zongs and Hengs alternate because…',
      options: ['It looks decorative', 'To avoid confusing adjacent place values', 'Zongs are only for even numbers', 'Hengs cannot show zero'],
      correct: 1,
      exp: 'Correct: Alternating vertical (Zong) and horizontal (Heng) rods makes it easy to see where one place ends and the next begins.',
      wrong: 'Not quite. Alternating orientation prevents two neighbouring digits from looking like one long group of rods.'
    },
    {
      q: 'What made the Hindu number system free of ambiguity?',
      options: ['Using only 5 symbols', 'A symbol for zero in every position', 'Writing numbers vertically', 'Avoiding landmark numbers'],
      correct: 1,
      exp: 'Correct: With 0 as a digit in any position, 25, 205 and 250 are clearly different — no blank-space confusion.',
      wrong: 'Not quite. The breakthrough was treating 0 as a true digit (and later as a number), so every place is written explicitly.'
    },
    {
      q: 'In a base-5 system, multiplying a number by 5 is done by…',
      options: ['Doubling every digit', 'Appending a zero on the right', 'Reversing the digits', 'Adding 5 to each digit'],
      correct: 1,
      exp: 'Correct: ×5 shifts every digit one place left — the same idea as ×10 in base-10 (append a zero).',
      wrong: 'Not quite. In base-5, multiplying by the base itself appends a 0 on the right, just as ×10 appends 0 in decimal.'
    },
    {
      q: 'Which system first gave full arithmetic rules for zero as a number?',
      options: ['Egyptian', 'Roman', 'Hindu (Brahmagupta)', 'Mayan'],
      correct: 2,
      exp: 'Correct: Brahmagupta (628 CE) in Brahmasphutasiddhanta stated rules such as 0 + n = n and 0 × n = 0.',
      wrong: 'Not quite. Brahmagupta in India gave the first clear arithmetic rules treating zero as a number like any other.'
    },
    {
      q: 'Why is a pure base system better for multiplication than Roman numerals?',
      options: ['Fewer symbols overall', 'Product of two landmarks is again a landmark', 'No need for an abacus ever', 'Symbols are easier to carve'],
      correct: 1,
      exp: 'Correct: 10^a × 10^b = 10^(a+b) — another landmark. Roman landmarks (5 and 10 mixed) do not multiply so cleanly.',
      wrong: 'Not quite. In a pure base, powers multiply by adding exponents, so landmark × landmark stays a landmark — Roman numerals lack that.'
    },
  ];
  const [idx, setIdx] = useState(0);
  const [sel, setSel] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [show, setShow] = useState(false);

  const submit = i => {
    if (show) return;
    sound.playClick();
    setSel(i);
    setShow(true);
    if (i === qs[idx].correct) { setScore(s => s + 1); sound.playSuccess(); }
  };
  const next = () => {
    sound.playClick();
    if (idx + 1 >= qs.length) setDone(true);
    else { setIdx(idx + 1); setSel(null); setShow(false); }
  };
  const restart = () => { setIdx(0); setSel(null); setScore(0); setDone(false); setShow(false); sound.playClick(); };

  if (done) return (
    <div className="h-full flex items-center justify-center">
      <div className="glass-panel p-8 rounded-3xl max-w-md w-full text-center space-y-4">
        <div className="text-4xl">{score >= qs.length * 0.7 ? '🎉' : '📚'}</div>
        <h3 className="text-2xl font-black text-white">Quiz Complete</h3>
        <div className="text-3xl font-black text-orange-400">{score} / {qs.length}</div>
        <p className="text-xs text-slate-400">
          {score === qs.length ? 'Perfect! You have mastered the story of numbers.' :
           score >= qs.length * 0.7 ? 'Great work — review the few you missed.' :
           'Keep exploring the tabs and try again!'}
        </p>
        <button className="btn btn-orange px-6 py-2.5" onClick={restart}>Try Again</button>
      </div>
    </div>
  );

  const q = qs[idx];
  const isCorrect = sel === q.correct;

  return (
    <div className="h-full flex items-center justify-center overflow-y-auto pr-1">
      <div className="glass-panel p-6 rounded-3xl max-w-xl w-full space-y-4">
        <div className="flex justify-between items-center text-xs">
          <span className="text-slate-400 font-semibold">Question {idx + 1} of {qs.length}</span>
          <span className="bg-slate-800 text-orange-400 font-bold px-3 py-1 rounded-full">Score: {score}</span>
        </div>
        <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-orange-500 to-amber-400 transition-all" style={{ width: `${((idx + (show ? 1 : 0)) / qs.length) * 100}%` }} />
        </div>
        <h4 className="text-base font-bold text-white leading-snug">{q.q}</h4>
        <div className="space-y-2.5">
          {q.options.map((o, i) => {
            let cls = 'w-full text-left px-4 py-3.5 rounded-xl border-2 text-sm font-semibold transition flex items-center gap-3 cursor-pointer ';
            if (show) {
              if (i === q.correct) cls += 'bg-emerald-600/25 border-emerald-400 text-emerald-100';
              else if (i === sel) cls += 'bg-red-600/25 border-red-400 text-red-100';
              else cls += 'bg-slate-800/40 border-slate-700 text-slate-500';
            } else {
              cls += 'bg-slate-800 border-slate-600 text-white hover:border-orange-400 hover:bg-orange-600/15';
            }
            return (
              <button key={i} className={cls} onClick={() => submit(i)} disabled={show}>
                <span className={`w-8 h-8 rounded-lg flex items-center justify-center text-sm font-black flex-shrink-0 ${
                  show && i === q.correct ? 'bg-emerald-500 text-white' :
                  show && i === sel ? 'bg-red-500 text-white' :
                  'bg-orange-600 text-white'
                }`}>{String.fromCharCode(65 + i)}</span>
                <span>{o}</span>
              </button>
            );
          })}
        </div>
        {show && (
          <div className={`p-4 rounded-xl text-sm animate-fade-in leading-relaxed ${
            isCorrect
              ? 'bg-emerald-500/15 border border-emerald-500/40 text-emerald-200'
              : 'bg-amber-500/15 border border-amber-500/40 text-amber-100'
          }`}>
            <div className="font-bold mb-1.5 text-base">
              {isCorrect ? '✅ Correct!' : '❌ Incorrect'}
            </div>
            <div className="text-xs opacity-95">
              {isCorrect ? q.exp : q.wrong}
            </div>
            {!isCorrect && (
              <div className="mt-2 pt-2 border-t border-amber-500/30 text-xs text-emerald-300">
                <strong>Right answer:</strong> {q.options[q.correct]}
                <br />{q.exp}
              </div>
            )}
            <button className="btn btn-orange px-5 py-2 mt-3" onClick={next}>
              {idx + 1 < qs.length ? 'Next Question →' : 'See Results'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}
